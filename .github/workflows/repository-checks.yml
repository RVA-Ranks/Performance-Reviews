name: Repository checks

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apps-script-static-checks:
    name: Apps Script static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify required application files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "Code.gs"
            "V31_Automation.gs"
            "V31_Idempotency_Tests.gs"
            "Index.html"
            "appsscript.json"
            "README.md"
            "HANDOFF.md"
            "V31_TEST_PLAN.md"
          )

          missing=0

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error file=$file::Required application file is missing."
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Reject unresolved merge markers
        shell: bash
        run: |
          set -euo pipefail

          if grep -RIn \
            --exclude-dir=.git \
            --exclude="repository-checks.yml" \
            -E '^(<<<<<<<|=======|>>>>>>>)' .; then
            echo "::error::Unresolved merge markers were found."
            exit 1
          fi

      - name: Validate Apps Script manifest
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('fs');

          const manifestPath = 'appsscript.json';
          const manifest = JSON.parse(
            fs.readFileSync(manifestPath, 'utf8')
          );

          if (manifest.runtimeVersion !== 'V8') {
            throw new Error(
              `Expected runtimeVersion V8; received ${manifest.runtimeVersion}`
            );
          }

          if (manifest.timeZone !== 'America/New_York') {
            throw new Error(
              `Expected America/New_York; received ${manifest.timeZone}`
            );
          }

          if (!Array.isArray(manifest.oauthScopes)) {
            throw new Error('oauthScopes must be an array.');
          }

          console.log('Manifest validation passed.');
          NODE

      - name: Parse Apps Script source files
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t sources < <(find . -maxdepth 1 -type f -name '*.gs' | sort)

          if [[ "${#sources[@]}" -eq 0 ]]; then
            echo "::error::No Apps Script .gs source files were found."
            exit 1
          fi

          mkdir -p /tmp/aitheras-js-checks

          for source in "${sources[@]}"; do
            filename="$(basename "$source" .gs)"
            target="/tmp/aitheras-js-checks/${filename}.js"

            cp "$source" "$target"
            echo "Parsing $source"
            node --check "$target"
          done

      - name: Validate HTML shell
        shell: bash
        run: |
          set -euo pipefail

          grep -qi '<!doctype html>' Index.html \
            || {
              echo "::error file=Index.html::Missing HTML doctype."
              exit 1
            }

          grep -qi '</html>' Index.html \
            || {
              echo "::error file=Index.html::Missing closing html element."
              exit 1
            }

          grep -q 'google.script.run' Index.html \
            || {
              echo "::error file=Index.html::No Apps Script client bridge found."
              exit 1
            }

      - name: Verify critical public functions
        shell: bash
        run: |
          set -euo pipefail

          required_functions=(
            "doGet"
            "getReviewBootstrapData"
            "getReviewCycle"
            "createReviewCycle"
            "saveManagerReview"
            "saveSelfEvaluation"
            "signReviewCycle"
            "runReviewAutomationTrigger_"
            "runReviewAutomationNow"
            "upgradeToV31_"
            "retryReviewLaunch"
            "retryReviewFinalization"
          )

          combined_sources="$(cat ./*.gs)"

          for function_name in "${required_functions[@]}"; do
            if ! grep -Eq \
              "function[[:space:]]+${function_name}[[:space:]]*\(" \
              <<< "$combined_sources"; then
              echo "::error::Missing required function: ${function_name}"
              exit 1
            fi
          done

      - name: Verify idempotency test entry points
        shell: bash
        run: |
          set -euo pipefail

          if ! grep -Eq \
            'function[[:space:]]+runV31IdempotencyTests_[[:space:]]*\(' \
            V31_Idempotency_Tests.gs; then
            echo \
              "::error file=V31_Idempotency_Tests.gs::Missing runV31IdempotencyTests_()."
            exit 1
          fi

          if [[ -f V31_Finalization_Tests.gs ]]; then
            if ! grep -Eq \
              'function[[:space:]]+runV31FinalizationTests_[[:space:]]*\(' \
              V31_Finalization_Tests.gs; then
              echo \
                "::error file=V31_Finalization_Tests.gs::Missing runV31FinalizationTests_()."
              exit 1
            fi
          fi

          if ! grep -Eq \
            'function[[:space:]]+runV31WorkflowNotificationTests_[[:space:]]*\(' \
            V31_Workflow_Notification_Tests.gs; then
            echo \
              "::error file=V31_Workflow_Notification_Tests.gs::Missing runV31WorkflowNotificationTests_()."
            exit 1
          fi
