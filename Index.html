/**
 * Single meeting-save controller. Captures localRevision at request start.
 * Obsolete responses must never clear a newer dirty draft.
 */
async function saveMeetingNotesController_(options) {
  const opts = options || {};
  if (!currentCycle || !currentCycle.cycleId) {
    return { ok: false, error: 'No cycle' };
  }
  if (meetingSaveInFlight) {
    try { await meetingSaveInFlight; } catch (error) {}
  }
  if (!meetingDirty && !opts.force) {
    return {
      ok: true,
      skipped: true,
      capturedRevision: meetingLocalRevision,
      stillCurrent: true,
      contentRevision: currentCycle.meetingContentRevision
    };
  }
  if (!navigator.onLine) {
    return { ok: false, error: 'You are offline. Meeting notes were kept on this device.' };
  }
  if (String(currentCycle.status) !== 'Review Meeting Open' && !opts.allowSealedProbe) {
    return { ok: false, error: 'Meeting notes can only be saved while the meeting is open.' };
  }

  const capturedRevision = meetingLocalRevision;
  const payload = deepClone(meetingDraft);
  const method = opts.manual ? 'saveMeetingOutcomes' : 'autosaveMeetingOutcomes';
  setSaveIndicator('saving', opts.indicator || 'Saving meeting notes…');

  const run = (async function() {
    const result = await server(method, currentCycle.cycleId, payload);
    const stillCurrent = capturedRevision === meetingLocalRevision;
    if (result.alreadySealed || result.preserveLocalDraft) {
      meetingDraftPreserveAfterSeal = true;
      liveReleaseBannerVisible = true;
      setSaveIndicator('error', 'Notes not sealed on server');
      return {
        ok: false,
        alreadySealed: true,
        preserveLocalDraft: true,
        capturedRevision: capturedRevision,
        stillCurrent: stillCurrent,
        result: result,
        message: result.message
      };
    }
    if (stillCurrent) {
      meetingDirty = false;
      meetingDraft.lastSavedAt = result.savedAtIso;
      if (result.contentRevision != null) {
        currentCycle.meetingContentRevision = result.contentRevision;
      }
      try { localStorage.removeItem(meetingStorageKey()); } catch (error) {}
      setSaveIndicator('saved', 'Saved ' + (result.savedAt || ''));
    } else {
      setSaveIndicator('unsaved', 'Unsaved meeting notes');
    }
    return {
      ok: true,
      capturedRevision: capturedRevision,
      stillCurrent: stillCurrent,
      contentRevision: result.contentRevision,
      result: result
    };
  })();

  meetingSaveInFlight = run.then(
    function(value) { return value; },
    function(error) {
      setSaveIndicator('error', 'Meeting notes not synced');
      throw error;
    }
  ).finally(function() {
    if (meetingSaveInFlight && meetingSaveInFlight.then) {
      // cleared below after awaiters settle
    }
  });

  try {
    const outcome = await meetingSaveInFlight;
    return outcome;
  } finally {
    meetingSaveInFlight = null;
  }
}

async function autosaveMeeting() {
  if (!meetingDirty || !navigator.onLine || !currentCycle || currentCycle.status !== 'Review Meeting Open') return;
  try {
    const outcome = await saveMeetingNotesController_({ manual: false });
    if (outcome.alreadySealed) {
      showToast(
        'warning',
        'Keep your meeting notes',
        'Signatures were released before this device finished saving. Copy your text before continuing — it was not deleted from this browser.'
      );
      renderCycleWorkspace();
    }
  } catch (error) {
    showToast('warning', 'Meeting notes not synced', 'The browser copy is safe and will retry.');
    meetingAutosaveTimer = setTimeout(autosaveMeeting, 15000);
  }
}

async function manualSaveMeeting() {
  try {
    const outcome = await saveMeetingNotesController_({ manual: true, force: true });
    if (outcome.alreadySealed) {
      showToast(
        'warning',
        'Keep your meeting notes',
        (outcome.result && outcome.result.message) ||
          'Meeting notes are sealed on the server. Your local text was preserved so you can copy it.'
      );
      renderCycleWorkspace();
      return;
    }
    if (outcome.ok && outcome.stillCurrent) {
      showToast('success', 'Meeting notes saved', (outcome.result && outcome.result.message) || 'Saved.');
      if (outcome.result && outcome.result.auditWarning) {
        showToast('warning', 'Audit trail', outcome.result.auditWarning);
      }
    } else if (outcome.ok && !outcome.stillCurrent) {
      showToast('info', 'Newer edits pending', 'Earlier notes saved. Newer edits are still unsaved.');
    }
  } catch (error) {
    showToast('error', 'Could not save meeting notes', errorMessage(error));
  }
}

/**
 * Flush dirty meeting drafts to authority. Never clears localStorage unless
 * the returned save still matches the current local revision.
 * Concurrent callers await the same Promise (no boolean rejection race).
 */
async function flushMeetingDraftForRelease_() {
  if (!currentCycle) {
    return { ok: false, flushed: false, error: 'No cycle' };
  }
  if (meetingReleaseFlushInFlight) {
    try {
      return await meetingReleaseFlushInFlight;
    } catch (error) {
      return { ok: false, flushed: false, error: errorMessage(error) };
    }
  }

  const run = (async function() {
    if (meetingSaveInFlight) {
      try { await meetingSaveInFlight; } catch (error) {}
    }
    if (!meetingDirty) {
      return {
        ok: true,
        flushed: false,
        contentRevision: currentCycle.meetingContentRevision
      };
    }
    const outcome = await saveMeetingNotesController_({
      manual: true,
      force: true,
      indicator: 'Saving meeting notes before release…'
    });
    if (outcome.alreadySealed || outcome.preserveLocalDraft) {
      return {
        ok: false,
        flushed: false,
        alreadySealed: true,
        preserveLocalDraft: true,
        message: outcome.message || (outcome.result && outcome.result.message)
      };
    }
    if (!outcome.ok) {
      return { ok: false, flushed: false, error: outcome.error || 'Meeting notes could not be saved.' };
    }
    if (!outcome.stillCurrent || meetingDirty) {
      return {
        ok: false,
        flushed: false,
        needsRetry: true,
        error: 'Newer meeting edits arrived while saving. Retrying…'
      };
    }
    return {
      ok: true,
      flushed: true,
      contentRevision: outcome.contentRevision,
      result: outcome.result
    };
  })();

  meetingReleaseFlushInFlight = run;
  try {
    return await run;
  } catch (error) {
    return { ok: false, flushed: false, error: errorMessage(error) };
  } finally {
    if (meetingReleaseFlushInFlight === run) {
      meetingReleaseFlushInFlight = null;
    }
  }
}

/**
 * UX-only 120s reminder while waiting for the other participant ACK.
 * Does not open a second getLiveReviewState RPC stream — live polling owns that.
 */
function scheduleMeetingReleaseWaitTimeout_(cycleId) {
  if (window.__meetingReleaseWaitTimer) {
    clearTimeout(window.__meetingReleaseWaitTimer);
    window.__meetingReleaseWaitTimer = null;
  }
  const watchedId = String(cycleId || '');
  window.__meetingReleaseWaitTimer = setTimeout(function() {
    window.__meetingReleaseWaitTimer = null;
    if (!currentCycle || String(currentCycle.cycleId) !== watchedId) return;
    const status = String(currentCycle.status || '');
    if (
      status === 'Awaiting Signatures' ||
      status === 'Finalizing' ||
      status === 'Complete'
    ) {
      return;
    }
    if (!currentCycle.meetingReleasePending && !currentCycle.releaseRequestId) {
      return;
    }
    const missing = currentCycle.missingReleaseAcks || [];
    let waitingFor = 'the other participant';
    if (missing.length === 1) {
      waitingFor = 'the ' + missing[0];
    } else if (missing.length > 1) {
      waitingFor = missing.join(' and ');
    }
    showToast(
      'warning',
      'Waiting for participant sync',
      'The packet is not sealed yet. Keep this page open until ' +
        waitingFor +
        ' acknowledges.'
    );
  }, MEETING_RELEASE_ACK_WAIT_MS);
}

function clearMeetingReleaseWaitTimeout_() {
  if (window.__meetingReleaseWaitTimer) {
    clearTimeout(window.__meetingReleaseWaitTimer);
    window.__meetingReleaseWaitTimer = null;
  }
}

function sleepMs_(ms) {
  return new Promise(function(resolve) {
    setTimeout(resolve, ms);
  });
}

function warnSignatureReleaseEmailAcceleration_(emailResult, error) {
  if (error) {
    showToast(
      'warning',
      'Signature emails',
      'Signatures are available now. One or more email notices are pending in the durable workflow queue and may require HR recovery. ' +
        errorMessage(error)
    );
    return;
  }
  if (shouldWarnSignatureReleaseEmailAcceleration_(emailResult)) {
    showToast(
      'warning',
      'Signature emails',
      'Signatures are available now. One or more email notices are pending in the durable workflow queue and may require HR recovery.'
    );
  }
}

function accelerateSignatureReleaseEmails_(cycleId) {
  const id = String(cycleId || '');
  if (!id) return;
  if (!window.__signatureEmailAccelByCycle) {
    window.__signatureEmailAccelByCycle = {};
  }
  if (window.__signatureEmailAccelByCycle[id]) {
    return;
  }
  window.__signatureEmailAccelByCycle[id] = true;
  server('accelerateSignatureReleaseNotifications', id)
    .then(function(emailResult) {
      warnSignatureReleaseEmailAcceleration_(emailResult);
    })
    .catch(function(error) {
      // Allow one retry if the first attempt failed before outbox claim.
      window.__signatureEmailAccelByCycle[id] = false;
      warnSignatureReleaseEmailAcceleration_(null, error);
    });
}

function restoreDocumentTitle_() {

    document.title = defaultDocumentTitle;
  }
}

/**
 * Client mirror of shouldRestoreLiveReviewDocumentTitle_ (Apps Script helper).
 * Keep Signature Ready visible while the tab remains hidden.
 */
function shouldRestoreLiveReviewDocumentTitle_(isDocumentHidden) {
  return isDocumentHidden !== true;
}

function shouldWarnSignatureReleaseEmailAcceleration_(result) {
  return !(result && result.ok === true);
}

function shouldPollLiveReview_() {
  if (!currentCycle || currentView !== 'cycle') return false;
  if (currentCycle.historicalPreviousReview) return false;
  const status = String(currentCycle.status || '');
  return (
    status === 'Review Meeting Open' ||
    status === 'Awaiting Signatures' ||
    status === 'Finalizing'
  );
}

function stopLiveReviewPolling_() {
  liveReviewPollGeneration += 1;
  liveReviewRequestToken += 1;
  // Do not clear liveReviewPollInFlight here — the in-flight request's
  // finally owns that flag so a superseded response cannot strand polling.
  if (liveReviewPollTimer) {
    clearTimeout(liveReviewPollTimer);
    liveReviewPollTimer = null;
  }
}

function startLiveReviewPolling_() {
  stopLiveReviewPolling_();
  if (!shouldPollLiveReview_()) return;
  if (liveReviewPollInFlight) {
    // Wait for the superseded request to release the in-flight flag.
    liveReviewPollResumeAfterInFlight = true;
    return;
  }
  liveReviewPollResumeAfterInFlight = false;
  scheduleNextLiveReviewPoll_();
}

function handleLiveReviewVisibilityChange_() {
  if (!document.hidden) {
    restoreDocumentTitle_();
  }
  if (!shouldPollLiveReview_()) return;
  if (liveReviewPollTimer) {
    clearTimeout(liveReviewPollTimer);
    liveReviewPollTimer = null;
  }
  scheduleNextLiveReviewPoll_();
}

function scheduleNextLiveReviewPoll_() {
  if (liveReviewPollTimer) {
    clearTimeout(liveReviewPollTimer);
    liveReviewPollTimer = null;
  }
  if (!shouldPollLiveReview_()) return;
  const gen = liveReviewPollGeneration;
  const releasePending = !!(
    currentCycle &&
    (currentCycle.meetingReleasePending ||
      currentCycle.releaseRequestId)
  );
  const delay = releasePending
    ? LIVE_REVIEW_POLL_RELEASE_PENDING_MS
    : document.hidden
      ? LIVE_REVIEW_POLL_HIDDEN_MS
      : LIVE_REVIEW_POLL_VISIBLE_MS;
  liveReviewPollTimer = setTimeout(function() {
    if (gen !== liveReviewPollGeneration) return;
    pollLiveReviewState_();
  }, delay);
}

async function pollLiveReviewState_() {
  if (liveReviewPollInFlight) {
    // Owner's finally schedules the next tick when generation still matches.
    return;
  }
  if (!shouldPollLiveReview_()) return;

  liveReviewPollInFlight = true;
  const cycleId = currentCycle.cycleId;
  const gen = liveReviewPollGeneration;
  const token = ++liveReviewRequestToken;

  try {
    const live = await server('getLiveReviewState', cycleId);
    if (gen !== liveReviewPollGeneration) return;
    if (token !== liveReviewRequestToken) return;
    if (!currentCycle || String(currentCycle.cycleId) !== String(cycleId)) return;
    liveReviewConsecutiveFailures = 0;
    liveReviewLastSyncedAt = Date.now();
    if (liveReviewSyncDelayed) {
      liveReviewSyncDelayed = false;
      renderCycleWorkspace();
    }
    applyLiveReviewState_(live);
  } catch (error) {
    liveReviewConsecutiveFailures += 1;
    if (liveReviewConsecutiveFailures >= 3 && !liveReviewSyncDelayed) {
      liveReviewSyncDelayed = true;
      renderCycleWorkspace();
    }
  } finally {
    // Always release the flag this request acquired.
    liveReviewPollInFlight = false;
    if (liveReviewPollResumeAfterInFlight) {
      liveReviewPollResumeAfterInFlight = false;
      if (shouldPollLiveReview_()) {
        scheduleNextLiveReviewPoll_();
      }
    } else if (gen === liveReviewPollGeneration) {
      scheduleNextLiveReviewPoll_();
    }
  }
}

function liveStateIsStale_(incoming) {
  if (!incoming || !incoming.updatedAtIso || !currentCycle) return false;
  const previous = String(currentCycle.updatedAtIso || '');
  if (!previous) return false;
  const nextMs = Date.parse(String(incoming.updatedAtIso));
  const prevMs = Date.parse(previous);
  if (!Number.isFinite(nextMs) || !Number.isFinite(prevMs)) return false;
  return nextMs < prevMs;
}

function shouldKickFinalizationContinuationAsLeader_(options) {
  return !!(options && options.asLeader);
}

function maybeKickFinalizationContinuation_(live, options) {
  // Only the HR signature leader kicks finalization. Other browsers poll.
  if (!shouldKickFinalizationContinuationAsLeader_(options)) return;
  if (!live || String(live.status) !== 'Finalizing') return;
  const cycleId = String(live.cycleId || '');
  if (!cycleId) return;
  if (finalizationKickAttemptedForCycle === cycleId) return;
  finalizationKickAttemptedForCycle = cycleId;
  kickFinalizationContinuationWithRetry_(cycleId, 0);
}

function kickFinalizationContinuationWithRetry_(cycleId, attempt) {
  const maxAttempts = 3;
  const delaysMs = [0, 4000, 5000];
  const run = function() {
    server('continueReviewFinalization', cycleId)
      .then(function(result) {
        if (result && result.status) {
          applyLiveReviewState_({
            cycleId: cycleId,
            status: result.status,
            updatedAtIso: result.updatedAtIso || '',
            signatureState: currentCycle && currentCycle.signatureState,
            signatureTasks: [],
            signatureTaskReady: false
          });
        }
        if (result && result.ok === false && attempt + 1 < maxAttempts) {
          setTimeout(function() {
            kickFinalizationContinuationWithRetry_(cycleId, attempt + 1);
          }, delaysMs[attempt + 1] || 5000);
          return;
        }
        if (result && result.ok === false) {
          showToast(
            'warning',
            'Signature recorded',
            'Final document processing needs HR recovery. Use Retry Finalization from System Health if the review stays Finalizing.'
          );
        }
      })
      .catch(function() {
        if (attempt + 1 < maxAttempts) {
          setTimeout(function() {
            kickFinalizationContinuationWithRetry_(cycleId, attempt + 1);
          }, delaysMs[attempt + 1] || 5000);
          return;
        }
        showToast(
          'warning',
          'Signature recorded',
          'Final document processing needs HR recovery. Use Retry Finalization from System Health if the review stays Finalizing.'
        );
      });
  };
  if (!attempt) {
    run();
    return;
  }
  setTimeout(run, delaysMs[attempt] || 4000);
}

function patchCycleFromLiveState_(live) {
  if (!currentCycle || !live) return;
  if (String(live.cycleId) !== String(currentCycle.cycleId)) return;
  if (liveStateIsStale_(live)) return;

  currentCycle.status = live.status || currentCycle.status;
  if (typeof live.signaturesReleasedAt !== 'undefined') {
    currentCycle.signaturesReleasedAt = live.signaturesReleasedAt;
  }
  if (typeof live.managerReleaseAcked !== 'undefined') {
    currentCycle.managerReleaseAcked = !!live.managerReleaseAcked;
  }
  if (typeof live.employeeReleaseAcked !== 'undefined') {
    currentCycle.employeeReleaseAcked = !!live.employeeReleaseAcked;
  }
  if (typeof live.releaseRequestId !== 'undefined') {
    currentCycle.releaseRequestId = live.releaseRequestId;
  }
  if (typeof live.meetingReleasePending !== 'undefined') {
    currentCycle.meetingReleasePending = !!live.meetingReleasePending;
  }
  if (live.updatedAtIso) currentCycle.updatedAtIso = live.updatedAtIso;
  if (live.signatureState) {
    currentCycle.signatureState = live.signatureState;
  }
  if (live.signatureTasks) {
    currentCycle.signatureTasks = live.signatureTasks;
  }
  if (String(live.status) === 'Awaiting Signatures') {
    currentCycle.canReleaseSignatures = false;
    currentCycle.canEditManagerMeeting = false;
    currentCycle.canEditEmployeeMeeting = false;
  }
  if (live.signatureTaskReady) {
    currentCycle.actionKey = 'signature';
  }
  if (String(live.status) === 'Complete') {
    stopLiveReviewPolling_();
  }

  // Keep Home/Reviews list badges roughly in sync when the cycle is visible there.
  if (state && Array.isArray(state.cycles)) {
    state.cycles.forEach(function(row) {
      if (String(row.cycleId) !== String(live.cycleId)) return;
      row.status = live.status || row.status;
      if (live.signatureState) row.signatureState = live.signatureState;
      if (typeof live.signaturesReleasedAt !== 'undefined') {
        row.signaturesReleasedAt = live.signaturesReleasedAt;
      }
      if (live.signatureTaskReady) {
        row.actionKey = 'signature';
      }
    });
    try {
      updateSignatureNavCount_();
    } catch (error) {
      // Optional UI sync.
    }
  }
}

function updateSignatureNavCount_() {
  const badge = document.getElementById('signatureNavCount');
  if (!badge || !state || !Array.isArray(state.cycles)) return;
  const count = state.cycles.filter(function(cycle) {
    return cycle.actionKey === 'signature';
  }).length;
  badge.textContent = String(count);
  badge.classList.toggle('hidden', !count);
}

function applyReleaseLiveState_(live) {
  if (!currentCycle || !live) return;
  patchCycleFromLiveState_(live);
  liveReleaseBannerVisible = false;
  meetingDirty = false;
  currentCycleTab = 'signatures';
  preferredCycleAction = 'signatures';
  restoreDocumentTitle_();
  renderCycleWorkspace();
  setTopbar(
    currentCycle.employeeName + ' — ' + currentCycle.reviewType,
    humanStatus(currentCycle.status)
  );
  startLiveReviewPolling_();
}

function refreshLiveSignatureStatusDisplay_() {
  const stateSig = (currentCycle && currentCycle.signatureState) || {};
  const rows = document.querySelectorAll('[data-live-sig-role]');
  if (!rows || !rows.length) return false;
  rows.forEach(function(row) {
    const role = row.getAttribute('data-live-sig-role');
    let label = 'Pending';
    let tone = '';
    if (role === 'Manager') {
      label = stateSig.managerSigned ? 'Signed' : 'Pending';
    } else if (role === 'Employee') {
      label = stateSig.employeeSigned ? 'Signed' : 'Pending';
    } else if (role === 'HR') {
      label = stateSig.hrSigned
        ? 'Signed'
        : stateSig.managerSigned && stateSig.employeeSigned
          ? 'Ready to sign'
          : 'Waiting for participants';
    }
    if (label === 'Signed') tone = 'green';
    else if (label === 'Ready to sign') tone = 'amber';
    row.innerHTML = statusPill(label, tone);
  });
  return true;
}

async function flushAndAcknowledgeMeetingRelease_() {
  if (!currentCycle || !currentCycle.cycleId) {
    return { ok: false, error: 'No cycle' };
  }
  // Wait for any in-flight save, then flush until local revision is durable.
  for (let attempt = 0; attempt < 5; attempt++) {
    if (meetingSaveInFlight) {
      try { await meetingSaveInFlight; } catch (error) {}
    }
    if (!meetingDirty) break;
    const flushed = await flushMeetingDraftForRelease_();
    if (flushed.needsRetry) {
      await sleepMs_(150);
      continue;
    }
    if (!flushed.ok) {
      return {
        ok: false,
        flushFailed: true,
        preserveLocalDraft: !!flushed.preserveLocalDraft,
        error: flushed.error || flushed.message || 'Meeting notes could not be saved.'
      };
    }
  }
  if (meetingDirty) {
    return {
      ok: false,
      flushFailed: true,
      error: 'Meeting notes are still changing. Stop typing, wait for save, then continue.'
    };
  }
  const requestId = String(currentCycle.releaseRequestId || '').trim();
  if (!requestId) {
    return { ok: false, error: 'releaseRequestId is required before acknowledgement.' };
  }
  const contentRevision = Number(currentCycle.meetingContentRevision || 0);
  try {
    const live = await server('acknowledgeMeetingRelease', currentCycle.cycleId, {
      releaseRequestId: requestId,
      contentRevision: contentRevision
    });
    if (live && live.auditWarning) {
      showToast('warning', 'Audit trail', live.auditWarning);
    }
    meetingLastAckedLocalRevision = meetingLocalRevision;
    return { ok: true, live: live };
  } catch (error) {
    return { ok: false, error: errorMessage(error) };
  }
}

function applyLiveReviewState_(live) {
  if (!currentCycle || !live) return;
  if (String(live.cycleId) !== String(currentCycle.cycleId)) return;
  if (liveStateIsStale_(live)) return;

  const previousStatus = String(currentCycle.status || '');
  const previousReleased = String(currentCycle.signaturesReleasedAt || '');
  const previousSig = JSON.stringify(currentCycle.signatureState || {});
  const wasReleasePending = !!currentCycle.meetingReleasePending;
  const previousManagerAcked = !!currentCycle.managerReleaseAcked;
  const previousEmployeeAcked = !!currentCycle.employeeReleaseAcked;
  patchCycleFromLiveState_(live);
  currentCycle.meetingReleasePending = !!live.meetingReleasePending;
  currentCycle.releaseRequestId = live.releaseRequestId || '';
  currentCycle.meetingReleaseRequestedAtIso = live.meetingReleaseRequestedAtIso || '';
  currentCycle.meetingContentRevision = live.meetingContentRevision;
  currentCycle.missingReleaseAcks = live.missingReleaseAcks || [];
  currentCycle.managerReleaseAcked = !!live.managerReleaseAcked;
  currentCycle.employeeReleaseAcked = !!live.employeeReleaseAcked;

  if (
    previousStatus !== String(live.status || '') &&
    (String(live.status) === 'Finalizing' ||
      String(live.status) === 'Complete')
  ) {
    renderCycleWorkspace();
    setTopbar(
      currentCycle.employeeName + ' — ' + currentCycle.reviewType,
      humanStatus(currentCycle.status)
    );
    if (String(live.status) === 'Complete') {
      stopLiveReviewPolling_();
    }
    return;
  }

  if (
    live.meetingReleasePending &&
    String(live.status) === 'Review Meeting Open' &&
    (currentCycle.isManager || currentCycle.isEmployee)
  ) {
    const needsAck =
      (currentCycle.isManager && !live.managerReleaseAcked) ||
      (currentCycle.isEmployee && !live.employeeReleaseAcked);
    if (needsAck && !window.__meetingReleaseAckInFlight) {
      window.__meetingReleaseAckInFlight = true;
      flushAndAcknowledgeMeetingRelease_()
        .then(function(ackResult) {
          if (ackResult && ackResult.live) {
            applyLiveReviewState_(ackResult.live);
            if (
              ackResult.live.alreadyReleased ||
              String(ackResult.live.status) === 'Awaiting Signatures'
            ) {
              handleSignatureReleaseDetection_(ackResult.live);
            } else if (currentCycleTab === 'meeting') {
              renderActiveCycleTab();
            }
          } else if (ackResult && ackResult.flushFailed) {
            liveReleaseBannerVisible = true;
            showToast(
              'warning',
              'Meeting notes not synced',
              ackResult.error ||
                'Save your meeting notes so signature release can continue.'
            );
            renderCycleWorkspace();
          }
        })
        .finally(function() {
          window.__meetingReleaseAckInFlight = false;
        });
    } else if (
      (live.managerReleaseAcked && !previousManagerAcked) ||
      (live.employeeReleaseAcked && !previousEmployeeAcked)
    ) {
      if (currentCycleTab === 'meeting') renderActiveCycleTab();
    }
  }

  const releasedTransition =
    (previousStatus === 'Review Meeting Open' &&
      String(live.status) === 'Awaiting Signatures') ||
    (!previousReleased && !!live.signaturesReleasedAt);

  if (releasedTransition) {
    handleSignatureReleaseDetection_(live);
  } else if (
    live.meetingReleasePending &&
    !wasReleasePending &&
    String(live.status) === 'Review Meeting Open'
  ) {
    showToast(
      'info',
      'Waiting for participant sync',
      live.message ||
        'Signature release is waiting for Manager and Employee acknowledgements.'
    );
    if (meetingDirty) {
      liveReleaseBannerVisible = true;
      renderCycleWorkspace();
    } else if (currentCycleTab === 'meeting') {
      renderActiveCycleTab();
    }
  } else if (currentCycleTab === 'signatures') {
    const pad = signaturePads.packetSignature;
    const padBusy = pad && pad.isEmpty === false;
    if (padBusy) {
      refreshLiveSignatureStatusDisplay_();
    } else if (previousSig !== JSON.stringify(currentCycle.signatureState || {})) {
      if (!refreshLiveSignatureStatusDisplay_()) {
        renderActiveCycleTab();
      }
    }
  } else {
    const pillHost = document.querySelector('.cycle-hero-actions');
    if (pillHost) {
      const actions = renderCycleHeaderActions(currentCycle);
      pillHost.innerHTML = statusPill(currentCycle.status) + actions;
    }
  }

  if (
    String(live.status) === 'Complete' ||
    String(live.status) === 'Cancelled'
  ) {
    stopLiveReviewPolling_();
  }
}

function handleSignatureReleaseDetection_(live) {
  clearMeetingReleaseWaitTimeout_();
  const isEmployee = !!(currentCycle && currentCycle.isEmployee);
  const isManager = !!(currentCycle && currentCycle.isManager);
  const isHr = !!(currentCycle && currentCycle.isHr);
  const cycleId = currentCycle && currentCycle.cycleId;

  // Common second-ACK seal path: accelerate durable signature notices once
  // per browser/cycle without reintroducing a second polling loop.
  if (cycleId) {
    accelerateSignatureReleaseEmails_(cycleId);
  }

  if (document.hidden) {
    document.title = 'Signature Ready — AITHERAS Review';
  }

  if (meetingDirty || meetingDraftPreserveAfterSeal) {
    meetingDraftPreserveAfterSeal = true;
    liveReleaseBannerVisible = true;
    renderCycleWorkspace();
    showToast(
      'warning',
      'Keep your meeting notes',
      'Signatures are ready, but this browser still has meeting text that may not be on the sealed packet. Copy anything you need before continuing.'
    );
    return;
  }

  liveReleaseBannerVisible = false;

  if (isEmployee || isManager || isHr) {
    showToast(
      'success',
      'Signatures are ready',
      isEmployee
        ? 'The review meeting has been finalized. Please review the acknowledgement and sign when ready.'
        : 'The review packet is ready for signatures.'
    );
    loadCycle(currentCycle.cycleId, 'signatures');
    return;
  }

  if (currentCycleTab === 'signatures') {
    renderActiveCycleTab();
  } else {
    renderCycleWorkspace();
  }
}

function openSignaturesAfterLiveRelease_() {
  liveReleaseBannerVisible = false;
  restoreDocumentTitle_();
  if (!currentCycle) return;
  loadCycle(currentCycle.cycleId, 'signatures');
}

async function releaseSignatures() {
  closeModal();
  if (!currentCycle || !currentCycle.cycleId) return;
  if (window.__releaseSignaturesInFlight) return;
  window.__releaseSignaturesInFlight = true;
  setSaveIndicator('saving', 'Syncing meeting notes…');
  try {
    // 1) Releaser must successfully save dirty notes before continuing.
    for (let attempt = 0; attempt < 5; attempt++) {
      if (!meetingDirty) break;
      const flushed = await flushMeetingDraftForRelease_();
      if (flushed.needsRetry) {
        await sleepMs_(150);
        continue;
      }
      if (!flushed.ok) {
        showToast(
          'error',
          'Could not release review packet',
          flushed.error ||
            'Your meeting notes could not be saved. Fix the save error before releasing.'
        );
        return;
      }
    }
    if (meetingDirty) {
      showToast(
        'error',
        'Could not release review packet',
        'Meeting notes are still changing. Stop typing, wait for save, then release again.'
      );
      return;
    }

    // 2) Create immutable releaseRequestId.
    let prep = await server('prepareReleaseReviewSignatures', currentCycle.cycleId);
    if (prep.alreadyReleased || String(prep.status) === 'Awaiting Signatures') {
      showToast('success', 'Signatures already released', prep.message || 'Signatures are ready.');
      applyReleaseLiveState_(prep);
      accelerateSignatureReleaseEmails_(currentCycle.cycleId);
      return;
    }
    if (prep.auditWarning) {
      showToast('warning', 'Audit trail', prep.auditWarning);
    }
    currentCycle.releaseRequestId = prep.releaseRequestId || '';
    currentCycle.meetingReleasePending = true;
    currentCycle.managerReleaseAcked = !!prep.managerReleaseAcked;
    currentCycle.employeeReleaseAcked = !!prep.employeeReleaseAcked;
    currentCycle.missingReleaseAcks = prep.missingReleaseAcks || [];
    startLiveReviewPolling_();

    // 3) Manager/Employee releaser acknowledges after local flush.
    if (currentCycle.isManager || currentCycle.isEmployee) {
      const ack = await flushAndAcknowledgeMeetingRelease_();
      if (!ack.ok) {
        showToast(
          'error',
          'Could not release review packet',
          ack.error || 'Could not acknowledge meeting release synchronization.'
        );
        return;
      }
      if (
        ack.live &&
        (ack.live.alreadyReleased ||
          String(ack.live.status) === 'Awaiting Signatures')
      ) {
        showToast('success', 'Review packet released', ack.live.message || 'Signatures are ready.');
        if (ack.live.auditWarning) {
          showToast('warning', 'Audit trail', ack.live.auditWarning);
        }
        applyReleaseLiveState_(ack.live);
        accelerateSignatureReleaseEmails_(currentCycle.cycleId);
        return;
      }
      if (ack.live) {
        applyLiveReviewState_(ack.live);
        prep = ack.live;
      }
    }

    // 4) Remaining ACKs: single live-review poller only (no private RPC loop).
    // Second ACK seals server-side; applyLiveReviewState_ opens Signatures.
    setSaveIndicator('saving', prep.message || 'Waiting for participant sync…');
    showToast(
      'info',
      'Waiting for participant sync',
      (prep && prep.message) ||
        'Signature release is waiting for Manager and Employee acknowledgements.'
    );
    startLiveReviewPolling_();
    scheduleMeetingReleaseWaitTimeout_(currentCycle.cycleId);
  } catch (error) {
    let reconciled = false;
    try {
      const live = await server('getLiveReviewState', currentCycle.cycleId);
      if (
        live &&
        (String(live.status) === 'Awaiting Signatures' ||
          String(live.status) === 'Finalizing' ||
          String(live.status) === 'Complete' ||
          live.signaturesReleasedAt)
      ) {
        showToast(
          'success',
          'Signatures already released',
          'The packet was already released. Opening the signature workspace.'
        );
        applyReleaseLiveState_(live);
        accelerateSignatureReleaseEmails_(currentCycle.cycleId);
        reconciled = true;
      }
    } catch (reconcileError) {}
    if (!reconciled) {
      showToast('error', 'Could not release review packet', errorMessage(error));
    }
  } finally {
    window.__releaseSignaturesInFlight = false;
    try {
      updateGlobalSaveIndicator();
    } catch (indicatorError) {
      const indicator = document.getElementById('saveIndicator');
      if (indicator) indicator.classList.add('hidden');
    }
  }
}

  if (tasks.length && !cycle.historicalPreviousReview) {
    requestAnimationFrame(function () {
      initializeSignaturePad('packetSignature');
    });
  }
}

async function submitSignature() {
  const pad = signaturePads.packetSignature;
  if (!pad || pad.isEmpty) { showToast('error','Signature required','Draw your signature before continuing.'); return; }
  const button = document.getElementById('signPacketButton');
  setButtonBusy(button,true,'Recording signature…');
  const stages = [
    { label: 'Validating signature', state: 'active' },
    { label: 'Recording signature', state: 'pending' },
    { label: 'Updating signature status', state: 'pending' }
  ];
  showAppLoading_({
    title: 'Recording Signature',
    message: 'Please keep this window open while the signature is recorded.',
    stages: stages
  });

  let result = null;
  try {
    updateAppLoading_({
      title: 'Recording Signature',
      message: 'Recording your signature…',
      stages: [
        { label: 'Validating signature', state: 'done' },
        { label: 'Recording signature', state: 'active' },
        { label: 'Updating signature status', state: 'pending' }
      ]
    });
    result = await server('signReviewCycle', currentCycle.cycleId, croppedSignature('packetSignature'));
  } catch (error) {
    forceHideAppLoading_();
    setButtonBusy(button,false,'Sign Both Review Documents');
    showAppLoading_({
      title: 'Signature could not be recorded',
      message: 'Your review has not been lost. ' + errorMessage(error),
      hideSpinner: true,
      stages: []
    });
    const actions = document.getElementById('appLoadingActions');
    if (actions) {
      actions.classList.remove('hidden');
      actions.innerHTML = '<button class="button primary" id="signatureRetryButton">Try Again</button>';
      document.getElementById('signatureRetryButton').onclick = function() {
        forceHideAppLoading_();
        submitSignature();
      };
    }
    return;
  }

  if (result && result.recoveryRequired) {
    forceHideAppLoading_();
    setButtonBusy(button,false,'Sign Both Review Documents');
    showToast('warning', 'Signature recovery required', result.message || 'HR must reconcile the preserved signature artifact.');
    return;
  }

  if (!(result && result.signatureRecorded)) {
    forceHideAppLoading_();
    setButtonBusy(button,false,'Sign Both Review Documents');
    showToast('error', 'Signature could not be recorded', result && result.message ? result.message : 'Unknown signature result.');
    return;
  }

  try {
    updateAppLoading_({
      title: 'Signature Recorded',
      message: 'Updating signature status…',
      hideSpinner: false,
      stages: [
        { label: 'Validating signature', state: 'done' },
        { label: 'Recording signature', state: 'done' },
        { label: 'Updating signature status', state: 'active' }
      ]
    });
    applySignatureCommitLiveState_(result);
    showToast(
      result.partial ? 'warning' : 'success',
      'Signature recorded',
      result.message || 'Signature recorded.'
    );
    if (result.accelerateHrNotification) {
      server('accelerateHrSignatureNotification', currentCycle.cycleId)
        .then(function(emailResult) {
          if (emailResult && emailResult.ok === false) {
            showToast(
              'warning',
              'HR notification',
              'Your signature is recorded. The HR signature notice is pending in the durable workflow queue and may require HR recovery.'
            );
          }
        })
        .catch(function() {
          showToast(
            'warning',
            'HR notification',
            'Your signature is recorded. The HR signature notice is pending in the durable workflow queue and may require HR recovery.'
          );
        });
    }
    if (result.continueFinalization || result.finalizationDeferred) {
      maybeKickFinalizationContinuation_(
        {
          cycleId: currentCycle.cycleId,
          status: result.status || 'Finalizing'
        },
        { asLeader: true }
      );
      startLiveReviewPolling_();
    }
    forceHideAppLoading_();
  } catch (uiError) {
    forceHideAppLoading_();
    setButtonBusy(button, false, 'Sign Both Review Documents');
    showToast(
      'warning',
      'Signature recorded',
      'Signature recorded. Status refresh is delayed. ' + errorMessage(uiError)
    );
    // Do not offer Try Again for an authoritative commit.
  }
}

function applySignatureCommitLiveState_(result) {
  if (!currentCycle || !result) return;
  if (result.cycleId && String(result.cycleId) !== String(currentCycle.cycleId)) {
    return;
  }
  patchCycleFromLiveState_(result);
  currentCycleTab = 'signatures';
  preferredCycleAction = 'signatures';
  renderCycleWorkspace();
  setTopbar(
    currentCycle.employeeName + ' — ' + currentCycle.reviewType,
    humanStatus(currentCycle.status)
  );
  startLiveReviewPolling_();
}

function croppedSignature(canvasId){
  const canvas=document.getElementById(canvasId),context=canvas.getContext('2d'),width=canvas.width,height=canvas.height,pixels=context.getImageData(0,0,width,height).data;

function renderPreviousReviewPanel() {
  if (!currentCycle || currentCycle.historicalPreviousReview) return '';
  if (!(currentCycle.isManager || currentCycle.isHr)) return '';

  if (previousReviewContextLoading && previousReviewContextCycleId === currentCycle.cycleId && !previousReviewContext) {
    return '<div class="previous-review-loading" id="previousReviewPanel" role="status">Loading previous review context…</div>';
  }

  if (previousReviewContextCycleId === currentCycle.cycleId && previousReviewContext) {
    if (!previousReviewContext.found) {
      if (previousReviewContext.reason === 'LOOKUP_FAILED') {
        return '<div class="previous-review-error" id="previousReviewPanel" role="status">' +
          escapeHtml(previousReviewContext.message || 'Previous review context could not be loaded. The current review is still available.') +
          '</div>';
      }
      return '<div class="previous-review-empty" id="previousReviewPanel" role="status">' +
        escapeHtml(previousReviewContext.message || 'No previous completed review was found for this employee.') +
        '</div>';
    }

    const ctx = previousReviewContext;
    const expanded = isPreviousReviewExpanded();
    const heading = ctx.sameReviewType === false ? 'Most recent completed review' : 'Previous Review';
    const overall = (ctx.overallRating && ctx.overallRating.label) || 'Not Recorded';
    const goals = (ctx.goals || []).slice(0, 5);
    const factors = ctx.factorRatings || [];
    const badge = ctx.sameReviewType === false
      ? '<span class="previous-review-badge">Different review type</span>'
      : '';
    const collapsedGoals = goals.length
      ? '<div style="margin-top:8px"><strong>Key Goals</strong><ul class="previous-review-goals">' +
        goals.map(function(goal) { return '<li>' + escapeHtml(goal) + '</li>'; }).join('') +
        '</ul></div>'
      : '';

    return '<div class="previous-review-card" id="previousReviewPanel">' +
      '<details' + (expanded ? ' open' : '') +
      ' ontoggle="rememberPreviousReviewExpanded(this.open)">' +
      '<summary><div><p class="previous-review-title">' + escapeHtml(heading) + '</p>' +
      '<p class="previous-review-meta">' + escapeHtml(ctx.periodLabel || ctx.reviewType || 'Prior review') +
      ' · ' + escapeHtml(formatPreviousReviewCompleted(ctx.completedAt)) + '</p>' + badge +
      '<p class="previous-review-meta" style="margin-top:8px">Overall Score: ' + escapeHtml(overall) + '</p>' +
      collapsedGoals +
      '</div></summary>' +
      '<div class="previous-review-body">' +
      '<h4>Previous Overall Score</h4><p>' + escapeHtml(overall) +
      (ctx.previousManagerName ? ' · Manager: ' + escapeHtml(ctx.previousManagerName) : '') + '</p>' +
      '<h4>Previous Factor Ratings</h4>' +
      (factors.length
        ? '<div class="table-wrap"><table><thead><tr><th>Factor</th><th>Manager</th><th>Employee</th></tr></thead><tbody>' +
          factors.map(function(factor) {
            return '<tr><td>' + escapeHtml(factor.factorLabel || 'Historical factor') +
              (factor.historicalOnly ? ' <span class="previous-review-badge">Historical</span>' : '') +
              '</td><td>' + escapeHtml(String(factor.managerRating)) +
              '</td><td>' + escapeHtml(String(factor.employeeRating)) + '</td></tr>';
          }).join('') + '</tbody></table></div>'
        : '<p>Not Recorded</p>') +
      '<h4>Previous Manager Summary</h4><p>' + escapeHtml(ctx.managerSummary || 'Not Recorded') + '</p>' +
      '<h4>Previous Employee Summary</h4><p>' + escapeHtml(ctx.employeeSummary || 'Not Recorded') + '</p>' +
      '<h4>Previous Goals</h4>' +
      (goals.length
        ? '<ul class="previous-review-goals">' + goals.map(function(goal) { return '<li>' + escapeHtml(goal) + '</li>'; }).join('') + '</ul>'
        : '<p>Not Recorded</p>') +

function maybeLoadPreviousReviewContext() {
  if (!currentCycle || currentCycle.historicalPreviousReview) return;
  if (!(currentCycle.isManager || currentCycle.isHr)) return;
  if (previousReviewContextLoading && previousReviewContextCycleId === currentCycle.cycleId) return;
  if (previousReviewContextCycleId === currentCycle.cycleId && previousReviewContext) return;
  loadPreviousReviewContext(currentCycle.cycleId);
}

async function loadPreviousReviewContext(cycleId) {
  previousReviewContextLoading = true;
  previousReviewContextCycleId = cycleId;
  previousReviewContext = null;
  refreshPreviousReviewPanelIfVisible();
  try {
    const result = await server('getPreviousReviewContext', cycleId);
    if (currentCycle && currentCycle.cycleId === cycleId && !currentCycle.historicalPreviousReview) {
      previousReviewContext = result || {
        found: false,
        reason: 'NO_PREVIOUS_COMPLETED_REVIEW',
        message: 'No previous completed review was found for this employee.'
      };
      previousReviewContextLoading = false;
      refreshPreviousReviewPanelIfVisible();
    }
  } catch (error) {
    if (currentCycle && currentCycle.cycleId === cycleId && !currentCycle.historicalPreviousReview) {
      previousReviewContext = {
        found: false,
        reason: 'LOOKUP_FAILED',
        message: 'Previous review context could not be loaded. The current review is still available.'
      };
      previousReviewContextLoading = false;
      refreshPreviousReviewPanelIfVisible();
    }
  }
}

function refreshPreviousReviewPanelIfVisible() {
  if (!currentCycle || currentCycleTab !== 'manager' || currentCycle.historicalPreviousReview) return;
  if (!(currentCycle.isManager || currentCycle.isHr)) return;
  const panel = document.getElementById('previousReviewPanel');
  if (!panel || !panel.parentNode) return;
  const html = renderPreviousReviewPanel();
  const wrap = document.createElement('div');
  wrap.innerHTML = html;
  const next = wrap.firstChild;
  if (next) panel.parentNode.replaceChild(next, panel);
}

function syncRecommendationPercentFields(currentRate, currentAnnual) {
  const percentEl = document.getElementById('recommendedPercent');
  const rateEl = document.getElementById('recommendedPayRateDisplay');
  const annualEl = document.getElementById('recommendedAnnual');
  const increaseEl = document.getElementById('recommendedAnnualIncrease');
  if (!percentEl || !rateEl || !annualEl || !increaseEl) return;
  const percent = Number(percentEl.value);
  if (!Number.isFinite(percent) || percentEl.value === '') {
    rateEl.value = '';
    annualEl.value = '';
    increaseEl.value = '';
    return;
  }
  const rate = Math.round(currentRate * (1 + percent / 100) * 100) / 100;
  const annual = Math.round(rate * 2080 * 100) / 100;
  rateEl.value = formatMoneyDisplay(rate);
  annualEl.value = formatMoneyDisplay(annual);
  increaseEl.value = formatMoneyDisplay(annual - currentAnnual);
}

function applyCompensationMutationResult_(cycleId, result, defaults) {
  const onCycle =
    currentCycle && String(currentCycle.cycleId) === String(cycleId);
  if (onCycle) {
    if (!currentCycle.v31) currentCycle.v31 = {};
    if (result.cycleStatus) currentCycle.status = result.cycleStatus;
    if (typeof result.compensationComplete === 'boolean') {
      currentCycle.v31.compensationComplete = result.compensationComplete;
    }
    if (
      result.compensationDecision ||
      result.decision ||
      (defaults && defaults.decision)
    ) {
      currentCycle.v31.compensationDecision =
        result.compensationDecision ||
        result.decision ||
        defaults.decision;
    }
    if (
      result.compensationStatus ||
      result.status ||
      (defaults && defaults.status)
    ) {
      currentCycle.v31.compensationStatus =
        result.compensationStatus || result.status || defaults.status;
    }
    if (result.record) {
      currentCycle.v31.compensationRecord = result.record;
    } else if (result.ownerDecision && currentCycle.v31.compensationRecord) {
      currentCycle.v31.compensationRecord.ownerDecision = result.ownerDecision;
      if (result.status) {
        currentCycle.v31.compensationRecord.status = result.status;
      }
    }
    renderCycleWorkspace();
    setTopbar(
      currentCycle.employeeName + ' — ' + currentCycle.reviewType,
      humanStatus(currentCycle.status)
    );
  }

  reconcileCycleSummaryAfterCompensationMutation_(cycleId, result, defaults);
  refreshLocalSummaryViews_();

  // Administration Compensation Queue must update without opening the cycle.
  if (currentView === 'admin') {
    refreshCompensationQueue();
  }
}

function reconcileCycleSummaryAfterCompensationMutation_(
  cycleId,
  result,
  defaults
) {
  if (!state || !Array.isArray(state.cycles)) return;
  const summary = state.cycles.find(function(item) {
    return String(item.cycleId) === String(cycleId);
  });
  if (!summary) return;
  if (!summary.v31) summary.v31 = {};
  if (result.cycleStatus) summary.status = result.cycleStatus;
  if (typeof result.compensationComplete === 'boolean') {
    summary.v31.compensationComplete = result.compensationComplete;
  }
  if (
    result.compensationDecision ||
    result.decision ||
    (defaults && defaults.decision)
  ) {
    summary.v31.compensationDecision =
      result.compensationDecision ||
      result.decision ||
      defaults.decision;
  }
  if (
    result.compensationStatus ||
    result.status ||
    (defaults && defaults.status)
  ) {
    summary.v31.compensationStatus =
      result.compensationStatus || result.status || defaults.status;
  }
  if (result.record) {
    summary.v31.compensationRecord = result.record;
  }
  if (
    summary.actionKey === 'compensation' &&
    (result.compensationComplete || result.record)
  ) {
    summary.actionRequired = false;
    summary.actionKey = 'overview';
    summary.actionLabel = 'Open Review';
    summary.actionTone = 'outline';
  }
}

async function openOwnerDecisionModal(cycleId, isEdit) {
  try {
    const context = await server('getCompensationContext', cycleId);
    const record = context.record;
    if (!record) {
      showToast('error', 'No recommendation', 'No compensation record found.');
      return;
    }

    openModal({
      title: isEdit ? 'Edit Owner Decision' : 'Record Owner Decision',
      body:
        '<div class="notice" style="margin-bottom:12px">' +
        '<div>Current Pay Rate: <strong>' +
        escapeHtml(formatMoneyDisplay(record.originalPayRate)) +
        '</strong> · Annual <strong>' +
        escapeHtml(formatMoneyDisplay(record.originalAnnualSalary)) +
        '</strong></div>' +
        '<div>Manager Recommended: <strong>' +
        escapeHtml(String(record.managerRecommendedPercentDisplay)) +
        '%</strong> → ' +
        escapeHtml(formatMoneyDisplay(record.managerRecommendedPayRate)) +
        ' / ' +
        escapeHtml(formatMoneyDisplay(record.managerRecommendedAnnualSalary)) +
        '</div>' +
        (record.managerBusinessJustification
          ? '<div>Justification: ' +
            escapeHtml(record.managerBusinessJustification) +
            '</div>'
          : '') +
        '<div>Manager Proposed Effective Date: <strong>' +
        escapeHtml(record.managerProposedEffectiveDate || '') +
        '</strong></div>' +
        '</div>' +
        '<label class="modal-check"><input type="radio" name="ownerDecisionMode" value="approve" checked onchange="toggleOwnerDecisionFields()"> <span>Approve Recommendation</span></label>' +
        '<label class="modal-check"><input type="radio" name="ownerDecisionMode" value="override" onchange="toggleOwnerDecisionFields()"> <span>Approve Different Amount</span></label>' +
        '<label class="modal-check"><input type="radio" name="ownerDecisionMode" value="deny" onchange="toggleOwnerDecisionFields()"> <span>Decline Adjustment</span></label>' +
        '<div id="ownerOverrideFields" class="form-grid" style="display:none;margin-top:12px">' +
        '<div><label for="finalApprovedPercent">Final Approved % *</label><input id="finalApprovedPercent" type="number" min="0.01" step="0.01" placeholder="e.g. 8" oninput="syncOwnerOverridePreview(' +
        Number(record.originalPayRate) +
        ',' +
        Number(record.originalAnnualSalary) +
        ')"></div>' +
        '<div><label>Final Pay Rate</label><input id="finalApprovedPayRateDisplay" readonly></div>' +
        '<div><label>Final Annual Salary</label><input id="finalApprovedAnnualDisplay" readonly></div>' +
        '</div>' +
        '<div id="ownerNotesFields" class="form-grid" style="display:none;margin-top:12px">' +
        '<div class="wide"><label for="ownerDecisionNotes">Owner Decision Notes *</label><textarea id="ownerDecisionNotes"></textarea></div>' +
        '</div>' +
        '<div id="ownerApproveFields" class="form-grid" style="margin-top:12px">' +
        '<div><label for="ownerName">Owner Name *</label><input id="ownerName" required value="' +
        escapeAttr(record.ownerName || '') +
        '"></div>' +
        '<div id="ownerEffectiveDateWrap"><label for="compensationEffectiveDate">Effective Date *</label><input id="compensationEffectiveDate" type="date" required value="' +
        escapeAttr(toDateInputValue(record.compensationEffectiveDate || record.managerProposedEffectiveDate)) +
        '"></div>' +
        (isEdit
          ? '<div class="wide"><label for="ownerEditReason">Reason for correction *</label><textarea id="ownerEditReason" required></textarea></div>'
          : '') +
        '</div>',
      confirmLabel: isEdit ? 'Save Correction' : 'Record Owner Decision',
      tone: 'primary',
      onConfirm: function () {
        submitOwnerDecisionForm(cycleId, !!isEdit);
      }
    });
    toggleOwnerDecisionFields();
  } catch (error) {
    showToast('error', 'Could not open owner decision', errorMessage(error));
  }
}

function toggleOwnerDecisionFields() {
  const modeEl = document.querySelector(
    'input[name="ownerDecisionMode"]:checked'
  );
  const mode = modeEl ? modeEl.value : 'approve';
  const override = document.getElementById('ownerOverrideFields');
  const notes = document.getElementById('ownerNotesFields');
  const effectiveWrap = document.getElementById('ownerEffectiveDateWrap');
  if (override) {
    override.style.display = mode === 'override' ? 'grid' : 'none';
  }
  if (notes) {
    notes.style.display =
      mode === 'override' || mode === 'deny' ? 'grid' : 'none';
  }
  if (effectiveWrap) {
    effectiveWrap.style.display = mode === 'deny' ? 'none' : 'block';
  }
}

function syncOwnerOverridePreview(currentRate, currentAnnual) {
  const percentEl = document.getElementById('finalApprovedPercent');
  const rateEl = document.getElementById('finalApprovedPayRateDisplay');
  const annualEl = document.getElementById('finalApprovedAnnualDisplay');
  if (!percentEl || !rateEl || !annualEl) return;
  const percent = Number(percentEl.value);
  if (!Number.isFinite(percent) || percentEl.value === '') {
    rateEl.value = '';
    annualEl.value = '';
    return;
  }
  const rate = Math.round(currentRate * (1 + percent / 100) * 100) / 100;
  const annual = Math.round(rate * 2080 * 100) / 100;
  rateEl.value = formatMoneyDisplay(rate);
  annualEl.value = formatMoneyDisplay(annual);
}

function toDateInputValue(value) {
  if (!value) return '';
  const raw = String(value);
  if (/^\d{4}-\d{2}-\d{2}/.test(raw)) return raw.slice(0, 10);
  const date = new Date(raw);
  if (isNaN(date.getTime())) return '';
  const month = String(date.getMonth() + 1).padStart(2, '0');
  const day = String(date.getDate()).padStart(2, '0');
  return date.getFullYear() + '-' + month + '-' + day;
}

async function submitOwnerDecisionForm(cycleId, isEdit) {
  const modeEl = document.querySelector(
    'input[name="ownerDecisionMode"]:checked'
  );
  const mode = modeEl ? modeEl.value : 'approve';
  if (mode === 'deny') {
    if (
      !confirm(
        'Confirm Decline Adjustment?\n\nThe manager recommendation will be preserved for HR/manager audit, but the employee will never see that a recommendation existed. No CAF, history row, or pay-rate update will be created.'
      )
    ) {
      return;
    }
  }
  const payload = {
    mode: mode,
    ownerName: valueOf('ownerName'),
    compensationEffectiveDate: valueOf('compensationEffectiveDate'),
    finalApprovedPercent: valueOf('finalApprovedPercent'),
    ownerDecisionNotes: valueOf('ownerDecisionNotes'),
    reason: valueOf('ownerEditReason')
  };
  closeModal();
  try {
    const method = isEdit
      ? 'editCompensationOwnerDecision'
      : 'recordCompensationOwnerDecision';
    const result = await server(method, cycleId, payload);
    showToast('success', 'Owner decision saved', result.message);
    applyCompensationMutationResult_(cycleId, result, {
      decision:
        result.ownerDecision === 'Denied'
          ? 'No Adjustment Recommended'
          : 'Adjustment Recommended',
      status: result.status
    });
    if (result.accelerateNotifications) {
      server('accelerateCompensationOwnerOutcomeNotifications', cycleId).catch(
        function() {}
      );
    }
  } catch (error) {
    showToast('error', 'Could not save owner decision', errorMessage(error));
  }
}

function confirmResetCompensation(cycleId) {
  openModal({
    title: 'Reset compensation decision?',
    body:
      '<p>This returns the compensation decision to Pending.</p>' +
      '<label for="compResetReason">Reason *</label>' +
      '<textarea id="compResetReason" required></textarea>',
    confirmLabel: 'Reset to Pending',
    tone: 'warning',
    onConfirm: async function () {
      const reason = valueOf('compResetReason');
      closeModal();
      try {
        const result = await server(
          'resetCompensationDecision',
          cycleId,
          reason
        );
        showToast('success', 'Compensation reset', result.message);
        await loadCycle(cycleId, 'overview');
      } catch (error) {
        showToast('error', 'Could not reset', errorMessage(error));
      }
    }
  });
}

function recordCompensationChoice(cycleId, decision) {
  if (decision === 'No Adjustment Recommended') {
    confirmNoCompensationAdjustment(cycleId);
    return;
  }
  openCompensationDecisionModal(cycleId);
}

async function submitCompensationDecision(cycleId, decision, notes) {
  if (decision === 'No Adjustment Recommended') {
    try {
      const result = await server(
        'submitNoCompensationAdjustment',
        cycleId,
        notes || ''
      );
      showToast('success', 'Compensation decision recorded', result.message);
      applyCompensationMutationResult_(cycleId, result, {
        decision: 'No Adjustment Recommended',
        status: 'Complete'
      });
    } catch (error) {
      showToast('error', 'Could not record decision', errorMessage(error));
    }
  }
}

function rebuildNotifications() {
  const read = getReadNotificationSet();
  notificationItems = [];

  (state.cycles || []).forEach(function(cycle) {
    if (cycle.actionRequired) {
      const id =
        cycle.cycleId +
        ':' +
        cycle.actionKey +
        ':' +
        cycle.updatedAtIso;

      notificationItems.push({
        id: id,
        cycleId: cycle.cycleId,
        action: cycle.actionKey,
        title: cycle.actionLabel,
        meta:
          cycle.employeeName +
          ' · ' +
          cycle.reviewType,
        unread: !read.has(id),
        priority: 1,
      });
    }

    if (
      cycle.v31 &&
      cycle.v31.compensationActionRequired
    ) {
      const id =
        cycle.cycleId +
        ':compensation:' +
        cycle.updatedAtIso;

      if (
        !notificationItems.some(function(item) {
          return item.id === id;
        })
      ) {
        notificationItems.push({
          id: id,
          cycleId: cycle.cycleId,
          action: 'compensation',
          title: 'Compensation decision required',
          meta:
            cycle.employeeName +
            ' · Open the adjustment workflow or record no adjustment',
          unread: !read.has(id),
          priority: 0,
        });
      }
    }

    if (
      cycle.v31 &&
      Number.isFinite(
        Number(cycle.v31.daysUntilMeeting)
      ) &&
      Number(cycle.v31.daysUntilMeeting) <= 7 &&
      Number(cycle.v31.daysUntilMeeting) >= 0 &&
      cycle.status === 'Open for Input' &&
      cycle.actionRequired
    ) {
      const id =
        cycle.cycleId +
        ':deadline:' +
        cycle.reviewMeetingDateIso;

      notificationItems.push({
        id: id,
        cycleId: cycle.cycleId,
        action: cycle.actionKey,
        title:
          Number(cycle.v31.daysUntilMeeting) === 0
            ? 'Review meeting is today'
            : 'Review meeting in ' +
              cycle.v31.daysUntilMeeting +
              ' day(s)',
        meta:
          cycle.employeeName +
          ' · Complete your assigned work before the meeting',
        unread: !read.has(id),
        priority: 0,
      });
    }

    if (cycle.status === 'Complete') {
      const id =
        cycle.cycleId +
        ':complete:' +
        cycle.updatedAtIso;

      notificationItems.push({
        id: id,
        cycleId: cycle.cycleId,
        action: 'overview',
        title: 'Review completed',
        meta:
          cycle.employeeName +
          ' · Final documents available',
        unread: !read.has(id),
        priority: 3,
      });
    }
  });

  const helpId =
    'v31-help:' +
    (state.user && state.user.primaryRole
      ? state.user.primaryRole
      : 'User');

  notificationItems.push({
    id: helpId,
    cycleId: '',
    action: 'help',
    title: 'Step-by-step help is available',
    meta:
      'Open the How-To Guide at any point in the review process',
    unread: !read.has(helpId),
    priority: 4,
  });

  notificationItems.sort(function(a, b) {
    return a.priority - b.priority;
  });

  renderNotificationDrawer();
}

function renderNotificationDrawer() {
  const unread = notificationItems.filter(function(item){return item.unread;}).length;
  const badge=document.getElementById('notificationBadge');badge.textContent=unread;badge.classList.toggle('hidden',!unread);
  const body=document.getElementById('notificationDrawerBody');
  body.innerHTML=notificationItems.length?notificationItems.map(function(item){return '<button class="notification-item ' + (item.unread?'unread':'') + '" onclick="openNotification(\''+escapeAttr(item.id)+'\')"><span class="notification-dot"></span><span><span class="notification-title">'+escapeHtml(item.title)+'</span><span class="notification-meta">'+escapeHtml(item.meta)+'</span></span></button>';}).join(''):'<div class="empty-state"><strong>No notifications</strong>Action items and review updates will appear here.</div>';
}

function toggleNotifications(){const drawer=document.getElementById('notificationDrawer');const opening=!drawer.classList.contains('open');drawer.classList.toggle('open',opening);document.getElementById('drawerOverlay').classList.toggle('hidden',!opening);}
function closeNotifications(){document.getElementById('notificationDrawer').classList.remove('open');document.getElementById('drawerOverlay').classList.add('hidden');}
function openNotification(id){const item=notificationItems.find(function(entry){return entry.id===id;});if(!item)return;markNotificationRead(id);closeNotifications();if(item.action==='help'){navigate('help');return;}loadCycle(item.cycleId,item.action);}
function markNotificationRead(id){const read=getReadNotificationSet();read.add(id);localStorage.setItem(notificationReadKey(),JSON.stringify(Array.from(read)));notificationItems.forEach(function(item){if(item.id===id)item.unread=false;});renderNotificationDrawer();}
function markNotificationReadByCycle(cycleId,action){notificationItems.filter(function(item){return item.cycleId===cycleId&&(!action||item.action===action);}).forEach(function(item){markNotificationRead(item.id);});}
function markAllNotificationsRead(){const read=getReadNotificationSet();notificationItems.forEach(function(item){read.add(item.id);item.unread=false;});localStorage.setItem(notificationReadKey(),JSON.stringify(Array.from(read)));renderNotificationDrawer();}
function getReadNotificationSet(){try{return new Set(JSON.parse(localStorage.getItem(notificationReadKey())||'[]'));}catch(error){return new Set();}}
function notificationReadKey(){return 'aitheras-review-notifications:'+(state&&state.currentUserEmail||'user');}

function openModal(options) {
  modalCallback = options.onConfirm || null;
  document.getElementById('modalTitle').textContent = options.title || 'Confirm';
  let body = options.body || '';
  if (options.checks && options.checks.length) body += '<div id="modalChecklist">' + options.checks.map(function(check,index){return '<label class="modal-check"><input type="checkbox" onchange="updateModalConfirmation()"><span>'+escapeHtml(check)+'</span></label>';}).join('') + '</div>';
  document.getElementById('modalBody').innerHTML = body;
  const button=document.getElementById('modalConfirmButton');button.textContent=options.confirmLabel||'Confirm';button.className='button '+(options.tone||'primary');button.disabled=!!(options.checks&&options.checks.length);
  document.getElementById('modalOverlay').classList.remove('hidden');
}
function updateModalConfirmation(){const checks=Array.from(document.querySelectorAll('#modalChecklist input'));document.getElementById('modalConfirmButton').disabled=checks.some(function(check){return!check.checked;});}
function confirmModal(){const callback=modalCallback;modalCallback=null;if(callback)callback();}
function closeModal(){document.getElementById('modalOverlay').classList.add('hidden');modalCallback=null;}

function showToast(type,title,message,duration) {
  const id='toast-'+Date.now()+'-'+Math.floor(Math.random()*1000);const icons={success:'✓',warning:'△',error:'!',info:'i'};
  const container=document.getElementById('toastContainer');const toast=document.createElement('div');toast.id=id;toast.className='toast '+(type||'info');toast.innerHTML='<div class="toast-icon">'+(icons[type]||'i')+'</div><div><div class="toast-title">'+escapeHtml(title)+'</div><div class="toast-message">'+escapeHtml(message||'')+'</div></div><button class="toast-close" onclick="removeToast(\''+id+'\')">×</button>';container.appendChild(toast);setTimeout(function(){removeToast(id);},duration||5200);
}
function removeToast(id){const toast=document.getElementById(id);if(toast)toast.remove();}

function setSaveIndicator(status,text){const indicator=document.getElementById('saveIndicator');indicator.className='save-indicator '+status;indicator.classList.remove('hidden');document.getElementById('saveIndicatorText').textContent=text;}
function updateGlobalSaveIndicator(){
  if (currentCycleTab === 'meeting' && currentCycle && currentCycle.status === 'Review Meeting Open') {
    if (meetingDirty) setSaveIndicator('unsaved','Unsaved meeting notes');
    else if (meetingDraft && meetingDraft.lastSavedAt) setSaveIndicator('saved','Saved '+formatLocalDateTime(meetingDraft.lastSavedAt));
    else setSaveIndicator('saved','Autosave enabled');
    return;
  }
  const model=currentCycleTab==='manager'?editorState.manager:currentCycleTab==='self'?editorState.self:null;
  if(!model){document.getElementById('saveIndicator').classList.add('hidden');return;}
  if(model.saving)setSaveIndicator('saving','Saving…');
  else if(model.dirty)setSaveIndicator('unsaved','Unsaved changes');
  else if(model.lastSavedAt)setSaveIndicator('saved','Saved '+formatLocalDateTime(model.lastSavedAt));
  else setSaveIndicator('saved','Autosave enabled');
}

function handleOnlineStatus(){const offline=!navigator.onLine;document.getElementById('networkBanner').classList.toggle('hidden',!offline);if(!offline){if(editorState.manager.dirty)autosaveReview('manager');if(editorState.self.dirty)autosaveReview('self');if(meetingDirty)autosaveMeeting();}}
function handleBeforeUnload(event){if(editorState.manager.dirty||editorState.self.dirty||meetingDirty){event.preventDefault();event.returnValue='';}}

function showBootScreen(){document.getElementById('bootScreen').classList.remove('hidden');document.getElementById('appShell').classList.add('hidden');}
function showCycleSkeleton(){const target=document.getElementById('cycleView');target.innerHTML='<div class="cycle-hero"><div class="skeleton-line" style="width:45%"></div><div class="skeleton-line" style="width:68%"></div><div class="skeleton-line" style="height:42px"></div></div><div class="card"><div class="skeleton-line" style="width:30%"></div><div class="skeleton-line"></div><div class="skeleton-line"></div><div class="skeleton-line" style="width:80%"></div></div>';}
function showFatalError(error){document.getElementById('bootScreen').classList.add('hidden');document.getElementById('appShell').classList.remove('hidden');document.getElementById('errorView').innerHTML='<div class="error-state"><div class="error-state-icon">!</div><h2>We could not load the review portal</h2><p>'+escapeHtml(errorMessage(error))+'</p><button class="button primary" onclick="refreshApplication(\'\',\'\')">Try again</button></div>';navigate('error');}
function renderCycleError(error,cycleId,action){document.getElementById('cycleView').innerHTML='<div class="error-state"><div class="error-state-icon">!</div><h2>We could not open this review</h2><p>'+escapeHtml(errorMessage(error))+'</p><button class="button primary" onclick="loadCycle(\''+escapeAttr(cycleId)+'\',\''+escapeAttr(action||'overview')+'\')">Try again</button></div>';}

function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');}
function closeSidebar(){document.getElementById('sidebar').classList.remove('open');}

function actionToTab(action,cycle){if(action==='manager-review'||action==='manager')return'manager';if(action==='self-evaluation'||action==='self')return'self';if(action==='meeting')return'meeting';if(action==='signature'||action==='signatures')return'signatures';if(action==='compensation')return'overview';return'overview';}
function actionButtonClass(tone){if(tone==='warning')return'warning';if(tone==='success')return'success';if(tone==='secondary')return'outline';return'primary';}
function statusPill(value,tone){return'<span class="status-pill '+(tone||statusTone(value))+'">'+escapeHtml(humanStatus(value))+'</span>';}
function statusPillForDocument(value){return'<span class="status-pill '+documentStatusTone(value)+'">'+escapeHtml(humanDocumentStatus(value))+'</span>';}
function statusTone(value){if(value==='Complete'||value==='Signed')return'green';if(value==='Awaiting Signatures'||value==='Action required'||value==='Ready to sign')return'amber';if(value==='Review Meeting Open')return'blue';if(value==='Ready for Review Meeting')return'purple';if(value==='Needs attention')return'amber';return'';}
function documentStatusTone(value){if(value==='Complete')return'green';if(String(value).includes('Pending'))return'amber';if(value==='Submitted')return'purple';if(value==='Draft')return'blue';return'';}
function humanStatus(value){const map={'Open for Input':'Drafting','Ready for Review Meeting':'Ready for Meeting','Review Meeting Open':'Meeting Open','Awaiting Signatures':'Awaiting Signatures','Finalizing':'Finalizing','Complete':'Complete'};return map[value]||value||'';}
function humanDocumentStatus(value){const map={'Not Started':'Not started','Draft':'In progress','Submitted':'Submitted and sealed','Pending Manager and Employee Signatures':'Waiting for manager and employee signatures','Pending Manager Signature':'Waiting for manager signature','Pending Employee Signature':'Waiting for employee signature','Pending HR Signature':'Waiting for HR signature','Complete':'Complete'};return map[value]||value||'';}
function ratingLabel(value){if(!value)return'';if(value==='N/A')return'N/A';const item=state.ratings.find(function(r){return String(r.value)===String(value);});return item?item.value+' — '+item.label:String(value);}
function isNumericRating(value){const n=Number(value);return value!==''&&value!=='N/A'&&Number.isInteger(n)&&n>=1&&n<=7;}
function formatOverallScoreDisplay(value){
  const text = String(value || '').trim();
  if (!text) return '—';
  const numeric = Number(text);
  if (!Number.isFinite(numeric)) return text;
  return numeric.toFixed(2);
}
function calculateClientOverallScore(draft){
  let sum = 0;
  let count = 0;
  ((draft && draft.ratings) || []).forEach(function(item) {
    const raw = String((item && item.rating) || '').trim();
    if (!raw || raw.toUpperCase() === 'N/A') return;
    const numeric = Number(raw);
    if (!Number.isFinite(numeric)) return;
    sum += numeric;
    count += 1;
  });
  if (!count) return '';
  return (Math.round((sum / count) * 100) / 100).toFixed(2);
}
function formatClientScoreDifference(difference){
  if (difference == null || !Number.isFinite(Number(difference))) return '—';
  const value = Number(difference);
  if (value > 0) return '+' + String(value);
  return String(value);
}
function infoTipHtml(text){
  return '<button type="button" class="info-tip" aria-label="More information" onclick="toggleInfoTip(event, this)" onblur="closeInfoTip(this)"><span aria-hidden="true">ⓘ</span><span class="info-tip-bubble">' + escapeHtml(text || '') + '</span></button>';
}
function toggleInfoTip(event, button){
  if (event) event.preventDefault();
  document.querySelectorAll('.info-tip.is-open').forEach(function(el){
    if (el !== button) el.classList.remove('is-open');
  });
  button.classList.toggle('is-open');
}
function closeInfoTip(button){
  setTimeout(function(){ button.classList.remove('is-open'); }, 120);
}
function greetingPeriod(){const hour=new Date().getHours();return hour<12?'morning':hour<17?'afternoon':'evening';}
function formatLocalDateTime(value){if(!value)return'';const date=new Date(value);return Number.isNaN(date.getTime())?String(value):date.toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});}
function deepClone(value){return JSON.parse(JSON.stringify(value||{}));}
function errorMessage(error){return friendlyErrorMessage(error);}
function scrollToField(id){const element=document.getElementById(id);if(element){element.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(function(){element.focus();},250);}}
function setButtonBusy(button,busy,text){if(!button)return;button.disabled=busy;button.textContent=text;}
function valueOf(id){const element=document.getElementById(id);return element?String(element.value||'').trim():'';}
function setValue(id,value){const element=document.getElementById(id);if(element)element.value=value||'';}
function toDateInput(value){if(!value)return'';const parts=String(value).split('/');if(parts.length!==3)return'';return parts[2]+'-'+String(parts[0]).padStart(2,'0')+'-'+String(parts[1]).padStart(2,'0');}
function escapeHtml(value){return String(value==null?'':value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');}
function escapeAttr(value){return escapeHtml(value).replace(/`/g,'&#096;');}
</script>
