<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --brand: #5b128b;
      --brand-dark: #3c075f;
      --brand-soft: #f2e9f7;
      --brand-faint: #fbf8fc;
      --ink: #261f2b;
      --muted: #706777;
      --line: #e0d8e4;
      --canvas: #f5f3f7;
      --surface: #ffffff;
      --success: #18704a;
      --success-soft: #e9f6ef;
      --warning: #9a6309;
      --warning-soft: #fff4d7;
      --danger: #a22d2d;
      --danger-soft: #fcecec;
      --info: #255c94;
      --info-soft: #eaf2fb;
      --shadow: 0 8px 28px rgba(47, 22, 60, .08);
      --sidebar-width: 252px;
      --radius: 13px;
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--canvas); }
    body {
      min-height: 100%;
      margin: 0;
      color: var(--ink);
      background: var(--canvas);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; }

    .hidden { display: none !important; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    .boot-screen {
      min-height: 100vh;
      padding: 28px;
      background: var(--canvas);
    }

    .boot-header,
    .skeleton-card,
    .skeleton-line {
      overflow: hidden;
      position: relative;
      background: #ece7ef;
    }

    .boot-header {
      width: 240px;
      height: 34px;
      margin-bottom: 30px;
      border-radius: 9px;
    }

    .boot-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
      max-width: 1080px;
      margin: 0 auto;
    }

    .skeleton-card {
      min-height: 132px;
      border-radius: var(--radius);
    }

    .boot-list {
      max-width: 1080px;
      margin: 20px auto;
      padding: 24px;
      background: var(--surface);
      border-radius: var(--radius);
    }

    .skeleton-line {
      height: 14px;
      margin: 12px 0;
      border-radius: 5px;
    }

    .boot-header::after,
    .skeleton-card::after,
    .skeleton-line::after {
      content: "";
      position: absolute;
      inset: 0;
      transform: translateX(-100%);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.7), transparent);
      animation: shimmer 1.35s infinite;
    }

    @keyframes shimmer { to { transform: translateX(100%); } }

    .app-shell {
      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 50;
      width: var(--sidebar-width);
      display: flex;
      flex-direction: column;
      padding: 22px 16px 16px;
      color: #fff;
      background: linear-gradient(175deg, var(--brand-dark), #57107e 70%, #6d228f);
      box-shadow: 4px 0 20px rgba(49, 10, 74, .18);
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 0 8px 22px;
      border-bottom: 1px solid rgba(255,255,255,.15);
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 11px;
      color: var(--brand-dark);
      background: #fff;
      font-size: 19px;
      font-weight: 900;
    }

    .sidebar-brand strong { display: block; letter-spacing: .04em; }
    .sidebar-brand small { color: rgba(255,255,255,.72); }

    .nav-section-label {
      margin: 23px 10px 8px;
      color: rgba(255,255,255,.55);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .nav-button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 11px 12px;
      margin: 3px 0;
      color: rgba(255,255,255,.82);
      background: transparent;
      border: 0;
      border-radius: 9px;
      text-align: left;
      font-weight: 650;
    }

    .nav-button:hover { background: rgba(255,255,255,.10); color: #fff; }
    .nav-button.active { background: #fff; color: var(--brand-dark); }
    a.nav-button {
      text-decoration: none;
      box-sizing: border-box;
    }
    a.nav-button .nav-external {
      margin-left: auto;
      font-size: 12px;
      opacity: .75;
    }
    .nav-icon {
      width: 22px;
      display: inline-grid;
      place-items: center;
      font-size: 17px;
    }

    .nav-count {
      min-width: 22px;
      margin-left: auto;
      padding: 2px 7px;
      border-radius: 999px;
      color: var(--brand-dark);
      background: rgba(255,255,255,.88);
      font-size: 11px;
      text-align: center;
    }

    .sidebar-footer {
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,.15);
    }

    .sidebar-user {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px;
    }

    .avatar {
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      color: var(--brand-dark);
      background: #fff;
      font-size: 13px;
      font-weight: 850;
    }

    .sidebar-user-name { font-size: 13px; font-weight: 750; }
    .sidebar-user-role { color: rgba(255,255,255,.65); font-size: 11px; }

    .app-body {
      grid-column: 2;
      min-width: 0;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      min-height: 69px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 25px;
      background: rgba(255,255,255,.94);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }

    .mobile-menu-button { display: none; }
    .topbar-title { min-width: 0; }
    .topbar-title strong { display: block; font-size: 16px; }
    .topbar-title span { display: block; color: var(--muted); font-size: 12px; }

    .topbar-spacer { flex: 1; }

    .save-indicator {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .save-indicator.saving { color: var(--info); }
    .save-indicator.error { color: var(--danger); }
    .save-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #a9a0ae;
    }
    .save-indicator.saving .save-dot { background: var(--info); animation: pulse 1s infinite; }
    .save-indicator.saved .save-dot { background: var(--success); }
    .save-indicator.error .save-dot { background: var(--danger); }
    @keyframes pulse { 50% { opacity: .35; } }

    .icon-button {
      position: relative;
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      padding: 0;
      color: var(--ink);
      background: transparent;
      border: 1px solid transparent;
      border-radius: 10px;
      font-size: 19px;
    }

    .icon-button:hover { background: var(--brand-faint); border-color: var(--line); }
    .notification-badge {
      position: absolute;
      top: 2px;
      right: 1px;
      min-width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
      padding: 0 5px;
      color: #fff;
      background: var(--danger);
      border: 2px solid #fff;
      border-radius: 999px;
      font-size: 9px;
      font-weight: 800;
    }

    .network-banner {
      position: sticky;
      top: 69px;
      z-index: 35;
      padding: 9px 24px;
      color: var(--warning);
      background: var(--warning-soft);
      border-bottom: 1px solid #f0d89c;
      font-size: 13px;
      text-align: center;
    }

    .page-content {
      width: min(1240px, calc(100% - 42px));
      margin: 0 auto;
      padding: 27px 0 60px;
    }

    .page-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    .page-header h1 { margin: 0 0 5px; color: var(--brand-dark); font-size: 29px; }
    .page-header p { margin: 0; color: var(--muted); line-height: 1.5; }

    .button-row { display: flex; flex-wrap: wrap; gap: 9px; }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 40px;
      padding: 9px 15px;
      border: 1px solid transparent;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 750;
      text-decoration: none;
    }

    .button.primary { color: #fff; background: var(--brand); }
    .button.primary:hover { background: #4a0e73; }
    .button.secondary { color: var(--brand-dark); background: var(--brand-soft); }
    .button.outline { color: var(--ink); background: #fff; border-color: var(--line); }
    .button.success { color: #fff; background: var(--success); }
    .button.warning { color: #fff; background: var(--warning); }
    .button.danger { color: #fff; background: var(--danger); }
    .button.text { min-height: auto; padding: 5px 8px; color: var(--brand); background: transparent; }
    .button:disabled { opacity: .52; cursor: wait; }

    .card {
      padding: 22px;
      margin-bottom: 18px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 17px;
    }
    .card-header h2, .card-header h3 { margin: 0; }
    .card-header p { margin: 5px 0 0; color: var(--muted); font-size: 13px; }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }

    .metric-card {
      min-height: 126px;
      padding: 18px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 4px 16px rgba(47,22,60,.05);
    }

    .metric-label { color: var(--muted); font-size: 12px; font-weight: 700; }
    .metric-value { margin: 10px 0 5px; color: var(--brand-dark); font-size: 32px; font-weight: 850; }
    .metric-help { color: var(--muted); font-size: 12px; }

    .dashboard-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) minmax(290px, .7fr);
      gap: 18px;
    }

    .action-list { display: grid; gap: 11px; }
    .action-card {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) auto;
      align-items: center;
      gap: 13px;
      padding: 14px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 10px;
    }

    .action-card:hover { border-color: #c8afd5; box-shadow: 0 5px 16px rgba(64,20,84,.07); }
    .action-icon {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      color: var(--brand-dark);
      background: var(--brand-soft);
      border-radius: 11px;
      font-size: 18px;
    }
    .action-card.warning .action-icon { color: var(--warning); background: var(--warning-soft); }
    .action-card.success .action-icon { color: var(--success); background: var(--success-soft); }
    .action-title { margin-bottom: 4px; font-size: 14px; font-weight: 780; }
    .action-meta { color: var(--muted); font-size: 12px; line-height: 1.4; }

    .empty-state {
      padding: 36px 22px;
      color: var(--muted);
      background: var(--brand-faint);
      border: 1px dashed #cdbfd3;
      border-radius: 11px;
      text-align: center;
    }
    .empty-state-icon { margin-bottom: 9px; font-size: 28px; }
    .empty-state strong { display: block; margin-bottom: 6px; color: var(--ink); }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 9px;
      border-radius: 999px;
      color: #4c4650;
      background: #efedf0;
      font-size: 11px;
      font-weight: 750;
      white-space: nowrap;
    }
    .status-pill.blue { color: var(--info); background: var(--info-soft); }
    .status-pill.purple { color: var(--brand-dark); background: var(--brand-soft); }
    .status-pill.amber { color: var(--warning); background: var(--warning-soft); }
    .status-pill.green { color: var(--success); background: var(--success-soft); }
    .status-pill.red { color: var(--danger); background: var(--danger-soft); }

    .progress-track {
      width: 100%;
      height: 8px;
      overflow: hidden;
      background: #ece8ee;
      border-radius: 999px;
    }
    .progress-fill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--brand), #9553b6);
      border-radius: inherit;
      transition: width .25s ease;
    }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 12px 10px; text-align: left; vertical-align: middle; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; }
    tr.table-row { cursor: pointer; }
    tr.table-row:hover { background: var(--brand-faint); }

    .filter-bar {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) 190px 180px auto;
      gap: 10px;
      margin-bottom: 16px;
    }

    label { display: block; margin-bottom: 6px; font-size: 12px; font-weight: 750; }
    input, select, textarea {
      width: 100%;
      padding: 10px 11px;
      color: var(--ink);
      background: #fff;
      border: 1px solid #bfb4c5;
      border-radius: 8px;
      transition: border .15s, box-shadow .15s;
    }
    textarea { min-height: 112px; resize: vertical; line-height: 1.45; }
    input:focus, select:focus, textarea:focus {
      outline: 0;
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(91,18,139,.13);
    }
    input[readonly], textarea[readonly] { color: #57515b; background: #f6f4f7; }
    .field.invalid input, .field.invalid select, .field.invalid textarea,
    input.invalid, select.invalid, textarea.invalid {
      border-color: var(--danger);
      box-shadow: 0 0 0 2px rgba(162,45,45,.09);
    }
    .field-error { margin-top: 5px; color: var(--danger); font-size: 11px; }
    .field-help { margin-top: 5px; color: var(--muted); font-size: 11px; line-height: 1.4; }

    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 15px; }
    .form-grid .full { grid-column: 1 / -1; }

    .cycle-hero {
      padding: 22px;
      margin-bottom: 15px;
      background: linear-gradient(135deg, #fff, var(--brand-faint));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .cycle-hero-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
    }
    .cycle-hero h1 { margin: 5px 0 6px; color: var(--brand-dark); font-size: 26px; }
    .cycle-hero p { margin: 0; color: var(--muted); }
    .breadcrumb-button {
      padding: 0;
      color: var(--brand);
      background: transparent;
      border: 0;
      font-size: 12px;
      font-weight: 750;
    }

    .timeline {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 0;
      margin-top: 22px;
    }
    .timeline-stage { position: relative; min-width: 0; padding-top: 27px; text-align: center; }
    .timeline-stage::before {
      content: "";
      position: absolute;
      top: 10px;
      left: 0;
      right: 0;
      height: 3px;
      background: #ded8e1;
    }
    .timeline-stage:first-child::before { left: 50%; }
    .timeline-stage:last-child::before { right: 50%; }
    .timeline-dot {
      position: absolute;
      top: 2px;
      left: 50%;
      z-index: 1;
      width: 18px;
      height: 18px;
      transform: translateX(-50%);
      background: #ded8e1;
      border: 4px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 0 1px #d2cbd5;
    }
    .timeline-stage.complete::before, .timeline-stage.complete .timeline-dot { background: var(--success); }
    .timeline-stage.current .timeline-dot { background: var(--brand); box-shadow: 0 0 0 4px rgba(91,18,139,.14); }
    .timeline-label { color: var(--muted); font-size: 11px; font-weight: 700; }
    .timeline-stage.current .timeline-label { color: var(--brand-dark); }

    .cycle-tabs {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      margin-bottom: 17px;
      padding: 5px;
      background: #ebe7ed;
      border-radius: 10px;
    }
    .cycle-tab {
      flex: 0 0 auto;
      padding: 9px 14px;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 750;
    }
    .cycle-tab.active { color: var(--brand-dark); background: #fff; box-shadow: 0 2px 7px rgba(50,20,64,.08); }
    .cycle-tab .tab-dot { display: inline-block; width: 7px; height: 7px; margin-left: 6px; background: var(--warning); border-radius: 50%; }

    .summary-grid {
      display: grid;
      grid-template-columns: 200px minmax(0, 1fr);
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    .summary-grid > div { padding: 11px 13px; border-bottom: 1px solid var(--line); }
    .summary-label { background: var(--brand-faint); font-weight: 700; }

    .review-status-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }
    .review-status-card { padding: 17px; border: 1px solid var(--line); border-radius: 10px; }
    .review-status-card h3 { margin: 0 0 5px; font-size: 15px; }
    .review-status-card p { margin: 0 0 13px; color: var(--muted); font-size: 12px; }

    .privacy-banner,
    .warning-banner,
    .info-banner,
    .success-banner,
    .error-banner {
      padding: 12px 14px;
      margin-bottom: 15px;
      border: 1px solid transparent;
      border-radius: 9px;
      font-size: 13px;
      line-height: 1.45;
    }
    .privacy-banner, .info-banner { color: var(--info); background: var(--info-soft); border-color: #c8dff3; }
    .warning-banner { color: var(--warning); background: var(--warning-soft); border-color: #efd79d; }
    .live-release-banner {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .live-release-banner .button-row { margin: 0; }
    .success-banner { color: var(--success); background: var(--success-soft); border-color: #bfe4cf; }
    .error-banner { color: var(--danger); background: var(--danger-soft); border-color: #efc6c6; }

    .editor-shell { display: grid; grid-template-columns: 218px minmax(0, 1fr); gap: 18px; }
    .editor-sidebar {
      position: sticky;
      top: 88px;
      align-self: start;
      padding: 15px;
      background: var(--brand-faint);
      border: 1px solid var(--line);
      border-radius: 11px;
    }
    .editor-progress-number { margin-bottom: 8px; color: var(--brand-dark); font-size: 25px; font-weight: 850; }
    .editor-progress-meta { margin: 8px 0 17px; color: var(--muted); font-size: 11px; }
    .editor-step-button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: 8px;
      text-align: left;
      font-size: 12px;
      font-weight: 700;
    }
    .editor-step-button.active { color: var(--brand-dark); background: #fff; box-shadow: 0 2px 8px rgba(62,20,78,.07); }
    .step-number {
      display: grid;
      place-items: center;
      width: 25px;
      height: 25px;
      border-radius: 50%;
      color: var(--muted);
      background: #e9e4eb;
      font-size: 11px;
    }
    .editor-step-button.active .step-number { color: #fff; background: var(--brand); }
    .editor-step-button.complete .step-number { color: #fff; background: var(--success); }

    .editor-main { min-width: 0; }
    .editor-section-header { margin-bottom: 17px; }
    .editor-section-header h2 { margin: 0 0 6px; color: var(--brand-dark); }
    .editor-section-header p { margin: 0; color: var(--muted); font-size: 13px; }

    .rating-guide-details { margin-bottom: 14px; }
    .rating-guide-details summary { color: var(--brand); cursor: pointer; font-size: 12px; font-weight: 750; }
    .rating-scale-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 11px; }
    .rating-definition { padding: 9px; background: var(--brand-faint); border: 1px solid var(--line); border-radius: 8px; font-size: 11px; line-height: 1.35; }
    .rating-definition strong { display: block; margin-bottom: 4px; color: var(--brand-dark); }

    .factor-card {
      padding: 16px;
      margin-bottom: 12px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    .factor-card.invalid { border-color: #e0a6a6; background: #fffafa; }
    .factor-head { display: grid; grid-template-columns: minmax(0, 1fr) 240px; gap: 14px; margin-bottom: 10px; }
    .factor-title { color: var(--brand-dark); font-weight: 800; }
    .factor-description { margin-top: 5px; color: var(--muted); font-size: 11px; line-height: 1.4; }

    .editor-footer {
      position: sticky;
      bottom: 10px;
      z-index: 15;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 18px;
      padding: 12px;
      background: rgba(255,255,255,.96);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: 0 9px 28px rgba(47,22,60,.12);
      backdrop-filter: blur(8px);
    }
    .editor-footer-spacer { flex: 1; }
    .editor-footer-status { color: var(--muted); font-size: 11px; }

    .readiness-list { display: grid; gap: 8px; margin: 13px 0 18px; }
    .readiness-item {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      padding: 10px;
      border-radius: 8px;
      background: var(--brand-faint);
      font-size: 12px;
    }
    .readiness-item.error { color: var(--danger); background: var(--danger-soft); }
    .readiness-item.warning { color: var(--warning); background: var(--warning-soft); }
    .readiness-item.success { color: var(--success); background: var(--success-soft); }

    .comparison-table td:nth-child(n+2), .comparison-table th:nth-child(n+2) { text-align: center; }
    .difference-large { color: var(--danger); font-weight: 850; }
    .comparison-detail {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      padding: 13px;
      background: var(--brand-faint);
      border-radius: 8px;
    }
    .comparison-comment strong { display: block; margin-bottom: 5px; color: var(--brand-dark); }
    .comparison-comment { color: var(--muted); font-size: 12px; line-height: 1.45; }

    .signature-wrap { overflow: hidden; background: #fff; border: 1px solid #bfb4c5; border-radius: 9px; }
    canvas { display: block; width: 100%; height: 175px; background: #fff; touch-action: none; }
    .signature-actions { padding: 7px; text-align: right; border-top: 1px solid var(--line); }

    .notification-drawer {
      position: fixed;
      top: 0;
      right: 0;
      z-index: 80;
      width: min(410px, 100vw);
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #fff;
      box-shadow: -10px 0 35px rgba(40,18,51,.19);
      transform: translateX(105%);
      transition: transform .22s ease;
    }
    .notification-drawer.open { transform: translateX(0); }
    .drawer-header { display: flex; align-items: center; justify-content: space-between; padding: 19px; border-bottom: 1px solid var(--line); }
    .drawer-header h2 { margin: 0; font-size: 18px; }
    .drawer-body { flex: 1; overflow-y: auto; padding: 12px; }
    .notification-item { width: 100%; display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 10px; padding: 13px; color: var(--ink); background: transparent; border: 0; border-bottom: 1px solid var(--line); text-align: left; }
    .notification-item:hover { background: var(--brand-faint); }
    .notification-item.unread { background: #fcf9fd; }
    .notification-dot { width: 8px; height: 8px; margin-top: 5px; background: var(--brand); border-radius: 50%; }
    .notification-item:not(.unread) .notification-dot { background: transparent; }
    .notification-title { font-size: 13px; font-weight: 750; }
    .notification-meta { margin-top: 4px; color: var(--muted); font-size: 11px; line-height: 1.4; }

    .drawer-overlay {
      position: fixed;
      inset: 0;
      z-index: 70;
      background: rgba(25,16,29,.3);
    }

    .toast-container {
      position: fixed;
      top: 82px;
      right: 20px;
      z-index: 100;
      width: min(380px, calc(100vw - 32px));
      display: grid;
      gap: 10px;
      pointer-events: none;
    }
    .toast {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: start;
      padding: 13px;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line);
      border-left: 4px solid var(--brand);
      border-radius: 10px;
      box-shadow: 0 12px 35px rgba(36,18,43,.17);
      pointer-events: auto;
      animation: toastIn .2s ease;
    }
    .toast.success { border-left-color: var(--success); }
    .toast.warning { border-left-color: var(--warning); }
    .toast.error { border-left-color: var(--danger); }
    .toast-icon { font-size: 18px; }
    .toast-title { font-size: 13px; font-weight: 800; }
    .toast-message { margin-top: 3px; color: var(--muted); font-size: 11px; line-height: 1.4; }
    .toast-close { padding: 0; color: var(--muted); background: transparent; border: 0; }
    @keyframes toastIn { from { opacity: 0; transform: translateY(-8px); } }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 110;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(26,17,30,.48);
      backdrop-filter: blur(3px);
    }
    .modal {
      width: min(520px, 100%);
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 25px 70px rgba(27,15,32,.3);
    }
    .modal-header { padding: 20px 22px 0; }
    .modal-header h2 { margin: 0; color: var(--brand-dark); font-size: 20px; }
    .modal-body { padding: 14px 22px 20px; color: #514a55; font-size: 13px; line-height: 1.5; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 9px; padding: 14px 22px; background: #f8f6f9; border-top: 1px solid var(--line); border-radius: 0 0 14px 14px; }
    .modal-check { display: flex; gap: 9px; margin: 10px 0; padding: 10px; background: var(--brand-faint); border-radius: 8px; }
    .modal-check input { width: auto; margin-top: 2px; }

    .error-state { max-width: 620px; margin: 80px auto; padding: 28px; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); text-align: center; box-shadow: var(--shadow); }
    .error-state-icon { font-size: 38px; }
    .error-state h2 { color: var(--brand-dark); }
    .error-state p { color: var(--muted); }

    @media (max-width: 1080px) {
      .metric-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .dashboard-grid { grid-template-columns: 1fr; }
      .editor-shell { grid-template-columns: 1fr; }
      .editor-sidebar { position: static; display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 6px; }
      .editor-sidebar .progress-block { grid-column: 1 / -1; }
      .editor-step-button { justify-content: center; text-align: center; }
      .editor-step-button span:last-child { display: none; }
    }

    @media (max-width: 820px) {
      .app-shell { display: block; }
      .sidebar { transform: translateX(-105%); transition: transform .2s ease; }
      .sidebar.open { transform: translateX(0); }
      .app-body { grid-column: auto; }
      .mobile-menu-button { display: grid; }
      .page-content { width: min(100% - 26px, 1240px); }
      .topbar { padding: 0 14px; }
      .save-indicator { display: none; }
      .filter-bar { grid-template-columns: 1fr 1fr; }
      .cycle-hero-top { display: block; }
      .cycle-hero-actions { margin-top: 14px; }
      .review-status-grid { grid-template-columns: 1fr; }
      .factor-head { grid-template-columns: 1fr; }
      .rating-scale-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 560px) {
      .boot-grid, .metric-grid, .form-grid, .comparison-detail { grid-template-columns: 1fr; }
      .page-header { align-items: flex-start; flex-direction: column; }
      .filter-bar { grid-template-columns: 1fr; }
      .action-card { grid-template-columns: 42px minmax(0, 1fr); }
      .action-card .button { grid-column: 1 / -1; }
      .timeline-label { font-size: 9px; }
      .summary-grid { grid-template-columns: 1fr; }
      .summary-label { padding-bottom: 3px !important; border-bottom: 0 !important; }
      .rating-scale-grid { grid-template-columns: 1fr; }
      .editor-sidebar { grid-template-columns: repeat(4, 1fr); padding: 9px; }
      .editor-step-button { padding: 7px; }
      .editor-footer { flex-wrap: wrap; }
      .editor-footer-spacer { display: none; }
      .editor-footer .button { flex: 1; }
    }
  
    /* V3.1 automation, guidance, and help center */
    .guide-banner {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 17px 18px;
      margin-bottom: 18px;
      border: 1px solid #d8c4e5;
      border-radius: var(--radius);
      background: linear-gradient(135deg, #fff, var(--brand-faint));
      box-shadow: 0 4px 18px rgba(47,22,60,.04);
    }
    .guide-banner-icon {
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      color: var(--brand-dark);
      background: var(--brand-soft);
      font-weight: 900;
    }
    .guide-banner h3 { margin: 0 0 4px; font-size: 15px; }
    .guide-banner p { margin: 0; color: var(--muted); font-size: 13px; }
    .guide-banner .button { margin-left: auto; white-space: nowrap; }

    .guidance-stack {
      display: grid;
      gap: 10px;
      margin-bottom: 18px;
    }
    .guidance-card {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 15px 16px;
      border: 1px solid var(--line);
      border-left: 4px solid var(--info);
      border-radius: 10px;
      background: var(--surface);
    }
    .guidance-card.warning { border-left-color: var(--warning); background: #fffdf7; }
    .guidance-card.success { border-left-color: var(--success); background: #fbfffc; }
    .guidance-card h3 { margin: 0 0 3px; font-size: 14px; }
    .guidance-card p { margin: 0; color: var(--muted); font-size: 13px; }
    .guidance-card .button { margin-left: auto; white-space: nowrap; }

    .compensation-card {
      border: 1px solid #e6d6b4;
      background: linear-gradient(145deg, #fffdf7, #fff);
    }
    .compensation-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 9px;
      border-radius: 999px;
      color: var(--warning);
      background: var(--warning-soft);
      font-size: 12px;
      font-weight: 750;
    }
    .compensation-status.complete {
      color: var(--success);
      background: var(--success-soft);
    }
    .task-subactions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 10px;
    }
    .task-subaction-note {
      color: var(--muted);
      font-size: 12px;
    }

    .automation-hero {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(260px, .8fr);
      gap: 18px;
      margin-bottom: 18px;
    }
    .automation-mode {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
    }
    .automation-mode.live { color: var(--success); background: var(--success-soft); }
    .automation-mode.preview { color: var(--info); background: var(--info-soft); }
    .automation-mode.paused { color: var(--warning); background: var(--warning-soft); }
    .automation-checklist {
      display: grid;
      gap: 9px;
      margin: 14px 0 0;
    }
    .automation-check {
      display: flex;
      gap: 9px;
      color: var(--muted);
      font-size: 13px;
    }
    .automation-check strong { color: var(--ink); }
    .settings-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 13px;
    }
    .settings-grid .wide { grid-column: span 2; }
    .preview-table td,
    .preview-table th { white-space: nowrap; }
    .preview-table td:first-child,
    .preview-table th:first-child { white-space: normal; }

    .health-shell { display: grid; gap: 18px; margin-bottom: 18px; }
    .health-hero {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(220px, .8fr);
      gap: 18px;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(135deg, #fff, var(--brand-faint));
      box-shadow: var(--shadow);
    }
    .health-hero h2 { margin: 0 0 8px; color: var(--brand-dark); font-size: 24px; }
    .health-hero p { margin: 0; color: var(--muted); }
    .health-metrics {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 16px;
    }
    .health-metric {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
    }
    .health-metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    .health-metric strong {
      display: block;
      margin-top: 4px;
      color: var(--brand-dark);
      font-size: 22px;
    }
    .health-checklist {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .health-checklist li {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      color: var(--ink);
      font-size: 13px;
    }
    .health-cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }
    .health-card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 168px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      box-shadow: 0 4px 16px rgba(47, 22, 60, .04);
    }
    .health-card h3 { margin: 0; color: var(--brand-dark); font-size: 16px; }
    .health-card .health-card-count { margin: 0; color: var(--muted); font-size: 13px; }
    .health-card .health-card-summary { margin: 0; flex: 1; color: var(--ink); font-size: 13px; line-height: 1.4; }
    .health-card-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .health-level {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
    }
    .health-level.healthy { color: var(--success); background: var(--success-soft); }
    .health-level.warning { color: var(--warning); background: var(--warning-soft); }
    .health-level.attention { color: #9a4d09; background: #fff0e0; }
    .health-level.blocking { color: var(--danger); background: var(--danger-soft); }
    .health-level.running { color: var(--info); background: var(--info-soft); }
    .health-level.na { color: var(--muted); background: #f0ecef; }
    .recovery-list { display: grid; gap: 10px; }
    .recovery-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
    }
    .recovery-item h4 { margin: 0 0 4px; color: var(--brand-dark); font-size: 15px; }
    .recovery-item p { margin: 0; color: var(--muted); font-size: 13px; }
    .recovery-item-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .alert-viewer { display: grid; gap: 10px; }
    .alert-row {
      display: grid;
      grid-template-columns: auto minmax(0, 1.2fr) minmax(0, 1fr) auto auto;
      gap: 12px;
      align-items: center;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
    }
    .alert-row .alert-meta { color: var(--muted); font-size: 12px; }
    .health-empty {
      padding: 22px;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      background: var(--brand-faint);
      color: var(--brand-dark);
      text-align: center;
      font-weight: 700;
    }
    .health-detail-grid {
      display: grid;
      grid-template-columns: 140px minmax(0, 1fr);
      gap: 8px 12px;
      margin: 12px 0;
      font-size: 13px;
    }
    .health-detail-grid dt { color: var(--muted); font-weight: 700; }
    .health-detail-grid dd { margin: 0; color: var(--ink); }
    .health-json {
      margin: 0;
      padding: 12px;
      overflow: auto;
      max-height: 240px;
      border-radius: 8px;
      background: #1f1626;
      color: #f7f2fb;
      font-size: 12px;
      line-height: 1.45;
      white-space: pre-wrap;
    }
    .previous-review-card {
      margin: 0 0 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(180deg, #fbfaf8 0%, #fff 100%);

    .previous-review-card summary {

      display: flex;
      flex-wrap: wrap;

      padding: 0 16px 14px;
    }

      font-size: 15px;
      font-weight: 800;
      color: var(--ink);

    .previous-review-card .previous-review-meta {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }
    .previous-review-badge {
      display: inline-block;
      margin-top: 6px;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--warning-soft);
      color: var(--warning);
      font-size: 11px;
      font-weight: 700;
    }
    .previous-review-body {
      padding: 0 16px 16px;
      border-top: 1px solid var(--line);

      padding-left: 18px;

      color: var(--danger);
      border-color: var(--danger-soft);
      background: var(--danger-soft);
    }
    .historical-banner {
      margin: 0 0 14px;
      padding: 12px 14px;
      border-radius: var(--radius);
      background: var(--brand-faint);
      color: var(--brand-dark);
      font-weight: 700;
    }
    @media (max-width: 1100px) {
      .health-hero,
      .health-cards,
      .health-metrics,
      .alert-row,
      .recovery-item {
        grid-template-columns: 1fr;
      }

    .help-layout {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      gap: 18px;
    }
    .help-menu {
      position: sticky;
      top: 88px;
      align-self: start;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }
    .help-menu button {
      width: 100%;
      padding: 10px 11px;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: 8px;
      text-align: left;
      font-weight: 700;
    }
    .help-menu button:hover { color: var(--brand-dark); background: var(--brand-faint); }
    .help-section {
      scroll-margin-top: 88px;
      margin-bottom: 18px;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: 0 4px 18px rgba(47,22,60,.04);
    }
    .help-section h2 { margin-bottom: 7px; }
    .help-section h3 { margin-top: 20px; margin-bottom: 5px; }
    .help-section p,
    .help-section li { color: var(--muted); line-height: 1.58; font-size: 14px; }
    .process-steps {
      display: grid;
      gap: 11px;
      counter-reset: guide;
      margin-top: 14px;
    }
    .process-step {
      position: relative;
      padding: 14px 14px 14px 52px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--brand-faint);
    }
    .process-step::before {
      counter-increment: guide;
      content: counter(guide);
      position: absolute;
      left: 14px;
      top: 13px;
      display: grid;
      place-items: center;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      color: #fff;
      background: var(--brand);
      font-size: 12px;
      font-weight: 900;
    }
    .process-step strong { display: block; margin-bottom: 3px; }
    .faq-item {
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
    }
    .faq-item:last-child { border-bottom: 0; }
    .faq-item strong { display: block; margin-bottom: 4px; }

    @media (max-width: 900px) {

      .help-layout { grid-template-columns: 1fr; }
      .settings-grid { grid-template-columns: 1fr 1fr; }
      .settings-grid .wide { grid-column: 1 / -1; }
      .help-menu { position: static; display: flex; overflow-x: auto; }
      .help-menu button { width: auto; white-space: nowrap; }
    }
    @media (max-width: 620px) {
      .settings-grid { grid-template-columns: 1fr; }
      .settings-grid .wide { grid-column: auto; }
      .guide-banner,
      .guidance-card { display: block; }
      .guide-banner .button,
      .guidance-card .button { margin: 12px 0 0; width: 100%; }
    }

    .derived-overall {
      display: inline-flex;
      align-items: center;
      min-height: 42px;
      padding: 8px 14px;
      border-radius: 10px;
      background: var(--brand-soft);
      color: var(--brand-dark);
      font-weight: 750;
      font-size: 1.25rem;
    }

    .info-tip {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      margin-left: 6px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--muted);
      font-size: 11px;

<script>
const INITIAL_CYCLE_ID = <?!= JSON.stringify(initialCycleId) ?>;
const INITIAL_ACTION = <?!= JSON.stringify(initialAction) ?>;

const REVIEW_TYPES = {
  manager: 'Manager Review',
  self: 'Self-Evaluation'
};

const EDITOR_STEPS = {
  manager: [
    { key: 'ratings', label: 'Ratings' },
    { key: 'summary', label: 'Overall Assessment' },
    { key: 'development', label: 'Development' },
    { key: 'review', label: 'Review & Submit' }
  ],
  self: [
    { key: 'ratings', label: 'Ratings' },
    { key: 'summary', label: 'Overall Assessment' },
    { key: 'development', label: 'Development' },
    { key: 'review', label: 'Review & Submit' }
  ]
};

let state = null;
let currentCycle = null;
let currentView = 'home';
let currentCycleTab = 'overview';
let preferredCycleAction = '';
let modalCallback = null;
let notificationItems = [];
let signaturePads = {};
let meetingDraft = null;
let meetingDirty = false;
let meetingLocalRevision = 0;
let meetingSaveInFlight = null;
let meetingLastAckedLocalRevision = 0;
let meetingAutosaveTimer = null;
let autosaveDelayMs = 5000;
let deepLinkConsumed = false;
let previousReviewContext = null;
let previousReviewContextCycleId = '';
let previousReviewContextLoading = false;
let clientRequestSeq = 0;
let adminHeavyDataLoaded = false;
let appLoadingMessageTimer = null;
let appLoadingStartedAt = 0;
let liveReviewPollTimer = null;
let liveReviewPollInFlight = false;
let liveReviewPollResumeAfterInFlight = false;
let liveReviewPollGeneration = 0;
let liveReviewRequestToken = 0;
let liveReviewConsecutiveFailures = 0;
let liveReviewLastSyncedAt = 0;
let liveReviewSyncDelayed = false;
let finalizationKickAttemptedForCycle = '';
let liveReleaseBannerVisible = false;
let meetingDraftPreserveAfterSeal = false;
let meetingReleaseFlushInFlight = null;
let defaultDocumentTitle = 'AITHERAS Performance Reviews';
const LIVE_REVIEW_POLL_VISIBLE_MS = 2500;
const LIVE_REVIEW_POLL_HIDDEN_MS = 9000;
const LIVE_REVIEW_POLL_RELEASE_PENDING_MS = 1000;
const MEETING_RELEASE_ACK_WAIT_MS = 120000;

const editorState = {
  manager: createEditorState(),
  self: createEditorState()
};

function createEditorState() {
  return {
    step: 0,
    draft: null,
    dirty: false,
    saving: false,
    lastSavedAt: '',
    autosaveTimer: null,
    validation: { errors: [], warnings: [], fieldErrors: {} },
    showErrors: false
  };
}

document.addEventListener('DOMContentLoaded', function() {
  defaultDocumentTitle = document.title || defaultDocumentTitle;
  window.addEventListener('online', handleOnlineStatus);
  window.addEventListener('offline', handleOnlineStatus);
  window.addEventListener('beforeunload', handleBeforeUnload);
  document.addEventListener('visibilitychange', handleLiveReviewVisibilityChange_);
  window.addEventListener('pagehide', stopLiveReviewPolling_);
  document.addEventListener('keydown', function(event) {
    if (event.key === 'Escape') {
      closeNotifications();
      closeModal();
    }
  });
  handleOnlineStatus();
  refreshApplication(INITIAL_CYCLE_ID || '', INITIAL_ACTION || '');
});

function server(method) {
  const args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function(resolve, reject) {
    const runner = google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(reject);
    runner[method].apply(runner, args);
  });
}

let appLoadingDepth = 0;
let appLoadingToken = 0;

function showAppLoading_(options) {
  const opts = options || {};
  appLoadingDepth += 1;
  const overlay = document.getElementById('appLoadingOverlay');
  if (!overlay) return;
  overlay.classList.remove('hidden');
  updateAppLoading_(opts);
  if (appLoadingDepth === 1) {
    appLoadingStartedAt = Date.now();
    if (appLoadingMessageTimer) clearInterval(appLoadingMessageTimer);
    if (!opts.stages || !opts.stages.length) {
      appLoadingMessageTimer = setInterval(function() {
        const elapsed = Date.now() - appLoadingStartedAt;
        if (elapsed >= 8000) {
          updateAppLoading_({
            title: opts.title || 'Still working',
            message: 'This is taking longer than usual. The request is still processing. Please don’t submit this action again.'
          });
        } else if (elapsed >= 2000) {
          updateAppLoading_({
            title: opts.title || 'Loading',
            message: opts.slowMessage || 'Loading the latest review information…'
          });
        }
      }, 500);
    }
  }
}

function updateAppLoading_(options) {
  const opts = options || {};
  const title = document.getElementById('appLoadingTitle');
  const message = document.getElementById('appLoadingMessage');
  const stages = document.getElementById('appLoadingStages');
  const actions = document.getElementById('appLoadingActions');
  const spinner = document.getElementById('appLoadingSpinner');
  if (title) title.textContent = opts.title || 'Loading';
  if (message) message.textContent = opts.message || 'Please wait…';
  if (spinner) spinner.classList.toggle('hidden', !!opts.hideSpinner);
  if (actions) {
    actions.classList.add('hidden');
    actions.innerHTML = '';
  }
  if (stages) {
    if (Array.isArray(opts.stages) && opts.stages.length) {
      stages.classList.remove('hidden');
      stages.innerHTML = opts.stages.map(function(stage) {
        const state = stage.state || 'pending';
        const mark = state === 'done' ? '✓' : state === 'active' ? '●' : '○';
        return '<div class="app-loading-stage ' + escapeAttr(state) + '"><span>' + mark + '</span><span>' + escapeHtml(stage.label || '') + '</span></div>';
      }).join('');
    } else {
      stages.classList.add('hidden');
      stages.innerHTML = '';
    }
  }
}

function hideAppLoading_() {
  appLoadingDepth = Math.max(0, appLoadingDepth - 1);
  if (appLoadingDepth > 0) return;
  if (appLoadingMessageTimer) {
    clearInterval(appLoadingMessageTimer);
    appLoadingMessageTimer = null;
  }
  const overlay = document.getElementById('appLoadingOverlay');
  if (overlay) overlay.classList.add('hidden');
  const actions = document.getElementById('appLoadingActions');
  if (actions) {
    actions.classList.add('hidden');
    actions.innerHTML = '';
  }
}

function forceHideAppLoading_() {
  appLoadingDepth = 0;
  hideAppLoading_();
}

function withAppLoading_(options, work) {
  showAppLoading_(options);
  return Promise.resolve()
    .then(work)
    .then(function(result) {
      hideAppLoading_();
      return result;
    })
    .catch(function(error) {
      hideAppLoading_();
      throw error;
    });
}

function clientPerfLog_(label, durationMs, details) {
  if (!(state && state.perfDiagnostics)) return;
  try {
    console.log(JSON.stringify({
      type: 'PERF',
      label: label,
      durationMs: Math.round(durationMs),
      details: details || {}
    }));
  } catch (error) {}
}

async function refreshApplication(cycleId, action) {
  const requestId = ++clientRequestSeq;
  const started = performance.now();
  const alreadyBooted = !!(state && document.getElementById('appShell') &&
    !document.getElementById('appShell').classList.contains('hidden'));
  if (!alreadyBooted) showBootScreen();
  try {
    const data = await withAppLoading_({
      title: alreadyBooted ? 'Refreshing' : 'Opening AITHERAS',
      message: alreadyBooted ? 'Updating your workspace…' : 'Loading your workspace…',
      slowMessage: 'Loading the latest review information…'
    }, function() {
      return server('getReviewBootstrapData', cycleId || '');
    });
    if (requestId !== clientRequestSeq) return;
    const renderStarted = performance.now();
    renderApplication(data, action || '');
    clientPerfLog_('client renderApplication', performance.now() - renderStarted);
    clientPerfLog_('client refreshApplication', performance.now() - started, {
      cycleCount: (data.cycles || []).length
    });
  } catch (error) {
    if (requestId !== clientRequestSeq) return;
    forceHideAppLoading_();
    showFatalError(error);
  }
}

function renderApplication(data, action) {
  state = data;
  adminHeavyDataLoaded = false;
  autosaveDelayMs = Math.max(Number(data.autosaveDelaySeconds || 5), 2) * 1000;
  document.getElementById('bootScreen').classList.add('hidden');
  document.getElementById('appShell').classList.remove('hidden');

  renderUserChrome();
  renderAdminView(false);
  renderDashboard();
  renderReviewsView();
  renderSignaturesView();
  renderHelpView();
  rebuildNotifications();

  if (data.selectedCycle) {
    openCycle(data.selectedCycle, action || '');
  } else if ((action || '') === 'help') {
    navigate('help');
  } else {
    navigate(currentView === 'cycle' ? 'home' : currentView);
  }

  setTimeout(maybeShowWelcomeGuide, 250);
}

function renderUserChrome() {
  const user = state.user || { displayName: state.currentUserEmail, initials: 'AU', primaryRole: 'User' };
  document.getElementById('sidebarAvatar').textContent = user.initials;
  document.getElementById('topbarAvatar').textContent = user.initials;
  document.getElementById('sidebarUserName').textContent = user.displayName;
  document.getElementById('sidebarUserRole').textContent = user.primaryRole + ' · ' + user.email;
  document.getElementById('adminNavButton').classList.toggle('hidden', !state.isHr);
}

function navigate(view) {
  if (view !== 'cycle') {
    stopLiveReviewPolling_();
    liveReleaseBannerVisible = false;
    restoreDocumentTitle_();
    currentCycle = null;
  }
  currentView = view;
  document.querySelectorAll('.app-view').forEach(function(section) {
    section.classList.toggle('hidden', section.id !== view + 'View');
  });
  document.querySelectorAll('.nav-button[data-view]').forEach(function(button) {
    button.classList.toggle('active', button.dataset.view === view);
  });

  const titles = {
    home: ['Home', 'Your performance review workspace'],
    reviews: ['Reviews', 'All review cycles available to you'],
    signatures: ['Signatures', 'Review packets waiting for your signature'],
    help: ['How-To Guide', 'Step-by-step help for the entire review process'],
    admin: ['Administration', 'Create and manage review cycles'],
    cycle: [currentCycle ? currentCycle.employeeName + ' — ' + currentCycle.reviewType : 'Review', 'Review workspace'],
    error: ['Something went wrong', 'Performance Review Portal']
  };
  setTopbar(titles[view][0], titles[view][1]);
  if (view !== 'cycle') document.getElementById('saveIndicator').classList.add('hidden');
  closeSidebar();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  if (view === 'admin') {
    ensureAdminHeavyDataLoaded_();
  }
}

function setTopbar(title, subtitle) {
  document.getElementById('topbarTitle').textContent = title;
  document.getElementById('topbarSubtitle').textContent = subtitle;
}

function renderDashboard() {
  const cycles = state.cycles || [];
  const actions = cycles.filter(function(cycle) { return cycle.actionRequired; });
  const ready = cycles.filter(function(cycle) { return cycle.status === 'Ready for Review Meeting'; });
  const signatures = cycles.filter(function(cycle) { return cycle.actionKey === 'signature'; });
  const completed = cycles.filter(function(cycle) { return cycle.status === 'Complete'; });
  const userName = (state.user && state.user.displayName ? state.user.displayName.split(' ')[0] : 'there');

  const metrics = [
    { label: 'Action required', value: actions.length, help: actions.length ? 'Items waiting on you' : 'You are caught up' },
    { label: 'Ready for meeting', value: ready.length, help: 'Both evaluations submitted' },
    { label: 'Signatures', value: signatures.length, help: 'Packets assigned to you' },
    { label: 'Completed', value: completed.length, help: 'Available in review history' }
  ];

  const upcoming = cycles
    .filter(function(cycle) { return cycle.reviewMeetingDateIso && cycle.status !== 'Complete'; })
    .sort(function(a,b) { return new Date(a.reviewMeetingDateIso) - new Date(b.reviewMeetingDateIso); })
    .slice(0, 5);

  document.getElementById('homeView').innerHTML =
    '<div class="page-header"><div><h1>Good ' + greetingPeriod() + ', ' + escapeHtml(userName) + '</h1>' +
    '<p>Here is what needs attention across your performance reviews.</p></div>' +
    (state.isHr ? '<button class="button primary" onclick="navigate(\'admin\')">＋ Create Review Cycle</button>' : '') + '</div>' +
    renderDashboardGuide() +
    '<div class="metric-grid">' + metrics.map(renderMetricCard).join('') + '</div>' +
    '<div class="dashboard-grid"><div class="card"><div class="card-header"><div><h2>Action Center</h2><p>Your highest-priority next steps.</p></div></div>' +
    renderActionList(actions.slice(0, 8)) + '</div>' +
    '<div class="card"><div class="card-header"><div><h2>Upcoming</h2><p>Scheduled review meetings.</p></div></div>' +
    renderUpcomingList(upcoming) + '</div></div>' +
    '<div class="card"><div class="card-header"><div><h2>Recent Reviews</h2><p>Recently updated cycles available to you.</p></div><button class="button text" onclick="navigate(\'reviews\')">View all</button></div>' +
    renderCompactCycleTable(cycles.slice(0, 7)) + '</div>';
}

function renderMetricCard(metric) {
  return '<div class="metric-card"><div class="metric-label">' + escapeHtml(metric.label) + '</div><div class="metric-value">' + metric.value + '</div><div class="metric-help">' + escapeHtml(metric.help) + '</div></div>';
}

function renderDashboardGuide() {
  const roles = (state.user && state.user.roles) || [];
  let title = 'Your review workspace';
  let message = 'Use the Action Center for your next required step. Drafts save automatically, and the How-To Guide remains available from the left navigation.';

  if (roles.includes('Manager')) {
    title = 'Manager workflow';
    message = 'Complete the manager review and compensation decision before the meeting. The employee self-evaluation remains private until the meeting opens.';
  } else if (roles.includes('Employee')) {
    title = 'Employee workflow';
    message = 'Complete your self-evaluation before the due date. Your manager cannot see it until both evaluations are submitted and the meeting opens.';
  }

  if (state.isHr) {
    title = 'HR workflow';
    message = 'Review automation launches six-month and annual cycles four weeks before the anniversary. Use Administration to preview, configure, and monitor the process.';
  }

  return '<div class="guide-banner"><div class="guide-banner-icon">?</div><div><h3>' +
    escapeHtml(title) + '</h3><p>' + escapeHtml(message) +
    '</p></div><button class="button outline" onclick="navigate(\'help\')">Open How-To Guide</button></div>';
}

function renderActionList(actions) {
  if (!actions.length) {
    return '<div class="empty-state"><div class="empty-state-icon">✓</div><strong>No action required</strong>You are caught up. New assignments and signature requests will appear here.</div>';
  }

  return '<div class="action-list">' + actions.map(function(cycle) {
    const tone = cycle.actionTone === 'warning' ? 'warning' : cycle.actionTone === 'success' ? 'success' : '';
    const icon = cycle.actionKey === 'signature' ? '✎' : cycle.actionKey === 'meeting' ? '◉' : cycle.actionKey === 'compensation' ? '$' : '▤';
    const progress = cycle.actionKey === 'manager-review' ? cycle.managerProgress : cycle.actionKey === 'self-evaluation' ? cycle.selfProgress : null;
      const compensation = cycle.v31 && cycle.v31.compensationActionRequired
      ? '<div class="task-subactions"><button class="button outline" onclick="openCompensationDecisionModal(\'' +
        escapeAttr(cycle.cycleId) +
        '\')">Complete Compensation Decision</button></div>'
      : '';

    return '<div class="action-card ' + tone + '"><div class="action-icon">' + icon + '</div><div><div class="action-title">' + escapeHtml(cycle.actionLabel) + '</div>' +
      '<div class="action-meta"><strong>' + escapeHtml(cycle.employeeName) + '</strong> · ' + escapeHtml(cycle.reviewType) +
      (progress ? '<br>' + progress.percent + '% complete · ' + progress.ratingsCompleted + ' of ' + progress.ratingsTotal + ' ratings' : '') +
      (cycle.v31 && cycle.v31.managerDueDate && cycle.actionKey === 'manager-review' ? '<br>Due ' + escapeHtml(cycle.v31.managerDueDate) : '') +
      (cycle.v31 && cycle.v31.employeeDueDate && cycle.actionKey === 'self-evaluation' ? '<br>Due ' + escapeHtml(cycle.v31.employeeDueDate) : '') +
      '</div>' + compensation + '</div><button class="button ' + actionButtonClass(cycle.actionTone) + '" onclick="openCycleFromSummary(\'' + escapeAttr(cycle.cycleId) + '\',\'' + escapeAttr(cycle.actionKey) + '\')">' + escapeHtml(cycle.actionLabel) + '</button></div>';
  }).join('') + '</div>';
}

function renderUpcomingList(cycles) {
  if (!cycles.length) {
    return '<div class="empty-state"><strong>No upcoming meetings</strong>Scheduled review meetings will appear here.</div>';
  }
  return '<div class="action-list">' + cycles.map(function(cycle) {
    return '<button class="notification-item" onclick="openCycleFromSummary(\'' + escapeAttr(cycle.cycleId) + '\',\'overview\')"><span class="notification-dot" style="background:var(--info)"></span><span><span class="notification-title">' + escapeHtml(cycle.employeeName) + '</span><span class="notification-meta">' + escapeHtml(cycle.reviewMeetingDate) + ' · ' + escapeHtml(humanStatus(cycle.status)) + '</span></span></button>';
  }).join('') + '</div>';
}

function renderCompactCycleTable(cycles) {
  if (!cycles.length) return '<div class="empty-state"><strong>No reviews yet</strong>Your review history will appear here.</div>';

function applyReviewFilters() {
  const search = (valueOf('reviewSearch') || '').toLowerCase();
  const status = valueOf('reviewStatusFilter');
  const role = valueOf('reviewRoleFilter');
  const cycles = (state.cycles || []).filter(function(cycle) {
    const haystack = [cycle.employeeName, cycle.managerName, cycle.departmentProject, cycle.reviewType].join(' ').toLowerCase();
    return (!search || haystack.includes(search)) && (!status || cycle.status === status) && (!role || cycle.relationship.includes(role));
  });

  const target = document.getElementById('reviewsTable');
  if (!target) return;
  target.innerHTML = cycles.length ? renderDetailedCycleTable(cycles) : '<div class="empty-state"><strong>No matching reviews</strong>Try changing the search or filters.</div>';
}

function ensureAdminHeavyDataLoaded_() {
  if (!state || !state.isHr || adminHeavyDataLoaded) return;
  adminHeavyDataLoaded = true;
  const queueBody = document.getElementById('compensationQueueBody');
  if (queueBody && /Open Administration/.test(queueBody.textContent || '')) {
    queueBody.innerHTML = '<div class="field-help">Loading compensation queue…</div>';
  }
  loadAdminAutomationSettings_();
  refreshSystemHealth(false);
  refreshCompensationQueue();
}

async function loadAdminAutomationSettings_() {
  if (!state || !state.isHr) return;
  if (state.v31 && state.v31.automation) return;
  try {
    const automation = await server('getReviewAutomationAdminData');
    if (!state.v31) state.v31 = {};
    state.v31.automation = automation;
    state.v31.automationDeferred = false;
    if (currentView === 'admin') {
      const keepLoaded = adminHeavyDataLoaded;
      renderAdminView(false);
      adminHeavyDataLoaded = keepLoaded;
    }
  } catch (error) {
    showToast('error', 'Could not load automation settings', errorMessage(error));
  }
}

async function recoverCompensationCaf(cycleId) {
  if (
    !confirm(
      'Reconcile the compensation CAF PDF for this cycle? HR will be alerted if multiple conflicting files are found.'
    )
  ) {
    return;
  }
  try {
    const result = await server('recoverCompensationCafPdf', cycleId);
    showToast(
      'success',
      'Compensation CAF',
      result && result.reconciled
        ? 'CAF PDF reconciled from Drive.'
        : 'CAF PDF recovery completed.'
    );
    refreshCompensationQueue();
  } catch (error) {
    showToast('error', 'Compensation CAF', errorMessage(error));
  }
}

async function recoverCompensationRate(cycleId) {
  if (
    !confirm(
      'Retry the compensation rate update? The approved rate is only applied when the current rate still matches the expected predecessor.'
    )
  ) {
    return;
  }
  try {
    await server('recoverCompensationRateUpdate', cycleId);
    showToast(
      'success',
      'Compensation rate update',
      'Compensation rate update reprocessed.'
    );
    refreshCompensationQueue();
  } catch (error) {
    showToast('error', 'Compensation rate update', errorMessage(error));
  }
}

async function openHrRecommendationEmailRecovery(cycleId, attemptId) {
  openModal({
    title: 'Reconcile HR recommendation email',
    body:
      '<p><strong>Delivery Unknown:</strong> HR may already have received the compensation recommendation email. Do not auto-resend.</p>' +
      '<p>Attempt ID: <code>' +
      escapeHtml(attemptId || '') +
      '</code></p>' +
      '<label>Action<br><select id="hrRecommendationRecoveryAction">' +
      '<option value="markConfirmed">Mark Confirmed (already delivered)</option>' +
      '<option value="resend">Confirmed Resend</option>' +
      '</select></label>' +
      '<label style="display:block;margin-top:12px;">Evidence note (required to Mark Confirmed)<br>' +
      '<textarea id="hrRecommendationEvidence" rows="3" style="width:100%"></textarea></label>',
    confirmLabel: 'Apply Reconciliation',
    tone: 'warning',
    onConfirm: async function () {
      const action = document.getElementById(
        'hrRecommendationRecoveryAction'
      ).value;
      const evidenceNote = String(
        document.getElementById('hrRecommendationEvidence').value || ''
      ).trim();
      closeModal();
      try {
        if (action === 'markConfirmed') {
          if (!evidenceNote) {
            showToast(
              'error',
              'HR recommendation email',
              'An evidence note is required to mark confirmed.'
            );
            return;
          }
          await server('markCompensationRecommendationHrEmailConfirmed', cycleId, {
            confirmed: true,
            confirmationToken: 'MARK_HR_RECOMMENDATION_EMAIL_CONFIRMED',
            originalAttemptId: attemptId || '',
            evidenceNote: evidenceNote,
          });
          showToast(
            'success',
            'HR recommendation email',
            'Marked confirmed with evidence.'
          );
        } else {

function healthLevelClass(level) {
  const value = String(level || 'healthy');
  if (value === 'attention') return 'attention';
  if (value === 'blocking') return 'blocking';
  if (value === 'warning') return 'warning';
  if (value === 'running') return 'running';
  if (value === 'na') return 'na';
  return 'healthy';
}

function formatHealthCheckedAt(value) {
  if (!value) return 'Not checked yet';
  try {
    const date = new Date(value);
    if (isNaN(date.getTime())) return String(value);
    return date.toLocaleString();
  } catch (error) {
    return String(value);
  }
}

function renderDeepCheckResultsSection(data) {
  const readiness = data && data.readiness;
  if (!readiness) return '';
  const blocking = readiness.blocking || [];
  const warnings = readiness.warnings || [];
  const liveProbeReport =
    readiness.liveProbes && typeof readiness.liveProbes === 'object'
      ? readiness.liveProbes
      : null;
  function renderIssue(issue, tone) {
    const code = escapeHtml(issue.code || 'UNKNOWN');
    const message = escapeHtml(issue.message || '');
    const recommendation = escapeHtml(
      issue.recommendation ||
      (tone === 'error'
        ? 'Resolve this blocking configuration issue before production use.'
        : 'Review this warning before relying on the configuration.')
    );
    const skipped = Array.isArray(issue.checksSkipped) && issue.checksSkipped.length
      ? '<div class="field-help">Skipped probes: ' +
        escapeHtml(issue.checksSkipped.join(', ')) +
        '</div>'
      : '';
    return '<div class="readiness-item ' + tone + '" role="listitem">' +
      '<div><strong>' + code + '</strong></div>' +
      '<div>' + message + '</div>' +
      '<div class="field-help">Recommendation: ' + recommendation + '</div>' +
      skipped +
      '</div>';
  }
  const blockingHtml = blocking.length
    ? blocking.map(function(issue) { return renderIssue(issue, 'error'); }).join('')
    : '<div class="readiness-item success" role="listitem">No blocking configuration issues.</div>';
  const warningHtml = warnings.length
    ? warnings.map(function(issue) { return renderIssue(issue, 'warning'); }).join('')
    : '<div class="readiness-item success" role="listitem">No configuration warnings.</div>';
  const probesExecuted = readiness.liveProbesExecuted === true;
  const probeNote = probesExecuted
    ? 'Sandbox live probes executed.'
    : (readiness.liveProbesNote || 'Live Drive/Calendar/folder probes were not executed.');
  const skippedList = liveProbeReport && Array.isArray(liveProbeReport.checksSkipped)
    ? liveProbeReport.checksSkipped
    : [];
  const skippedHtml = skippedList.length && !probesExecuted
    ? '<p class="field-help">Checks skipped: ' + escapeHtml(skippedList.join(', ')) + '</p>'
    : '';
  const incompleteNote = readiness.incomplete
    ? '<p class="field-help" role="status">This check was incomplete. Review blocking items and retry.</p>'
    : '';
  return '<section class="card" aria-label="Deep Check Results">' +
    '<div class="card-header"><div><h2>Deep Check Results</h2>' +
    '<p>' + escapeHtml(probeNote) + '</p></div>' +
    '<span class="health-level ' + healthLevelClass(data.overallLevel) + '">' +
    escapeHtml(data.overallLabel || '') + '</span></div>' +
    incompleteNote +
    skippedHtml +
    '<h3>Blocking checks</h3><div class="readiness-list" role="list">' + blockingHtml + '</div>' +
    '<h3>Warnings</h3><div class="readiness-list" role="list">' + warningHtml + '</div></section>';
}

    const mark = card.level === 'healthy' ? '✔' : card.level === 'blocking' ? '✖' : '⚠';

      escapeHtml(card.title) + '</strong> — ' + escapeHtml(card.label) +

  const metricHtml =

    '<div class="health-metric"><span>Warnings</span><strong>' + escapeHtml(String(metrics.warnings || 0)) + '</strong></div>' +
    '<div class="health-metric"><span>Blocking Issues</span><strong>' + escapeHtml(String(metrics.blockingIssues || 0)) + '</strong></div>' +
    '<div class="health-metric"><span>Unresolved Alerts</span><strong>' + escapeHtml(String(metrics.unresolvedAlerts || 0)) + '</strong></div>' +
    '<div class="health-metric"><span>Cycles Requiring Recovery</span><strong>' + escapeHtml(String(metrics.cyclesRequiringRecovery || 0)) + '</strong></div>' +
    '<div class="health-metric"><span>Last Health Check</span><strong style="font-size:14px">' + escapeHtml(formatHealthCheckedAt(metrics.lastHealthCheck || data.checkedAt)) + '</strong></div>';

  const cardsHtml = cards.map(function(card) {
    return '<article class="health-card" aria-label="' + escapeAttr(card.title + ' ' + card.label) + '">' +
      '<div class="card-header" style="margin:0;padding:0;border:0"><h3>' + escapeHtml(card.title) + '</h3>' +
      '<span class="health-level ' + healthLevelClass(card.level) + '">' + escapeHtml(card.label) + '</span></div>' +
      '<p class="health-card-count">' + escapeHtml(card.countLabel || '') + '</p>' +
      '<p class="health-card-summary">' + escapeHtml(card.summary || '') + '</p>' +
      '<div class="health-card-actions"><button type="button" class="button outline" aria-label="Refresh summary for ' + escapeAttr(card.title) + '" onclick="refreshSystemHealth(true)">Refresh Summary</button></div>' +
      '</article>';
  }).join('');

  const recoveryHtml = recoveryItems.length
    ? '<div class="recovery-list">' + recoveryItems.map(function(item, index) {
        const incidentBadge = item.itemKind === 'incident'
          ? ' <span class="health-level warning">Incident record</span>'
          : '';
        const relatedAlert = item.relatedAlertNote
          ? '<p class="field-help">' + escapeHtml(item.relatedAlertNote) + '</p>'
          : '';
        return '<div class="recovery-item">' +
          '<div><h4>' + escapeHtml(item.component) + incidentBadge + '</h4>' +
          '<p>Cycle ' + escapeHtml(item.cycleId || 'System') +
          (item.employeeName ? ' · ' + escapeHtml(item.employeeName) : '') +
          '</p>' +
          '<p><span class="health-level ' + healthLevelClass(item.level) + '">' + escapeHtml(item.label || item.status) + '</span> ' +
          escapeHtml(item.status || '') + '</p>' +
          relatedAlert +
          '</div>' +
          '<div class="recovery-item-actions">' +
          '<button type="button" class="button outline" aria-label="View details for ' + escapeAttr(item.component) + '" onclick="openHealthItemDetails(' + index + ')">Details</button>' +
          '<button type="button" class="button warning" aria-label="' + escapeAttr(item.actionLabel || 'Recover') + ' ' + escapeAttr(item.component) + '" onclick="runHealthRecoveryAction(' + index + ')">' +
          escapeHtml(item.actionLabel || 'Recover') + '</button></div></div>';
      }).join('') + '</div>'
    : '<div class="health-empty" role="status">Everything looks healthy. No recovery actions are needed.</div>';

  const probeButton = isSandbox
    ? '<button type="button" class="button warning" onclick="runSandboxLiveProbes()">Run Sandbox Live Probes</button>'
    : '';

  return '<div class="health-shell" aria-label="System Health">' +
    '<section class="health-hero">' +
    '<div><div class="health-level ' + healthLevelClass(data.overallLevel) + '" aria-label="Overall status ' + escapeAttr(data.overallLabel || '') + '">' +
    escapeHtml(data.overallLabel || 'Healthy') + '</div>' +
    '<h2 style="margin-top:12px">' + escapeHtml(data.headline || 'System Health') + '</h2>' +
    '<p>' + (data.cached ? 'Showing cached summary (up to 30 seconds). ' : '') +
    (data.deepCheck
      ? (data.liveProbes
        ? 'Sandbox live probe execution results are included. '
        : data.liveProbesRequested
        ? 'Sandbox live-probe request was prepared; review Deep Check Results for executed vs skipped probes. '
        : 'Configuration check results are included. ')
      : 'Fast sheet and trigger summary. ') +
    'Live Drive and Calendar probes require Sandbox confirmation and never auto-run in Production.</p>' +
    '<div class="health-metrics">' + metricHtml + '</div></div>' +
    '<div><h3 class="sr-only">Component checklist</h3><ul class="health-checklist">' + checklist + '</ul>' +
    '<div class="button-row" style="margin-top:16px">' +

    renderDeepCheckResultsSection(data) +

    recoveryHtml + '</section></div>';

async function refreshSystemHealth(forceRefresh) {
  if (!state || !state.isHr) return;
  const panel = document.getElementById('systemHealthPanel');
  try {
    const data = await server('getSystemHealthSummary', {
      forceRefresh: forceRefresh === true
    });
    state.v31 = state.v31 || {};
    state.v31.systemHealth = data;
    state.v31.systemAlerts = data.alerts || state.v31.systemAlerts;
    if (panel) panel.innerHTML = renderSystemHealthPanel(data);
    const alertsPanel = document.getElementById('systemAlertsPanel');
    if (alertsPanel) alertsPanel.innerHTML = renderSystemAlertsPanel(data.alerts || state.v31.systemAlerts);
  } catch (error) {
    if (panel) {
      panel.innerHTML = '<div class="card"><h2>System Health</h2><p class="field-help">' +
        escapeHtml(friendlyErrorMessage(error)) + '</p></div>';
    }
  }
}

  openModal({
    title: 'Run Sandbox Live Probes?',

    confirmLabel: 'Run Sandbox Live Probes',
