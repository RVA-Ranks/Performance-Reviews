async function runHealthRecoveryAction(index) {
  const item = ((state.v31 && state.v31.systemHealth && state.v31.systemHealth.recoveryItems) || [])[index];
  if (!item) {
    showToast('warning', 'Recovery Center', 'That recovery item is no longer available. Refresh health and try again.');
    return;
  }
  const action = String(item.action || '');
  if (action === 'retryPendingAudit') {
    openModal({
      title: 'Retry Missing Audit?',
      body: '<p>This writes the durable pending audit event <strong>' +
        escapeHtml(item.eventId || (item.details && item.details.eventId) || '') +
        '</strong> exactly once.</p><p>Business state is already committed; this only repairs the audit trail.</p>',
      confirmLabel: 'Retry Audit',
      tone: 'warning',
      onConfirm: async function() {
        closeModal();
        try {
          const result = await server(
            'retryPendingAudit',
            item.eventId || (item.details && item.details.eventId) || ''
          );
          showToast(
            'success',
            'Audit recovery',
            result.message || 'Audit event recovered.'
          );
          await refreshSystemHealth(true);
        } catch (error) {
          showToast('error', 'Audit recovery', friendlyErrorMessage(error));
        }
      }
    });
    return;
  }
  if (action === 'resolveAlert') {
    openSystemAlertResolution(item.alertId, item.severity || 'Warning');
    return;
  }
  if (action === 'retryLaunch') {
    openModal({
      title: 'Retry Launch?',
      body: '<p>This will retry unfinished launch steps for cycle <strong>' + escapeHtml(item.cycleId) + '</strong>.</p><p>Steps already marked Sent are skipped. Delivery Unknown components are not automatically resent.</p>',
      confirmLabel: 'Retry Launch',
      tone: 'warning',
      onConfirm: async function() {
        closeModal();
        try {
          const result = await server('retryReviewLaunch', item.cycleId);
          showToast(result.partial ? 'warning' : 'success', 'Launch retry', formatOperationalClientMessage(result));
          await refreshSystemHealth(true);
        } catch (error) {
          showToast('error', 'Launch retry', friendlyErrorMessage(error));
        }
      }
    });
    return;
  }
  if (action === 'reconcileLaunch') {
    await loadCycle(item.cycleId, 'overview');
    openLaunchReconcileModal();
    return;
  }
  if (action === 'retryCalendarConfig') {
    openModal({
      title: 'Retry Calendar Config?',
      body: '<p>This configures tags and reminders on the existing calendar event only for cycle <strong>' + escapeHtml(item.cycleId) + '</strong>.</p><p>Launch emails are not resent and a second event is not created.</p>',
      confirmLabel: 'Retry Calendar Config',
      tone: 'primary',
      onConfirm: async function() {
        closeModal();
        try {
          const result = await server('retryReviewCalendarConfiguration', item.cycleId);
          showToast(result.ok ? 'success' : 'warning', 'Calendar config', formatOperationalClientMessage(result));
          await refreshSystemHealth(true);
        } catch (error) {
          showToast('error', 'Calendar config', friendlyErrorMessage(error));
        }
      }
    });
    return;
  }
  if (action === 'rebuildCalendar') {
    openModal({
      title: 'Rebuild Calendar Event?',
      body: '<p>Use this only when the original event is confirmed missing for cycle <strong>' + escapeHtml(item.cycleId) + '</strong>.</p><p>Marker recovery is attempted first. Launch emails are not resent.</p>',
      confirmLabel: 'Rebuild Calendar Event',
      tone: 'warning',
      onConfirm: async function() {
        closeModal();
        try {
          const result = await server('rebuildReviewCalendarEvent', item.cycleId);
          showToast(result.warning ? 'warning' : 'success', 'Calendar rebuild', formatOperationalClientMessage(result));
          await refreshSystemHealth(true);
        } catch (error) {
          showToast('error', 'Calendar rebuild', friendlyErrorMessage(error));
        }
      }
    });
    return;
  }
  if (action === 'retryWorkflow' || action === 'markWorkflowConfirmed') {
    await loadCycle(item.cycleId, 'overview');
    if (action === 'markWorkflowConfirmed') {
      openWorkflowNotificationConfirmModal();
    } else {
      openNotificationRetryModal();
    }
    return;
  }
  if (action === 'reconcileSignature') {
    await loadCycle(item.cycleId, 'signatures');
    openSignatureReconcileModal();
    return;
  }
  if (action === 'reconcilePdf') {
    await loadCycle(item.cycleId, 'overview');
    openPdfReconcileModal();
    return;
  }
  if (action === 'retryFinalization' || action === 'retryDistribution' || action === 'retryPdf') {
    openModal({
      title: action === 'retryDistribution' ? 'Retry Distribution?' : 'Retry Finalization?',
      body: '<p>This resumes only safe unfinished finalization steps for cycle <strong>' + escapeHtml(item.cycleId) + '</strong>.</p><p>Existing PDFs are recovered by deterministic name/provenance. Clean generation failures are Failed and retryable. Delivery Unknown final packets are never automatically resent.</p>',
      confirmLabel: action === 'retryDistribution' ? 'Retry Distribution' : 'Retry Finalization',
      tone: 'primary',
      onConfirm: async function() {
        closeModal();
        try {
          const result = await withAppLoading_({
            title: 'Retrying Finalization',
            message: 'Resuming safe unfinished finalization steps…'
          }, function() {
            return server('retryReviewFinalization', item.cycleId);
          });
          showToast(
            result && result.ok ? 'success' : 'warning',
            result && result.partial ? 'Finalization partial' : 'Finalization',
            formatOperationalClientMessage(result)
          );
        } catch (error) {
          showToast('error', 'Finalization', friendlyErrorMessage(error));
        } finally {
          try {
            await refreshSystemHealth(true);
          } catch (refreshError) {
            showToast('error', 'System Health', friendlyErrorMessage(refreshError));
          }
        }
      }
    });
    return;
  }
  if (action === 'recoverCaf') {
    openModal({
      title: 'Recover CAF PDF?',
      body: '<p>Reconcile or regenerate the compensation CAF for cycle <strong>' + escapeHtml(item.cycleId) + '</strong>. Ambiguous Delivery Unknown candidates are never auto-duplicated.</p>',
      confirmLabel: 'Recover CAF',
      tone: 'primary',
      onConfirm: async function() {
        closeModal();
        try {
          const result = await server('recoverCompensationCafPdf', item.cycleId);
          showToast(
            'success',
            'Compensation CAF',
            result && result.reconciled
              ? 'CAF PDF reconciled from Drive.'
              : formatOperationalClientMessage(result, 'CAF PDF recovery completed.')
          );
        } catch (error) {
          showToast('error', 'Compensation CAF', friendlyErrorMessage(error));
        } finally {
          try {
            await refreshSystemHealth(true);
            await refreshCompensationQueue();
          } catch (refreshError) {
            showToast('error', 'System Health', friendlyErrorMessage(refreshError));
          }
        }
      }
    });
    return;
  }
  if (action === 'recheckRateUpdate') {
    openModal({
      title: 'Recheck Rate Update?',
      body: '<p>Retries Column H synchronization for cycle <strong>' + escapeHtml(item.cycleId) + '</strong> only when the live rate still matches the expected predecessor. Conflicts are never overwritten.</p>',
      confirmLabel: 'Recheck Rate Update',
      tone: 'warning',
      onConfirm: async function() {
        closeModal();
        try {
          const result = await server('recoverCompensationRateUpdate', item.cycleId);
          showToast(
            result && result.skipped ? 'warning' : 'success',
            'Compensation rate update',
            result && result.skipped
              ? 'Rate update was not in a recoverable state (' +
                String(result.status || '') +
                ').'
              : formatOperationalClientMessage(result, 'Compensation rate update reprocessed.')
          );
        } catch (error) {
          showToast('error', 'Compensation rate update', friendlyErrorMessage(error));
        } finally {
          try {
            await refreshSystemHealth(true);
            await refreshCompensationQueue();
          } catch (refreshError) {
            showToast('error', 'System Health', friendlyErrorMessage(refreshError));
          }
        }
      }
    });
    return;
  }
  if (action === 'openCompensationQueue' || action === 'reconcileCaf') {
    navigate('admin');
    ensureAdminHeavyDataLoaded_();
    setTimeout(function() {
      const panel = document.getElementById('compensationQueuePanel');
      if (panel) panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 250);
    showToast(
      'info',
      'Compensation Queue',
      action === 'reconcileCaf'
        ? 'Reconcile CAF candidates for ' + item.cycleId + ' in the Compensation Queue.'
        : 'Open the Compensation Queue for cycle ' + item.cycleId + '.'
    );
    return;
  }
  if (action === 'markDistributionConfirmed') {
    await loadCycle(item.cycleId, 'overview');
    openFinalDistributionConfirmModal();
    return;
  }
  if (item.cycleId) {
    await loadCycle(item.cycleId, 'overview');
    return;
  }
  showToast('info', 'Recovery Center', 'Open the related cycle to continue recovery.');
}

function formatOperationalClientMessage(result, fallback) {
  if (result && result.blocker) {
    const parts = [];
    if (result.message) parts.push(String(result.message));
    parts.push(
      'Blocker: ' +
        result.blocker.component +
        (result.blocker.status ? ' · ' + result.blocker.status : '')
    );
    if (result.blocker.message) parts.push(String(result.blocker.message));
    if (result.blocker.recommendedAction) {
      parts.push('Next: ' + String(result.blocker.recommendedAction));
    }
    return parts.join(' — ');
  }
  if (result && result.message) return String(result.message);
  if (result && result.partial) {
    return 'Completed with warnings. Review System Health for remaining work.';
  }
  if (result && result.ok === false) {
    return fallback || 'The action did not finish cleanly. Review System Health for details.';
  }
  if (result && result.ok === true) return fallback || 'Completed.';
  return fallback || 'Completed with warnings. Review System Health for remaining work.';
}

function friendlyErrorMessage(error) {
  const message = error && error.message ? String(error.message) : String(error || '');
  if (!message || /^unknown error$/i.test(message.trim())) {
    return 'The action could not be completed. Refresh System Health and try again.';
  }
  return message;
}

function renderSystemAlertsPanel(data) {
  if (!data) {
    return '<div class="card"><h2>System Alerts</h2><p class="field-help">Loading protected operational alerts…</p></div>';
  }
  const alerts = data.alerts || [];
  const severityRank = { Security: 0, Blocking: 1, Warning: 2 };
  const sorted = alerts.slice().sort(function(a, b) {
    const left = severityRank[a.severity] != null ? severityRank[a.severity] : 9;
    const right = severityRank[b.severity] != null ? severityRank[b.severity] : 9;
    if (left !== right) return left - right;
    return String(b.lastOccurredAt || '').localeCompare(String(a.lastOccurredAt || ''));
  });
  const rows = sorted.length
    ? sorted.map(function(alert) {
        const sendable = alert.status === 'Pending' || alert.status === 'Failed' || alert.status === 'Delivery Unknown';
        const notificationLabel = alert.notificationSent
          ? 'Notification sent'
          : (alert.status === 'Sending'
            ? 'Notification sending'
            : 'Notification not sent');
        return '<article class="alert-row" aria-label="' + escapeAttr(alert.severity + ' ' + alert.component) + '">' +
          '<div>' + (sendable
            ? '<input class="system-alert-send" type="checkbox" value="' + escapeAttr(alert.alertId) + '" data-recipient="' + escapeAttr(alert.recipient) + '" data-status="' + escapeAttr(alert.status) + '" aria-label="Select alert ' + escapeAttr(alert.component) + '">'
            : '<span class="sr-only">Not sendable</span>') +
          '</div>' +
          '<div><strong>' + escapeHtml(alert.severity) + '</strong><div class="alert-meta">' + escapeHtml(alert.component) + '</div></div>' +
          '<div>Cycle ' + escapeHtml(alert.cycleId || 'System') +
          '<div class="alert-meta">' + escapeHtml(alert.status) + ' · ' + escapeHtml(notificationLabel) +
          ' · ' + escapeHtml(String(alert.occurrenceCount || 1)) + ' occurrence(s)</div>' +
          '<div class="alert-meta">Last seen ' + escapeHtml(formatHealthCheckedAt(alert.lastOccurredAt)) + '</div></div>' +
          '<div>' + escapeHtml(alert.subject || '') +
          (alert.lastError ? '<div class="alert-meta">' + escapeHtml(alert.lastError) + '</div>' : '') + '</div>' +
          '<div class="button-row">' +
          '<button type="button" class="button outline" aria-label="View alert details" onclick="openSystemAlertDetails(\'' + escapeAttr(alert.alertId) + '\')">View Details</button>' +
          '<button type="button" class="button outline" aria-label="Resolve alert" onclick="openSystemAlertResolution(\'' + escapeAttr(alert.alertId) + '\',\'' + escapeAttr(alert.severity) + '\')">Resolve</button>' +
          '</div></article>';
      }).join('')
    : '<div class="health-empty" role="status">Everything looks healthy. No unresolved system alerts.</div>';
  return '<div class="card"><div class="card-header"><div><h2>System Alerts (' +
    escapeHtml(String(data.unresolvedCount || 0)) +
    ')</h2><p>Protected durable warnings requiring HR review. ' +
    escapeHtml(String(data.notificationSentCount || 0)) +
    ' notification(s) already sent; ' +
    escapeHtml(String(data.notificationPendingCount || 0)) +
    ' still need alert delivery attention.</p></div><button type="button" class="button outline" onclick="refreshSystemHealth(true)">Refresh</button></div>' +
    '<div class="alert-viewer">' + rows + '</div>' +
    '<div class="button-row" style="margin-top:12px"><button type="button" class="button warning" onclick="confirmSelectedSystemAlertDrain()">Send Selected Alerts</button></div></div>';
}

function confirmSelectedSystemAlertDrain() {

    showToast('warning', 'System alerts', 'Select at least one Pending or Failed alert.');
    return;
  }
  const alertIds = selected.map(function(node) { return node.value; });
  const recipients = selected.map(function(node) { return node.getAttribute('data-recipient') || ''; });
  const includesDeliveryUnknown = selected.some(function(node) {
    return node.getAttribute('data-status') === 'Delivery Unknown';
  });
  openModal({
    title: 'Send selected system alerts?',
    body: '<p><strong>Components:</strong> ' + selected.length + '</p><p><strong>Exact recipients:</strong></p><ul>' +
      recipients.map(function(recipient) { return '<li>' + escapeHtml(recipient) + '</li>'; }).join('') +

      (includesDeliveryUnknown ? '<p><strong>Delivery Unknown:</strong> this selection explicitly resends an alert that may already have been delivered.</p>' : ''),
    confirmLabel: 'Send ' + selected.length + ' Alert(s)',
    tone: 'warning',
    checks: ['I verified the exact component count and recipients shown above.'],

          confirmed: true,

function formatHourLabel(hour) {
  const value = Number(hour || 0);
  const suffix = value >= 12 ? 'PM' : 'AM';
  const display = value % 12 || 12;
  return display + ':00 ' + suffix + ' ET';
}

function formatIsoDateForDisplay(value) {
  if (!value) return '';
  const parts = String(value).split('-');
  if (parts.length !== 3) return String(value);
  return Number(parts[1]) + '/' + Number(parts[2]) + '/' + parts[0];
}

  loadCycle(cycleId, action);
}

async function loadCycle(cycleId, action) {
  const requestId = ++clientRequestSeq;
  preferredCycleAction = action || 'overview';
  currentView = 'cycle';
  showCycleSkeleton();
  navigate('cycle');
  try {
    // Skeleton only — do not block the whole app with a full-screen overlay.
    const result = await server('getReviewCycle', cycleId);
    if (requestId !== clientRequestSeq) return;
    openCycle(result.cycle, action || 'overview');
  } catch (error) {
    if (requestId !== clientRequestSeq) return;
    renderCycleError(error, cycleId, action);
  }
}

function openCycle(cycle, action) {
  currentCycle = cycle;
  if (!cycle.historicalPreviousReview) {
    previousReviewContext = null;
    previousReviewContextCycleId = '';
    previousReviewContextLoading = false;
  }
  initializeDrafts(cycle);
  initializeMeetingDraft(cycle);
  preferredCycleAction = action || (cycle.primaryAction && cycle.primaryAction.key) || 'overview';
  currentCycleTab = actionToTab(preferredCycleAction, cycle);
  liveReleaseBannerVisible = false;
  if (shouldRestoreLiveReviewDocumentTitle_(document.hidden)) {
    restoreDocumentTitle_();
  }
  renderCycleWorkspace();
  navigate('cycle');
  setTopbar(cycle.employeeName + ' — ' + cycle.reviewType, humanStatus(cycle.status));
  startLiveReviewPolling_();

  if (preferredCycleAction === 'compensation' && !cycle.historicalPreviousReview) {
    setTimeout(function() {
      openCompensationWorkflow(cycle.cycleId);
    }, 350);
  }

  if (!deepLinkConsumed && INITIAL_CYCLE_ID) {
    deepLinkConsumed = true;
    showToast('info', 'Review opened', 'You were taken directly to the next action for this review.');
  }
}

function renderCycleWorkspace() {
  if (!currentCycle) return;
  const cycle = currentCycle;
  const tabs = buildCycleTabs(cycle);
  const historicalBanner = cycle.historicalPreviousReview
    ? '<div class="historical-banner" role="status">Completed previous review · Read-only' +
      (cycle.periodLabel ? ' · ' + escapeHtml(cycle.periodLabel) : '') +
      (cycle.sameReviewType === false ? ' · Different review type' : '') +
      '</div>'
    : '';
  const liveBanner = liveReleaseBannerVisible
    ? '<div class="warning-banner live-release-banner" role="status"><div><strong>' +
      (meetingDirty || meetingDraftPreserveAfterSeal
        ? 'Keep your meeting notes.'
        : 'Signatures have been released.') +
      '</strong><br>' +
      (meetingDirty || meetingDraftPreserveAfterSeal
        ? 'Unsaved or unconfirmed meeting text is still on this device. Copy anything you need before opening Signatures.'
        : 'You have unsaved text still visible on this screen. Copy anything you need before continuing.') +
      '</div><div class="button-row"><button type="button" class="button primary" onclick="openSignaturesAfterLiveRelease_()">Open Signatures</button></div></div>'
    : '';
  const liveSyncBanner = liveReviewSyncDelayed
    ? '<div class="info-banner" role="status"><strong>Live status delayed</strong> · Last synced ' +
      escapeHtml(formatLiveSyncAge_()) +
      ' ago</div>'
    : '';
  const backLabel = cycle.historicalPreviousReview
    ? '‹ Back to current review'
    : '‹ Back to reviews';
  const backAction = cycle.historicalPreviousReview
    ? 'returnToCurrentReviewFromPrevious()'
    : 'navigate(\'reviews\')';
  document.getElementById('cycleView').innerHTML =
    '<div class="cycle-hero"><div class="cycle-hero-top"><div><button class="breadcrumb-button" onclick="' + backAction + '">' + backLabel + '</button><h1>' + escapeHtml(cycle.employeeName) + ' — ' + escapeHtml(cycle.reviewType) + '</h1><p>' + escapeHtml(cycle.employeeJobTitle || '') + ' · ' + escapeHtml(cycle.departmentProject || '') + ' · Meeting ' + escapeHtml(cycle.reviewMeetingDate || '') + '</p></div>' +
    '<div class="cycle-hero-actions button-row">' + statusPill(cycle.status) + renderCycleHeaderActions(cycle) + '</div></div>' + historicalBanner + liveBanner + liveSyncBanner + (cycle.lifecycle ? renderTimeline(cycle.lifecycle) : '') + '</div>' +
    (cycle.historicalPreviousReview ? '' : renderSignatureRecoveryWarning(cycle)) +
    '<div class="cycle-tabs">' + tabs.map(function(tab) { return '<button class="cycle-tab ' + (tab.key === currentCycleTab ? 'active' : '') + '" onclick="activateCycleTab(\'' + tab.key + '\')">' + escapeHtml(tab.label) + (tab.attention ? '<span class="tab-dot"></span>' : '') + '</button>'; }).join('') + '</div>' +
    '<div id="cycleTabContent"></div>';
  renderActiveCycleTab();
}

function formatLiveSyncAge_() {
  if (!liveReviewLastSyncedAt) return 'unknown';
  const seconds = Math.max(
    0,
    Math.round((Date.now() - liveReviewLastSyncedAt) / 1000)
  );
  if (seconds < 60) return seconds + ' sec';
  return Math.round(seconds / 60) + ' min';
}

function returnToCurrentReviewFromPrevious() {
  const linkedId = currentCycle && currentCycle.linkedFromCycleId;
  if (!linkedId) {
    navigate('reviews');
    return;
  }
  loadCycle(linkedId, 'manager');
}

function renderCycleHeaderActions(cycle) {
  let html = '';
  if (cycle.historicalPreviousReview) {
    if (cycle.canDownloadManager) html += '<button class="button outline" onclick="downloadPdf(\'Manager Review\')">Download Manager Review</button>';
    if (cycle.canDownloadSelf) html += '<button class="button outline" onclick="downloadPdf(\'Self-Evaluation\')">Download Self-Evaluation</button>';
    if (!cycle.canDownloadManager && !cycle.canDownloadSelf) {
      html += '<span class="field-help">PDF available through HR</span>';
    }
    return html;
  }
  if (cycle.canStartMeeting) html += '<button class="button success" onclick="confirmStartMeeting()">Start Review Meeting</button>';
  if (cycle.canReleaseSignatures) html += '<button class="button warning" onclick="openReleaseModal()">Finalize & Release</button>';
  if (cycle.isHr && cycle.v31 && cycle.status !== 'Complete') {
    if (cycle.v31.needsFinalizationRetry || cycle.status === 'Finalizing') {
      html += '<button class="button outline" onclick="retryFinalization()">Retry Finalization</button>';
      if (cycle.v31.finalization && (cycle.v31.finalization.managerPdfUnknown || cycle.v31.finalization.selfPdfUnknown)) {
        html += '<button class="button outline" onclick="openPdfReconcileModal()">Reconcile PDF</button>';
      }
      if (cycle.v31.finalization && cycle.v31.finalization.distributionUnknown) {
        html += '<button class="button outline" onclick="openFinalDistributionConfirmModal()">Mark Distribution Confirmed</button>';
        html += '<button class="button outline" onclick="openFinalDistributionResendModal()">Explicitly Resend Final Packet</button>';
      }
    }
    if (cycle.v31.signatureClaims && cycle.v31.signatureClaims.reconciliationRequired) {
      html += '<button class="button outline" onclick="openSignatureReconcileModal()">Reconcile Signature</button>';
    }
    if (!cycle.v31.launchComplete) {
      html += '<button class="button outline" onclick="retryIncompleteLaunch()">Retry Launch</button>';
      if (cycle.v31.launchHasUnknownDelivery) {
        html += '<button class="button outline" onclick="openLaunchReconcileModal()">Reconcile Launch Delivery</button>';
      }
    } else {
      if (cycle.v31.calendarEventMissing) {
        html += '<button class="button outline" onclick="rebuildCalendarEvent()">Rebuild Calendar Event</button>';
      } else if (cycle.v31.calendarConfigWarning) {
        html += '<button class="button outline" onclick="retryCalendarConfiguration()">Retry Calendar Config</button>';
      }
      if (cycle.status !== 'Finalizing') {
        html += '<button class="button outline" onclick="resendLaunchInstructions()">Resend Instructions</button>';
      }
    }
    if (cycle.v31.notifications && cycle.v31.notifications.needsAttention) {
      html += '<button class="button outline" onclick="openNotificationRetryModal()">Retry Workflow Email</button>';
      html += '<button class="button outline" onclick="openWorkflowNotificationConfirmModal()">Mark Workflow Email Confirmed</button>';
      html += '<button class="button outline" onclick="dispatchPendingNotifications()">Drain Pending Emails</button>';
    }
  }
  if (cycle.canDownloadManager) html += '<button class="button outline" onclick="downloadPdf(\'Manager Review\')">Download Manager Review</button>';
  if (cycle.canDownloadSelf) html += '<button class="button outline" onclick="downloadPdf(\'Self-Evaluation\')">Download Self-Evaluation</button>';
  return html;
}

function renderSignatureRecoveryWarning(cycle) {
  const claims = cycle && cycle.v31 && cycle.v31.signatureClaims;
  const warnings = claims && claims.recoveryWarnings
    ? claims.recoveryWarnings
    : [];
  if (!cycle.isHr || !warnings.length) return '';
  return '<div class="guidance-card" style="margin:14px 0"><strong>Signature recovery attention</strong><p>' +
    warnings.map(escapeHtml).join('<br>') +
    '</p></div>';
}

          title: 'Retrying Finalization',

          return server('retryReviewFinalization', currentCycle.cycleId);

        if (result && result.ok) {

          await loadCycle(currentCycle.cycleId, currentCycleTab || 'overview');

      '<label>Component<br><select id="notificationComponent">' + optionsHtml + '</select></label>' +
      '<label style="display:block;margin-top:12px;"><input type="checkbox" id="allowUnknownNotificationResend" checked> Allow resend if Delivery Unknown</label>',
    confirmLabel: 'Review Recipient',
    tone: 'warning',
    onConfirm: async function() {
      const component = document.getElementById('notificationComponent').value;
      const allowUnknown = !!(document.getElementById('allowUnknownNotificationResend') && document.getElementById('allowUnknownNotificationResend').checked);
      if (!component) {
        showToast('warning', 'Notification', 'No eligible component selected.');
        return;
      }
      try {
        const plan = await server('getWorkflowNotificationRetryPlan', currentCycle.cycleId, component);
        if (plan.componentCount !== 1) {
          throw new Error('The selected component is no longer retryable.');
        }
        closeModal();
        openModal({
          title: 'Confirm one workflow email',
          body: '<p><strong>Component count:</strong> 1</p><p><strong>Exact recipients:</strong></p><ul>' +
            (plan.recipients || []).map(function(recipient) { return '<li>' + escapeHtml(recipient) + '</li>'; }).join('') +
            '</ul><p>No unrelated pending component will be sent.</p>',
          confirmLabel: 'Send One Component',
          tone: 'warning',
          checks: ['I verified the exact recipient list and component count.'],
          onConfirm: async function() {
            closeModal();
            try {
              const result = await server('retryWorkflowNotification', currentCycle.cycleId, component, {
                confirmed: true,
                confirmationToken: 'SEND_CONFIRMED_RECOVERY_EMAILS',
                componentCount: 1,
                recipients: plan.recipients,
                allowUnknownResend: allowUnknown
              });
              showToast('success', 'Notification', result.message || 'Updated');
              await loadCycle(currentCycle.cycleId, currentCycleTab || 'overview');
            } catch (error) {
              showToast('error', 'Could not retry notification', errorMessage(error));
            }
          }
        });
      } catch (error) {
        showToast('error', 'Could not retry notification', errorMessage(error));
      }
    }
  });
}

async function openWorkflowNotificationConfirmModal() {
  const notifications = (currentCycle.v31 && currentCycle.v31.notifications) || {};
  const labels = {
    ready: 'Ready-for-meeting',
    meetingManager: 'Meeting opened (manager)',
    meetingEmployee: 'Meeting opened (employee)',
    signatureManager: 'Manager signature request',
    signatureEmployee: 'Employee signature request',
    signatureHr: 'HR signature request'
  };
  const eligible = (notifications.eligibleUnresolved || []).filter(function(key) {
    return notifications[key] === 'Delivery Unknown' ||
      (notifications.components &&
        notifications.components[key] &&
        notifications.components[key].status === 'Delivery Unknown');
  });
  const optionsHtml = eligible.length
    ? eligible.map(function(key) {
        return '<option value="' + escapeAttr(key) + '">' +
          escapeHtml(labels[key] || key) + ' — Delivery Unknown</option>';
      }).join('')
    : '<option value="">No Delivery Unknown components</option>';

  openModal({
    title: 'Mark workflow email confirmed?',
    body:
      '<p>This sends no email. Use only with evidence that the original message was delivered.</p>' +
      '<label>Component<br><select id="confirmNotificationComponent">' + optionsHtml + '</select></label>',
    confirmLabel: 'Review Confirmation',
    tone: 'warning',
    onConfirm: async function() {
      const component = document.getElementById('confirmNotificationComponent').value;
      if (!component) {
        showToast('warning', 'Notification', 'No Delivery Unknown component selected.');
        return;
      }
      try {
        const plan = await server('getWorkflowNotificationRetryPlan', currentCycle.cycleId, component);
        if (!plan.canMarkConfirmed || plan.componentCount !== 1) {
          throw new Error('The selected component is no longer confirmable.');
        }
        closeModal();
        openModal({
          title: 'Confirm delivery without sending?',
          body: '<p><strong>Exact recipients:</strong></p><ul>' +
            (plan.recipients || []).map(function(recipient) { return '<li>' + escapeHtml(recipient) + '</li>'; }).join('') +
            '</ul><label>Evidence note *<br><textarea id="workflowConfirmEvidence" rows="4"></textarea></label>',
          confirmLabel: 'Mark Confirmed — No Send',
          tone: 'warning',
          checks: ['I verified delivery evidence for the original attempt.'],
          onConfirm: async function() {
            const note = String((document.getElementById('workflowConfirmEvidence') || {}).value || '').trim();
            closeModal();
            try {
              const result = await server('markWorkflowNotificationConfirmed', currentCycle.cycleId, component, {
                confirmed: true,
                confirmationToken: 'MARK_WORKFLOW_NOTIFICATION_CONFIRMED',
                evidenceNote: note,
                originalAttemptId: plan.attemptId,
                recipients: plan.recipients
              });
              showToast('success', 'Notification', result.message || 'Marked confirmed without sending email.');
              await loadCycle(currentCycle.cycleId, currentCycleTab || 'overview');
            } catch (error) {
              showToast('error', 'Could not mark confirmed', errorMessage(error));
            }
          }
        });
      } catch (error) {
        showToast('error', 'Could not load confirmation plan', errorMessage(error));
      }
    }
  });
}

async function dispatchPendingNotifications() {
  let plan;
  try {
    plan = await server('getWorkflowOutboxManualPlan', currentCycle.cycleId);
  } catch (error) {
    showToast('error', 'Could not inspect notifications', errorMessage(error));
    return;
  }
  if (!plan.componentCount) {
    showToast('info', 'Workflow outbox', 'No eligible Pending or Failed components are ready to send.');
    return;
  }
  const componentKeys = plan.components.map(function(component) { return component.key; });
  const recipients = plan.components.map(function(component) { return component.recipients; });
  openModal({
    title: 'Drain pending workflow emails?',
    body:
      '<p><strong>This deliberately sends email.</strong> Preview/Paused never does this automatically. Delivery Unknown components are not included.</p>' +
      '<p><strong>Component count:</strong> ' + escapeHtml(String(plan.componentCount)) + '</p>' +
      '<ul>' + plan.components.map(function(component) {
        return '<li><strong>' + escapeHtml(component.label) + '</strong>: ' + escapeHtml((component.recipients || []).join(', ')) + '</li>';
      }).join('') + '</ul>',
    confirmLabel: 'Send ' + plan.componentCount + ' Component(s)',
    tone: 'warning',
    checks: ['I verified every exact recipient and the component count shown above.'],
    onConfirm: async function() {
      closeModal();
      try {
        const result = await server('drainWorkflowOutboxNow', {
          confirmed: true,
          confirmationToken: 'SEND_CONFIRMED_RECOVERY_EMAILS',
          cycleId: currentCycle.cycleId,
          componentKeys: componentKeys,
          componentCount: plan.componentCount,
          recipients: recipients
        });
        showToast(
          result.failed ? 'warning' : 'success',
          'Workflow outbox',
          result.message || ('Sent ' + Number(result.sent || 0) + ' notification(s).')
        );
        await loadCycle(currentCycle.cycleId, currentCycleTab || 'overview');
      } catch (error) {
        showToast('error', 'Could not drain notifications', errorMessage(error));
      }
    }
  });
}

function renderTimeline(stages) {
  return '<div class="timeline">' + (stages || []).map(function(stage) {
    return '<div class="timeline-stage ' + (stage.complete ? 'complete ' : '') + (stage.current ? 'current' : '') + '"><span class="timeline-dot"></span><span class="timeline-label">' + escapeHtml(stage.label) + '</span></div>';
  }).join('') + '</div>';
}

function buildCycleTabs(cycle) {
  if (cycle.historicalPreviousReview) {
    return [
      { key: 'overview', label: 'Overview' },
      { key: 'manager', label: 'Manager Review' },
      { key: 'self', label: 'Self-Evaluation' },
      { key: 'meeting', label: 'Review Meeting' },
      { key: 'signatures', label: 'Signatures' }
    ];
  }
  return [
    { key: 'overview', label: 'Overview' },
    { key: 'manager', label: 'Manager Review', attention: cycle.canEditManagerReview },
    { key: 'self', label: 'Self-Evaluation', attention: cycle.canEditSelfEvaluation },
    { key: 'meeting', label: 'Review Meeting', attention: cycle.canStartMeeting || cycle.status === 'Review Meeting Open' },
    { key: 'signatures', label: 'Signatures', attention: cycle.signatureTasks && cycle.signatureTasks.length > 0 }
  ];
}

function activateCycleTab(tab) {
  flushVisibleDraftToState();
  currentCycleTab = tab;
  renderCycleWorkspace();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderActiveCycleTab() {
  const target = document.getElementById('cycleTabContent');
  if (!target || !currentCycle) return;
  if (currentCycleTab === 'overview') target.innerHTML = renderCycleOverview(currentCycle);
  if (currentCycleTab === 'manager') renderReviewTab('manager', target);
  if (currentCycleTab === 'self') renderReviewTab('self', target);
  if (currentCycleTab === 'meeting') renderMeetingTab(target);
  if (currentCycleTab === 'signatures') renderSignaturesTab(target);
  updateGlobalSaveIndicator();
}

function renderCycleOverview(cycle) {
  const summary = [
    ['Employee', cycle.employeeName + ' (' + cycle.employeeEmail + ')'],
    ['Job Title', cycle.employeeJobTitle],
    ['Department / Project', cycle.departmentProject],
    ['Manager', cycle.managerName + ' (' + cycle.managerEmail + ')'],
    ['Review Period', cycle.reviewPeriodStart + ' – ' + cycle.reviewPeriodEnd],
    ['Scheduled Meeting', cycle.reviewMeetingDate],
    ['Manager Review', humanDocumentStatus(cycle.managerReviewStatus)],
    ['Self-Evaluation', humanDocumentStatus(cycle.selfEvaluationStatus)],
    ['Manager Form Due', cycle.v31 && cycle.v31.managerDueDate ? cycle.v31.managerDueDate : 'Not set'],
    ['Employee Form Due', cycle.v31 && cycle.v31.employeeDueDate ? cycle.v31.employeeDueDate : 'Not set'],
    ['Calendar Event', cycle.v31 && cycle.v31.calendarEventId
      ? (cycle.v31.calendarConfigWarning
          ? 'Created — not Configured'
          : (cycle.v31.launchComponents && cycle.v31.launchComponents.calendarConfigured
              ? 'Configured'
              : 'Created'))
      : 'Not created'],
    ['Meeting Opened', cycle.meetingOpenedAt || 'Not yet'],
    ['Completed', cycle.completedAt || 'Not yet']
  ];

  return renderCycleGuidance(cycle) +
    '<div class="review-status-grid">' +
    renderProgressStatusCard(
      'Manager Performance Review',
      cycle.managerReviewProgress,
      cycle.managerReviewStatus,
      cycle.managerReviewVisible,
      cycle.canEditManagerReview ? 'manager-review' : 'manager'
    ) +
    renderProgressStatusCard(
      'Employee Self-Evaluation',
      cycle.selfEvaluationProgress,
      cycle.selfEvaluationStatus,
      cycle.selfEvaluationVisible,
      cycle.canEditSelfEvaluation ? 'self-evaluation' : 'self'
    ) +
    '</div>' +
    renderCompensationCard(cycle) +
    (cycle.status === 'Open for Input'
      ? '<div class="privacy-banner"><strong>Independent preparation is active.</strong> The manager and employee cannot see each other’s responses until both are submitted and the meeting is opened.</div>'
      : '') +
    '<div class="card"><div class="card-header"><div><h2>Review Details</h2><p>Core information for this review cycle.</p></div>' +
    (cycle.primaryAction && cycle.primaryAction.required
      ? '<button class="button ' + actionButtonClass(cycle.primaryAction.tone) + '" onclick="handleCycleAction(\'' +
        escapeAttr(cycle.primaryAction.key) +
        '\')">' +
        escapeHtml(cycle.primaryAction.label) +
        '</button>'
      : '') +
    '</div><div class="summary-grid">' +
    summary.map(function(row) {
      return '<div class="summary-label">' +
        escapeHtml(row[0]) +
        '</div><div>' +
        escapeHtml(row[1]) +
        '</div>';
    }).join('') +
    '</div></div>';
}

function renderCycleGuidance(cycle) {
  const items = cycle.v31 && cycle.v31.guidance
    ? cycle.v31.guidance
    : [];

  if (!items.length) return '';

  return '<div class="guidance-stack">' +
    items.map(function(item) {
      return '<div class="guidance-card ' +
        escapeAttr(item.tone || 'info') +
        '"><div><h3>' +
        escapeHtml(item.title) +
        '</h3><p>' +
        escapeHtml(item.message) +
        '</p></div>' +
        (item.actionLabel
          ? '<button class="button outline" onclick="handleCycleAction(\'' +
            escapeAttr(item.action || 'overview') +
            '\')">' +
            escapeHtml(item.actionLabel) +
            '</button>'
          : '') +
        '</div>';
    }).join('') +
    '</div>';
}

function renderCompensationCard(cycle) {
  if (
    cycle.historicalPreviousReview ||
    !cycle.v31 ||
    !cycle.v31.compensationRequired ||
    (!cycle.isManager && !cycle.isHr)
  ) {
    return '';
  }

  const complete = cycle.v31.compensationComplete;
  const statusClass = complete ? ' complete' : '';
  const decision = cycle.v31.compensationDecision || 'Pending';
  const status = cycle.v31.compensationStatus || 'Pending';
  const record = cycle.v31.compensationRecord;
  const ownerDecision = record && record.ownerDecision
    ? record.ownerDecision
    : '';
  const denied = ownerDecision === 'Denied' || status === 'Denied';

  let body =
    '<p class="field-help">Managers enter a percentage increase only. HR records the owner decision (approve, modify, or decline) before the meeting when an adjustment was recommended.</p>';

  if (record) {
    body +=
      '<details class="compensation-details" style="margin-top:12px">' +
      '<summary><strong>Compensation Decision</strong> — Show Details</summary>' +
      '<div class="notice" style="margin-top:10px">' +
      '<div><strong>Current Pay Rate:</strong> ' +
      escapeHtml(formatMoneyDisplay(record.originalPayRate)) +
      ' · <strong>Annual:</strong> ' +
      escapeHtml(formatMoneyDisplay(record.originalAnnualSalary)) +
      '</div>' +
      '<div><strong>Recommended Increase:</strong> ' +
      escapeHtml(String(record.managerRecommendedPercentDisplay)) +
      '% → ' +
      escapeHtml(formatMoneyDisplay(record.managerRecommendedPayRate)) +
      ' / ' +
      escapeHtml(formatMoneyDisplay(record.managerRecommendedAnnualSalary)) +
      ' annual</div>' +
      (record.managerBusinessJustification
        ? '<div><strong>Justification:</strong> ' +
          escapeHtml(record.managerBusinessJustification) +
          '</div>'
        : '') +
      (denied
        ? '<div><strong>Final Decision:</strong> No Compensation Adjustment (owner declined)</div>'
        : record.finalApprovedPayRate != null
        ? '<div><strong>Final Approved:</strong> ' +
          escapeHtml(String(record.finalApprovedPercentDisplay)) +
          '% → ' +
          escapeHtml(formatMoneyDisplay(record.finalApprovedPayRate)) +
          ' / ' +
          escapeHtml(formatMoneyDisplay(record.finalApprovedAnnualSalary)) +
          ' · Effective ' +
          escapeHtml(record.compensationEffectiveDate || '') +
          (ownerDecision
            ? ' · ' + escapeHtml(ownerDecision)
            : '') +
          '</div>'
        : '<div><strong>Status:</strong> Awaiting owner decision</div>') +
      '</div></details>';
  } else if (cycle.v31.compensationDecisionNotes) {
    body +=
      '<div class="notice" style="margin-top:12px"><strong>Notes:</strong> ' +
      escapeHtml(cycle.v31.compensationDecisionNotes) +
      '</div>';
  }

  let actions = '';
  if (cycle.v31.canManageCompensation && !complete && !record) {
    actions =
      '<div class="button-row" style="margin-top:15px">' +
      '<button class="button primary" onclick="openCompensationDecisionModal(\'' +
      escapeAttr(cycle.cycleId) +
      '\')">Complete Compensation Decision</button>' +
      '</div>';
  }

  if (cycle.isHr && record && record.status === 'Awaiting Owner Decision') {
    actions +=
      '<div class="button-row" style="margin-top:10px">' +
      '<button class="button primary" onclick="openOwnerDecisionModal(\'' +
      escapeAttr(cycle.cycleId) +
      '\')">Record Owner Decision</button>' +
      '</div>';
  }

  if (
    cycle.isHr &&
    record &&
    (record.status === 'Awaiting Signatures' || record.status === 'Denied') &&
    (record.canEditOwnerDecision || record.status === 'Denied')
  ) {
    actions +=
      '<div class="button-row" style="margin-top:10px">' +
      '<button class="button outline" onclick="openOwnerDecisionModal(\'' +
      escapeAttr(cycle.cycleId) +
      '\', true)">Edit Owner Decision</button>' +
      '</div>';
  }

  if (cycle.isHr && !complete && decision && decision !== 'Pending') {
    actions +=
      '<div class="button-row" style="margin-top:10px">' +
      '<button class="button outline" onclick="confirmResetCompensation(\'' +
      escapeAttr(cycle.cycleId) +
      '\')">Reset Compensation Decision</button>' +
      '</div>';
  }

  return (
    '<div class="card compensation-card"><div class="card-header"><div><h2>Compensation Decision</h2><p>Manager recommendation and owner-approved final compensation.</p></div><span class="compensation-status' +
    statusClass +
    '">' +
    escapeHtml(denied ? 'Denied' : decision) +
    (status && status !== decision && !denied
      ? ' · ' + escapeHtml(status)
      : '') +
    '</span></div>' +
    body +
    actions +
    '</div>'
  );
}

function formatMoneyDisplay(value) {
  const amount = Number(value || 0);
  return (
    '$' +
    amount.toLocaleString('en-US', {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    })
  );
}

function handleCycleAction(action) {
  if (action === 'compensation') {
    openCompensationDecisionModal(currentCycle.cycleId);
    return;
  }

  activateCycleTab(actionToTab(action, currentCycle));
}

function renderProgressStatusCard(title, progress, status, visible, action) {
  return '<div class="review-status-card"><div class="card-header"><div><h3>' + escapeHtml(title) + '</h3><p>' + escapeHtml(humanDocumentStatus(status)) + '</p></div>' + statusPillForDocument(status) + '</div>' +
    '<div class="progress-track"><div class="progress-fill" style="width:' + progress.percent + '%"></div></div><div class="field-help" style="margin-top:7px">' + progress.percent + '% complete · ' + progress.ratingsCompleted + ' of ' + progress.ratingsTotal + ' ratings</div>' +
    '<div class="button-row" style="margin-top:13px"><button class="button outline" onclick="activateCycleTab(\'' + (action === 'manager-review' ? 'manager' : action === 'self-evaluation' ? 'self' : action) + '\')">' + (visible ? 'Open' : 'View status') + '</button></div></div>';

function renderReviewTab(type, target) {
  const isManager = type === 'manager';
  const visible = isManager ? currentCycle.managerReviewVisible : currentCycle.selfEvaluationVisible;
  const editable = isManager ? currentCycle.canEditManagerReview : currentCycle.canEditSelfEvaluation;
  const title = isManager ? 'Manager Performance Review' : 'Employee Self-Evaluation';
  const previousPanel = isManager && !currentCycle.historicalPreviousReview
    ? renderPreviousReviewPanel()
    : '';

  if (!visible) {
    target.innerHTML = previousPanel + '<div class="card"><div class="empty-state"><div class="empty-state-icon">◉</div><strong>' + title + ' is private</strong>This evaluation remains hidden until both participants submit and the review meeting is opened.</div></div>';
    maybeLoadPreviousReviewContext();
    return;
  }

  if (!editable) {
    const review = isManager ? currentCycle.managerReview : currentCycle.selfEvaluation;
    target.innerHTML = previousPanel + '<div class="card"><div class="card-header"><div><h2>' + title + '</h2><p>' + escapeHtml(humanDocumentStatus(isManager ? currentCycle.managerReviewStatus : currentCycle.selfEvaluationStatus)) + '</p></div></div>' + renderReadOnlyReview(review, type) + '</div>';
    maybeLoadPreviousReviewContext();
    return;
  }

  renderReviewEditor(type, target);
}

function initializeDrafts(cycle) {
  if (cycle.managerReview) {
    editorState.manager.draft = restoreLocalDraft('manager', cycle.managerReview);
    if (cycle.canEditManagerReview) {
      editorState.manager.draft.overallRating = calculateClientOverallScore(
        editorState.manager.draft
      );
    }
    editorState.manager.lastSavedAt = cycle.managerReview.lastSavedAt || '';
    editorState.manager.validation = validateReviewDraft(editorState.manager.draft, 'manager');
    editorState.manager.showErrors = false;
    if (editorState.manager.dirty && cycle.canEditManagerReview) {
      clearTimeout(editorState.manager.autosaveTimer);
      editorState.manager.autosaveTimer = setTimeout(function() { autosaveReview('manager'); }, 800);
    }
  }
  if (cycle.selfEvaluation) {
    editorState.self.draft = restoreLocalDraft('self', cycle.selfEvaluation);
    if (cycle.canEditSelfEvaluation) {
      editorState.self.draft.overallRating = calculateClientOverallScore(
        editorState.self.draft
      );
    }
    editorState.self.lastSavedAt = cycle.selfEvaluation.lastSavedAt || '';
    editorState.self.validation = validateReviewDraft(editorState.self.draft, 'self');
    editorState.self.showErrors = false;
    if (editorState.self.dirty && cycle.canEditSelfEvaluation) {
      clearTimeout(editorState.self.autosaveTimer);
      editorState.self.autosaveTimer = setTimeout(function() { autosaveReview('self'); }, 800);
    }
  }
}

function restoreLocalDraft(type, serverDraft) {
  const clone = deepClone(serverDraft || {});
  const key = draftStorageKey(type);
  try {
    const stored = JSON.parse(localStorage.getItem(key) || 'null');
    const serverTime = new Date(serverDraft.lastSavedAt || 0).getTime();
    const localTime = new Date(stored && stored.savedAt || 0).getTime();
    if (stored && stored.data && localTime > serverTime) {
      editorState[type].dirty = true;
      setTimeout(function() { showToast('warning', 'Draft restored', 'Unsynced work from this browser was restored and will autosave.'); }, 300);
      return stored.data;
    }
  } catch (error) {}
  editorState[type].dirty = false;
  return clone;
}

function renderReviewEditor(type, target) {
  const model = editorState[type];
  const progress = calculateClientProgress(model.draft, type);
  const steps = EDITOR_STEPS[type];
  const title = type === 'manager' ? 'Manager Performance Review' : 'Employee Self-Evaluation';
  const previousPanel = type === 'manager' && !currentCycle.historicalPreviousReview
    ? renderPreviousReviewPanel()
    : '';

  target.innerHTML = previousPanel + '<div class="card"><div class="card-header"><div><h2>' + title + '</h2><p>Drafts save automatically while you work. Submission permanently seals your independent evaluation.</p></div>' + statusPillForDocument(type === 'manager' ? currentCycle.managerReviewStatus : currentCycle.selfEvaluationStatus) + '</div>' +
    '<div class="editor-shell"><aside class="editor-sidebar"><div class="progress-block"><div id="editorProgressNumber" class="editor-progress-number">' + progress.percent + '%</div><div class="progress-track"><div id="editorProgressFill" class="progress-fill" style="width:' + progress.percent + '%"></div></div><div id="editorProgressMeta" class="editor-progress-meta">' + progress.ratingsCompleted + ' of ' + progress.ratingsTotal + ' ratings · ' + progress.errors.length + ' required item(s) missing</div></div>' +
    steps.map(function(step, index) { return '<button class="editor-step-button ' + (index === model.step ? 'active ' : '') + (isStepComplete(model.draft, type, index) ? 'complete' : '') + '" onclick="setEditorStep(\'' + type + '\',' + index + ')"><span class="step-number">' + (index + 1) + '</span><span>' + escapeHtml(step.label) + '</span></button>'; }).join('') + '</aside>' +
    '<div class="editor-main"><div id="editorStepContent"></div><div class="editor-footer"><button class="button outline" onclick="moveEditorStep(\'' + type + '\',-1)" ' + (model.step === 0 ? 'disabled' : '') + '>Previous</button><button class="button secondary" onclick="manualSaveReview(\'' + type + '\')">Save draft</button><div class="editor-footer-spacer"></div><span id="editorFooterStatus" class="editor-footer-status">' + editorSaveStatusText(type) + '</span>' + (model.step < steps.length - 1 ? '<button class="button primary" onclick="moveEditorStep(\'' + type + '\',1)">Next</button>' : '<button class="button primary" onclick="requestSubmitReview(\'' + type + '\')">Submit and Seal</button>') + '</div></div></div></div>';

  renderEditorStep(type);
  updateGlobalSaveIndicator();
  maybeLoadPreviousReviewContext();
}

function renderEditorStep(type) {
  const model = editorState[type];
  const draft = model.draft;
  const step = model.step;
  const target = document.getElementById('editorStepContent');
  if (!target) return;

  if (step === 0) target.innerHTML = renderRatingsStep(type, draft);
  if (step === 1) target.innerHTML = renderSummaryStep(type, draft);
  if (step === 2) target.innerHTML = renderDevelopmentStep(type, draft);
  if (step === 3) target.innerHTML = renderReviewSubmitStep(type, draft);
  bindEditorInputs(type);
  applyInlineValidation(type);
}

function renderRatingsStep(type, draft) {
  const byId = ratingsById(draft.ratings);
  return '<div class="editor-section-header"><h2>Performance Factors</h2><p>Rate each factor using the 1–7 scale. Supporting comments are required for ratings of 1, 2, 6, or 7.</p></div>' + renderRatingGuide() +
    state.factors.map(function(factor) {
      const item = byId[factor.id] || { rating: '', comments: '' };
      const ratingId = 'rating-' + type + '-' + factor.id;
      const commentId = 'comments-' + type + '-' + factor.id;
      return '<div id="factor-' + type + '-' + factor.id + '" class="factor-card"><div class="factor-head"><div><div class="factor-title">' + escapeHtml(factor.label) + '</div><div class="factor-description">' + escapeHtml(factor.description) + '</div></div><div class="field"><label for="' + ratingId + '">Rating *</label>' + ratingSelectHtml(ratingId, item.rating, 'rating', factor.id) + '<div id="error-' + ratingId + '" class="field-error hidden"></div></div></div>' +
      '<div class="field"><label for="' + commentId + '">Comments</label><textarea id="' + commentId + '" data-kind="comments" data-factor-id="' + factor.id + '">' + escapeHtml(item.comments || '') + '</textarea><div class="field-help">Use specific examples where possible.</div><div id="error-' + commentId + '" class="field-error hidden"></div></div></div>';
    }).join('');
}

function renderRatingGuide() {
  return '<details class="rating-guide-details"><summary>View the complete 1–7 rating definitions</summary><div class="rating-scale-grid">' + state.ratings.map(function(rating) { return '<div class="rating-definition"><strong>' + rating.value + ' — ' + escapeHtml(rating.label) + '</strong>' + escapeHtml(rating.definition) + '</div>'; }).join('') + '<div class="rating-definition"><strong>N/A</strong>Not applicable to the role or insufficient opportunity to evaluate.</div></div></details>';
}

function renderSummaryStep(type, draft) {
  const overall = calculateClientOverallScore(draft);
  return '<div class="editor-section-header"><h2>Overall Assessment</h2><p>Overall Score is calculated automatically from your competency ratings. Add narrative context below.</p></div>' +
    '<div class="field factor-card"><label>Overall Score ' +
    infoTipHtml('Automatically calculated as the average of this review\'s competency scores. Blank and N/A factors are excluded.') +
    '</label><div class="derived-overall" id="overall-' + type + '">' +
    (overall ? escapeHtml(overall) : '—') +
    '</div><div class="field-help">Derived from scored factors only. Individual factor ratings still drive this value.</div></div>' +
    '<div class="field"><label for="overall-comments-' + type + '">Overall Comments</label><textarea id="overall-comments-' + type + '" data-kind="field" data-field="overallComments">' + escapeHtml(draft.overallComments || '') + '</textarea><div class="field-help">Describe the major themes, impact, and context behind the overall rating.</div></div>';
}

function renderDevelopmentStep(type, draft) {
  const manager = type === 'manager';
  const fields = manager ? [
    ['areasForImprovement', 'Areas for Improvement', 'Identify specific behaviors, skills, or outcomes that should improve.'],
    ['actionSteps', 'Action Steps', 'Document concrete actions the employee and manager will take.'],
    ['supervisorComments', 'Supervisor Comments', 'Add relevant context not captured elsewhere.']
  ] : [
    ['keyAccomplishments', 'Key Accomplishments', 'Summarize the most meaningful contributions from the review period.'],
    ['areasForGrowth', 'Areas for Growth', 'Identify skills, habits, or responsibilities you want to strengthen.'],
    ['goalsForNextPeriod', 'Goals for the Next Review Period', 'Describe the outcomes you plan to achieve next.'],
    ['supportNeeded', 'Support or Training Needed', 'Describe training, resources, or manager support that would help.']
  ];
  return '<div class="editor-section-header"><h2>' + (manager ? 'Development and Follow-Through' : 'Accomplishments and Development') + '</h2><p>These sections help turn the review into a practical development plan.</p></div>' + fields.map(function(field) {
    return '<div class="field" style="margin-bottom:16px"><label for="field-' + type + '-' + field[0] + '">' + escapeHtml(field[1]) + '</label><textarea id="field-' + type + '-' + field[0] + '" data-kind="field" data-field="' + field[0] + '">' + escapeHtml(draft[field[0]] || '') + '</textarea><div class="field-help">' + escapeHtml(field[2]) + '</div></div>';
  }).join('');
}

function renderReviewSubmitStep(type, draft) {
  const validation = validateReviewDraft(draft, type);
  const progress = calculateClientProgress(draft, type);
  const label = type === 'manager' ? 'manager review' : 'self-evaluation';
  let readiness = '';
  if (!validation.errors.length) readiness += '<div class="readiness-item success">✓ All required ratings and comments are complete.</div>';
  validation.errors.forEach(function(error) { readiness += '<div class="readiness-item error">! ' + escapeHtml(error.message) + '</div>'; });
  validation.warnings.forEach(function(warning) { readiness += '<div class="readiness-item warning">△ ' + escapeHtml(warning.message) + '</div>'; });
  return '<div class="editor-section-header"><h2>Review and Submit</h2><p>Check the evaluation before sealing it. Once submitted, the original independent response cannot be edited.</p></div>' +
    '<div class="card" style="box-shadow:none"><div class="card-header"><div><h3>Submission readiness</h3><p>' + progress.percent + '% complete · ' + validation.errors.length + ' blocking issue(s) · ' + validation.warnings.length + ' recommendation(s)</p></div>' + statusPill(validation.errors.length ? 'Needs attention' : 'Ready to submit', validation.errors.length ? 'amber' : 'green') + '</div><div class="readiness-list">' + readiness + '</div>' +
    '<div class="warning-banner"><strong>Submission seals your ' + label + '.</strong> It remains private from the other participant until both evaluations are submitted and the review meeting is opened.</div>' +
    '<div class="button-row"><button class="button secondary" onclick="manualSaveReview(\'' + type + '\')">Save draft</button><button class="button primary" onclick="requestSubmitReview(\'' + type + '\')">Submit and Seal</button></div></div>';
}

function ratingSelectHtml(id, selected, kind, factorId) {
  let html = '<select id="' + escapeAttr(id) + '" data-kind="' + kind + '"' + (factorId ? ' data-factor-id="' + escapeAttr(factorId) + '"' : '') + '><option value="">Select</option>';
  state.ratings.forEach(function(rating) { html += '<option value="' + rating.value + '"' + (String(selected) === String(rating.value) ? ' selected' : '') + '>' + rating.value + ' — ' + escapeHtml(rating.label) + '</option>'; });
  return html + '<option value="N/A"' + (String(selected) === 'N/A' ? ' selected' : '') + '>N/A — Not Applicable / Not Observed</option></select>';
}

function bindEditorInputs(type) {
  const target = document.getElementById('editorStepContent');
  if (!target) return;
  target.querySelectorAll('input,select,textarea').forEach(function(input) {
    input.addEventListener('input', function() { updateDraftFromInput(type, input); });
    input.addEventListener('change', function() { updateDraftFromInput(type, input); });
  });
}

function updateDraftFromInput(type, input) {
  const draft = editorState[type].draft;
  const kind = input.dataset.kind;
  if (kind === 'rating' || kind === 'comments') {
    const factorId = input.dataset.factorId;
    let item = (draft.ratings || []).find(function(entry) { return entry.factorId === factorId; });
    if (!item) { item = { factorId: factorId, rating: '', comments: '' }; draft.ratings = draft.ratings || []; draft.ratings.push(item); }
    if (kind === 'rating') item.rating = input.value;
    if (kind === 'comments') item.comments = input.value;
  } else if (kind === 'field') {
    draft[input.dataset.field] = input.value;
  }
  if (kind === 'rating') {
    draft.overallRating = calculateClientOverallScore(draft);
  }
  markReviewDirty(type);
  editorState[type].validation = validateReviewDraft(draft, type);
  applyInlineValidation(type);
  updateEditorProgress(type);
}

function markReviewDirty(type) {
  const model = editorState[type];
  model.dirty = true;
  saveLocalDraft(type);
  setSaveIndicator('unsaved', 'Unsaved changes');
  clearTimeout(model.autosaveTimer);
  model.autosaveTimer = setTimeout(function() { autosaveReview(type); }, autosaveDelayMs);
}

function saveLocalDraft(type) {
  if (!currentCycle || !editorState[type].draft) return;
  try {
    localStorage.setItem(draftStorageKey(type), JSON.stringify({ savedAt: new Date().toISOString(), data: editorState[type].draft }));
  } catch (error) {}
}

function draftStorageKey(type) {
  return currentCycle ? 'aitheras-review-draft:' + currentCycle.cycleId + ':' + type : '';
}

async function autosaveReview(type) {
  const model = editorState[type];
  if (!model.dirty || model.saving || !navigator.onLine || !currentCycle) return;
  model.saving = true;
  setSaveIndicator('saving', 'Saving draft…');
  try {
    const result = await server('autosaveReview', currentCycle.cycleId, REVIEW_TYPES[type], deepClone(model.draft));
    model.dirty = false;
    model.saving = false;
    model.lastSavedAt = result.savedAtIso;
    model.draft.lastSavedAt = result.savedAtIso;
    localStorage.removeItem(draftStorageKey(type));
    setSaveIndicator('saved', 'Saved ' + result.savedAt);
    syncCycleSummaryFromDraft(type, result);
    updateEditorFooterStatus(type);
  } catch (error) {
    model.saving = false;
    setSaveIndicator('error', 'Save failed — retrying');
    showToast('warning', 'Draft not synced', 'Your work is stored locally and will retry automatically. ' + errorMessage(error));
    model.autosaveTimer = setTimeout(function() { autosaveReview(type); }, 15000);
  }
}

async function manualSaveReview(type) {
  flushVisibleDraftToState();
  const model = editorState[type];
  setSaveIndicator('saving', 'Saving draft…');
  try {
    const method = type === 'manager' ? 'saveManagerReview' : 'saveSelfEvaluation';
    const result = await server(method, currentCycle.cycleId, deepClone(model.draft), false);
    model.dirty = false;
    model.lastSavedAt = result.savedAtIso;
    model.draft.lastSavedAt = result.savedAtIso;
    localStorage.removeItem(draftStorageKey(type));
    setSaveIndicator('saved', 'Saved ' + result.savedAt);
    syncCycleSummaryFromDraft(type, result);
    showToast('success', 'Draft saved', result.message);
    updateEditorFooterStatus(type);
  } catch (error) {
    setSaveIndicator('error', 'Save failed');
    showToast('error', 'Could not save draft', errorMessage(error));
  }
}

function syncCycleSummaryFromDraft(type, result) {
  if (!state || !currentCycle) return;
  const summary = (state.cycles || []).find(function(item) { return item.cycleId === currentCycle.cycleId; });
  if (!summary) return;
  const progress = calculateClientProgress(editorState[type].draft, type);
  if (type === 'manager') {
    summary.managerProgress = progress;
    summary.managerReviewStatus = 'Draft';
    summary.actionKey = 'manager-review';
    summary.actionLabel = 'Continue Manager Review';
  } else {
    summary.selfProgress = progress;
    summary.selfEvaluationStatus = 'Draft';
    summary.actionKey = 'self-evaluation';
    summary.actionLabel = 'Continue Self-Evaluation';
  }
  summary.actionTone = 'primary';
  summary.actionRequired = true;
  summary.updatedAt = result.savedAt;
  summary.updatedAtIso = result.savedAtIso;
  renderDashboard();
  renderReviewsView();
  renderSignaturesView();
  rebuildNotifications();
}

function requestSubmitReview(type) {
  flushVisibleDraftToState();
  const validation = validateReviewDraft(editorState[type].draft, type);
  editorState[type].validation = validation;
  editorState[type].showErrors = true;
  if (validation.errors.length) {
    const first = validation.errors[0];
    editorState[type].step = first.step;
    renderReviewEditor(type, document.getElementById('cycleTabContent'));
    setTimeout(function() { scrollToField(first.fieldId); }, 80);
    showToast('error', 'Review is not ready', validation.errors.length + ' required item(s) still need attention.');
    return;
  }

  const warningHtml = validation.warnings.length ? '<div class="warning-banner"><strong>Recommended improvements</strong><ul>' + validation.warnings.map(function(item) { return '<li>' + escapeHtml(item.message) + '</li>'; }).join('') + '</ul></div>' : '<div class="success-banner">All required information is complete.</div>';
  openModal({
    title: 'Submit and seal this evaluation?',
    body: warningHtml + '<p>Once submitted, the original independent evaluation cannot be edited. It will remain private until the review meeting is opened.</p>',
    confirmLabel: 'Submit and Seal',
    tone: 'primary',
    onConfirm: function() { submitReview(type); }
  });
}

async function submitReview(type) {
  closeModal();
  const model = editorState[type];
  clearTimeout(model.autosaveTimer);
  setSaveIndicator('saving', 'Submitting…');
  try {
    const method = type === 'manager' ? 'saveManagerReview' : 'saveSelfEvaluation';
    const result = await server(method, currentCycle.cycleId, deepClone(model.draft), true);
    model.dirty = false;
    localStorage.removeItem(draftStorageKey(type));
    showToast('success', 'Evaluation submitted', result.message);
    applyReviewSubmitResult_(type, result);
    if (result.accelerateNotifications) {
      server('accelerateReviewSubmissionNotifications', currentCycle.cycleId)
        .then(function(notifyResult) {
          if (notifyResult && notifyResult.ok === false) {
            showToast(
              'warning',
              'Notification pending',
              notifyResult.message ||
                'Your evaluation is saved. Notification delivery is pending in the workflow queue.'
            );
          }
        })
        .catch(function() {
          showToast(
            'warning',
            'Notification pending',
            'Your evaluation is saved. Notification delivery is pending in the workflow queue.'
          );
        });
    }
    if (
      type === 'manager' &&
      result.compensationDecisionRequired
    ) {
      openCompensationDecisionModal(currentCycle.cycleId);
    }
  } catch (error) {
    setSaveIndicator('error', 'Submission failed');
    showToast('error', 'Could not submit evaluation', errorMessage(error));
  }
}

function applyReviewSubmitResult_(type, result) {
  if (!currentCycle || !result) return;
  const documentStatus =
    result.documentStatus || result.status || 'Submitted';
  if (type === 'manager') {
    currentCycle.managerReviewStatus = documentStatus;
    if (currentCycle.managerProgress) {
      currentCycle.managerProgress.percent = 100;
    }
  } else {
    currentCycle.selfEvaluationStatus = documentStatus;
    if (currentCycle.selfProgress) {
      currentCycle.selfProgress.percent = 100;
    }
  }
  // Never treat document "Submitted" as the Review Cycle Status.
  if (result.cycleStatus) {
    currentCycle.status = result.cycleStatus;
  }
  if (result.savedAtIso) currentCycle.updatedAtIso = result.savedAtIso;
  reconcileCycleSummaryAfterReviewSubmit_(type, result);
  setSaveIndicator('saved', 'Submitted');
  renderCycleWorkspace();
  setTopbar(
    currentCycle.employeeName + ' — ' + currentCycle.reviewType,
    humanStatus(currentCycle.status)
  );
  refreshLocalSummaryViews_();
}

function reconcileCycleSummaryAfterReviewSubmit_(type, result) {
  if (!state || !Array.isArray(state.cycles) || !currentCycle) return;
  const summary = state.cycles.find(function(item) {
    return String(item.cycleId) === String(currentCycle.cycleId);
  });
  if (!summary) return;
  const documentStatus =
    result.documentStatus || result.status || 'Submitted';
  if (result.cycleStatus) summary.status = result.cycleStatus;
  if (result.savedAt) summary.updatedAt = result.savedAt;
  if (result.savedAtIso) summary.updatedAtIso = result.savedAtIso;
  if (type === 'manager') {
    summary.managerReviewStatus = documentStatus;
    if (!summary.managerProgress) summary.managerProgress = {};
    summary.managerProgress.percent = 100;
  } else {
    summary.selfEvaluationStatus = documentStatus;
    if (!summary.selfProgress) summary.selfProgress = {};
    summary.selfProgress.percent = 100;
  }
  const ready =
    String(result.cycleStatus || '') === 'Ready for Review Meeting';
  if (
    (type === 'manager' && summary.actionKey === 'manager-review') ||
    (type === 'self' && summary.actionKey === 'self-evaluation')
  ) {
    if (ready && (summary.isManager || summary.isHr)) {
      summary.actionKey = 'meeting';
      summary.actionLabel = 'Start Review Meeting';
      summary.actionTone = 'primary';
      summary.actionRequired = true;
    } else {
      summary.actionRequired = false;
      summary.actionKey = 'overview';
      summary.actionLabel = 'Open Review';
      summary.actionTone = 'outline';
    }
  } else if (ready && (summary.isManager || summary.isHr)) {
    summary.actionKey = 'meeting';
    summary.actionLabel = 'Start Review Meeting';
    summary.actionTone = 'primary';
    summary.actionRequired = true;
  }
}

function refreshLocalSummaryViews_() {
  try {
    renderDashboard();
  } catch (error) {}
  try {
    renderReviewsView();
  } catch (error) {}
  try {
    renderSignaturesView();
  } catch (error) {}
  try {
    rebuildNotifications();
  } catch (error) {}
  try {
    updateSignatureNavCount_();
  } catch (error) {}
}

function validateReviewDraft(draft, type) {
  const errors = [];
  const warnings = [];
  const fieldErrors = {};
  const byId = ratingsById(draft && draft.ratings);

  state.factors.forEach(function(factor) {
    const item = byId[factor.id] || { rating: '', comments: '' };
    if (!item.rating) addValidationError(errors, fieldErrors, 'rating-' + type + '-' + factor.id, factor.label + ' requires a rating.', 0);
    const numeric = Number(item.rating);
    if (item.rating !== 'N/A' && [1,2,6,7].includes(numeric) && !String(item.comments || '').trim()) {
      addValidationError(errors, fieldErrors, 'comments-' + type + '-' + factor.id, factor.label + ' requires supporting comments for a rating of ' + item.rating + '.', 0);
    }
  });

  // Overall score is derived from factor ratings; block if no scored factors.
  if (!calculateClientOverallScore(draft)) {
    addValidationError(errors, fieldErrors, 'overall-' + type, 'Overall Score requires at least one scored competency rating.', 1);
  }
  if (!String(draft.overallComments || '').trim()) warnings.push({ message: 'Overall comments are blank.', step: 1 });
  else if (String(draft.overallComments).trim().length < 30) warnings.push({ message: 'Overall comments are very brief; consider adding more context.', step: 1 });

  const recommended = type === 'manager' ? [
    ['areasForImprovement', 'Areas for Improvement'], ['actionSteps', 'Action Steps'], ['supervisorComments', 'Supervisor Comments']
  ] : [
    ['keyAccomplishments', 'Key Accomplishments'], ['areasForGrowth', 'Areas for Growth'], ['goalsForNextPeriod', 'Goals for the Next Review Period'], ['supportNeeded', 'Support or Training Needed']
  ];
  recommended.forEach(function(item) { if (!String(draft[item[0]] || '').trim()) warnings.push({ message: item[1] + ' is blank.', step: 2 }); });
  return { errors: errors, warnings: warnings, fieldErrors: fieldErrors };
}

function addValidationError(errors, fieldErrors, fieldId, message, step) {
  errors.push({ fieldId: fieldId, message: message, step: step });
  fieldErrors[fieldId] = message;
}

function applyInlineValidation(type) {
  const model = editorState[type];
  const validation = model.validation || { fieldErrors: {} };
  document.querySelectorAll('#editorStepContent .invalid').forEach(function(element) { element.classList.remove('invalid'); });
  document.querySelectorAll('#editorStepContent .field-error').forEach(function(element) { element.classList.add('hidden'); element.textContent = ''; });
  if (!model.showErrors) return;
  Object.keys(validation.fieldErrors).forEach(function(fieldId) {
    const input = document.getElementById(fieldId);
    const error = document.getElementById('error-' + fieldId);
    if (input) { input.classList.add('invalid'); const factor = input.closest('.factor-card'); if (factor) factor.classList.add('invalid'); }
    if (error) { error.textContent = validation.fieldErrors[fieldId]; error.classList.remove('hidden'); }
  });
}

function calculateClientProgress(draft, type) {
  const validation = validateReviewDraft(draft, type);
  const byId = ratingsById(draft.ratings);
  let completed = state.factors.filter(function(factor) { return !!(byId[factor.id] || {}).rating; }).length;
  let total = state.factors.length;
  const fields = type === 'manager' ? ['overallComments','areasForImprovement','actionSteps','supervisorComments'] : ['overallComments','keyAccomplishments','areasForGrowth','goalsForNextPeriod','supportNeeded'];
  fields.forEach(function(field) { total++; if (String(draft[field] || '').trim()) completed++; });
  return { percent: Math.round(completed / total * 100), completed: completed, total: total, ratingsCompleted: state.factors.filter(function(factor) { return !!(byId[factor.id] || {}).rating; }).length, ratingsTotal: state.factors.length, errors: validation.errors, warnings: validation.warnings };
}

function isStepComplete(draft, type, step) {
  const validation = validateReviewDraft(draft, type);
  if (step === 0) return !validation.errors.some(function(item) { return item.step === 0; });
  if (step === 1) return !validation.errors.some(function(item) { return item.step === 1; }) && String(draft.overallComments || '').trim();
  if (step === 2) return !validation.warnings.some(function(item) { return item.step === 2; });
  return !validation.errors.length;
}

function setEditorStep(type, step) {
  flushVisibleDraftToState();
  editorState[type].step = Math.max(0, Math.min(step, EDITOR_STEPS[type].length - 1));
  renderReviewEditor(type, document.getElementById('cycleTabContent'));
}

function moveEditorStep(type, delta) { setEditorStep(type, editorState[type].step + delta); }

function updateEditorProgress(type) {
  const progress = calculateClientProgress(editorState[type].draft, type);
  const number = document.getElementById('editorProgressNumber');
  const fill = document.getElementById('editorProgressFill');
  const meta = document.getElementById('editorProgressMeta');
  if (number) number.textContent = progress.percent + '%';
  if (fill) fill.style.width = progress.percent + '%';
  if (meta) meta.textContent = progress.ratingsCompleted + ' of ' + progress.ratingsTotal + ' ratings · ' + progress.errors.length + ' required item(s) missing';
}

function editorSaveStatusText(type) {
  const model = editorState[type];
  if (model.saving) return 'Saving…';
  if (model.dirty) return 'Unsaved changes';
  if (model.lastSavedAt) return 'Last saved ' + formatLocalDateTime(model.lastSavedAt);
  return 'Draft not yet saved';
}

function updateEditorFooterStatus(type) {
  const target = document.getElementById('editorFooterStatus');
  if (target) target.textContent = editorSaveStatusText(type);
}

function flushVisibleDraftToState() {
  // Input listeners update draft state immediately; this function intentionally provides a stable hook before navigation.
}

function ratingsById(ratings) {
  const byId = {};
  (ratings || []).forEach(function(item) { byId[item.factorId] = item; });
  return byId;
}

function renderReadOnlyReview(review, type) {
  const byId = ratingsById(review.ratings);
  const factorRows = [];
  const seen = {};
  (state.factors || []).forEach(function(factor) {
    seen[factor.id] = true;
    const item = byId[factor.id] || {};
    factorRows.push({ label: factor.label, rating: item.rating, comments: item.comments });
  });
  if (currentCycle && currentCycle.historicalPreviousReview) {
    Object.keys(byId).forEach(function(factorId) {
      if (seen[factorId]) return;
      const item = byId[factorId] || {};
      factorRows.push({
        label: item.factorLabel || 'Historical factor',
        rating: item.rating,
        comments: item.comments
      });
    });
  }
  let html = '<div class="table-wrap"><table><thead><tr><th>Factor</th><th>Rating</th><th>Comments</th></tr></thead><tbody>';
  factorRows.forEach(function(row) {
    html += '<tr><td><strong>' + escapeHtml(row.label) + '</strong></td><td>' + escapeHtml(ratingLabel(row.rating)) + '</td><td>' + escapeHtml(row.comments || '') + '</td></tr>';

}

function initializeMeetingDraft(cycle) {
  meetingDraft = deepClone(cycle.meeting || {});
  meetingDirty = false;
  meetingLocalRevision = Number(
    (cycle.meeting && cycle.meeting.contentRevision) || 0
  );
  meetingLastAckedLocalRevision = 0;
  try {
    const stored = JSON.parse(localStorage.getItem(meetingStorageKey()) || 'null');
    const serverTime = new Date(meetingDraft.lastSavedAt || 0).getTime();
    const localTime = new Date(stored && stored.savedAt || 0).getTime();
    if (stored && stored.data && localTime > serverTime) {
      meetingDraft = stored.data;
      meetingDirty = true;
      meetingLocalRevision = Math.max(
        meetingLocalRevision + 1,
        Number(stored.localRevision || 0)
      );
    }
  } catch (error) {}
}
